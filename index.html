<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caixa Rocha — Financeiro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f9d6b'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='40' fill='white'%3EF%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0f0d;--panel:#121814;--panel-2:#18211c;--line:#23302a;
    --txt:#eaf2ed;--muted:#8aa096;--green:#3ddc91;--red:#ff6b6b;--gold:#e8c468;--amber:#f5b740;--blue:#7da2ff;
    --accent:#3ddc91;--accent-ink:#04130c;--chip:#1d2722;
    --shadow:0 1px 0 rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.4);
  }
  /* tema claro (botão ☀️/🌙 na barra de cima) */
  :root[data-theme="light"]{
    --bg:#f3f6f4;--panel:#ffffff;--panel-2:#eaf0ed;--line:#d6dfda;
    --txt:#14201a;--muted:#5c6e65;--green:#1f9d6b;--red:#d64545;--gold:#b58a1b;--amber:#c7861a;--blue:#3b63d9;
    --accent:#1f9d6b;--accent-ink:#ffffff;--chip:#e6ece9;
    --shadow:0 1px 0 rgba(0,0,0,.02),0 8px 24px rgba(20,32,26,.08);
  }
  :root[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c3cdc8}
  :root[data-theme="light"] .note{color:#2b47a8;background:rgba(59,99,217,.07);border-color:rgba(59,99,217,.25)}
  :root[data-theme="light"] .note b{color:#1d3480}
  .iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:15px;display:grid;place-items:center;flex-shrink:0}
  .iconbtn.help{background:#1f9d6b;border-color:#1f9d6b;color:#fff;font-weight:800;font-size:16px}
  .manual{max-width:860px;line-height:1.65;font-size:14.5px}
  .manual h1{font-size:22px;margin:4px 0 14px}.manual h2{font-size:17px;margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--line)}.manual h3{font-size:15px;margin:18px 0 8px}
  .manual p{margin:0 0 10px}.manual ul,.manual ol{margin:0 0 12px 22px}.manual li{margin-bottom:5px}
  .manual table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13.5px}.manual th,.manual td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}.manual th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
  .manual blockquote{border-left:3px solid var(--green);padding:6px 12px;margin:0 0 12px;color:var(--muted);background:var(--panel-2);border-radius:0 8px 8px 0}
  .manual code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12.5px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a3a32;border-radius:6px}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(61,220,145,.06),transparent 60%)}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:38px 32px;width:min(400px,94vw);box-shadow:var(--shadow)}
  .login-logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(140deg,#3ddc91,#1f9d6b);display:grid;place-items:center;font-weight:800;color:#04130c;font-size:26px;margin:0 auto 18px}
  .login-card h1{font-size:21px;text-align:center;margin-bottom:4px}
  .login-card .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:26px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px 15px;color:var(--txt);font-size:15px;outline:none}
  .field input:focus{border-color:var(--green)}
  .login-btn{width:100%;background:var(--green);color:var(--accent-ink);border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
  .login-btn:disabled{opacity:.6;cursor:wait}
  .login-err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:#ffc9c9;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:16px;display:none}
  .login-foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px}
  #app{display:none}
  #app.show{display:flex;min-height:100vh}
  .side{width:230px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0;transition:width .18s}
  .side.collapsed{width:62px}
  .brand{display:flex;align-items:center;gap:11px;padding:18px 16px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#3ddc91,#1f9d6b);display:grid;place-items:center;font-weight:800;color:#04130c;font-size:17px;flex-shrink:0}
  .brand b{font-size:16px;white-space:nowrap}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.5px}
  .burger{margin-left:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--txt);cursor:pointer;font-size:17px;width:34px;height:34px;display:grid;place-items:center;flex-shrink:0}
  .burger:hover{background:var(--line);color:var(--green)}
  .side.collapsed .brand b,.side.collapsed .brand small,.side.collapsed .navtxt{display:none}
  .side.collapsed .brand{justify-content:center;padding:18px 10px}.side.collapsed .logo{display:none}
  .side.collapsed .burger{margin:0 auto;width:42px;height:42px}
  nav{padding:8px 10px;flex:1;overflow-y:auto}
  .seclabel{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:12px 12px 5px}
  .side.collapsed .seclabel{display:none}
  .nav{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:550;white-space:nowrap;margin-bottom:2px;border:1px solid transparent;position:relative}
  .nav:hover{background:var(--panel-2);color:var(--txt)}
  .nav.active{background:linear-gradient(100deg,rgba(61,220,145,.16),rgba(61,220,145,.04));color:var(--green);border-color:rgba(61,220,145,.22)}
  .nav .ic{width:19px;text-align:center;font-size:15px;flex-shrink:0}
  .nav .soon{margin-left:auto;font-size:9px;background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:8px;font-weight:700}
  .side.collapsed .nav{justify-content:center;padding:11px}.side.collapsed .nav .soon{display:none}
  .side.collapsed .nav:hover::after{content:attr(data-label);position:absolute;left:58px;background:#000;color:#fff;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;white-space:nowrap;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .sidefoot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .side.collapsed .sidefoot{display:none}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:var(--bg)}
  .pagetitle{font-size:18px;font-weight:700}
  .store{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt);max-width:230px}
  .logout{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--txt);cursor:pointer;font-size:12px;padding:7px 12px}
  .logout:hover{border-color:var(--red);color:var(--red)}
  .content{padding:24px;max-width:1280px;width:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}@media(max-width:980px){.two{grid-template-columns:1fr}}
  .cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.cardhead h3{font-size:15px;font-weight:700}
  .tag{font-size:11px;color:var(--muted);background:var(--chip);padding:3px 10px;border-radius:20px}
  .quickbar{background:linear-gradient(100deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
  .quickrow{display:grid;gap:10px;align-items:end}
  .quickrow.l1{grid-template-columns:200px 130px 1fr 150px;margin-bottom:10px}
  .quickrow.l2{grid-template-columns:130px 1fr 1fr 150px}
  @media(max-width:900px){.quickrow.l1,.quickrow.l2{grid-template-columns:1fr 1fr}}
  .qlabel{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;display:block}
  .qin{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13.5px;outline:none;height:42px}
  .maiusc{text-transform:uppercase}
  .inlinesel{background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:4px 6px;cursor:pointer}
  .inlinesel:hover{border-color:var(--green)}
  .inlinesel.falta{border-color:var(--red);background:rgba(255,107,107,.08)}
  .combo{display:inline-flex;align-items:center;justify-content:space-between;gap:6px;height:32px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:4px 9px;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden}
  .combo:hover{border-color:var(--green)}
  .combo.falta{border-color:var(--red);background:rgba(255,107,107,.08)}
  .combo>span:first-child{overflow:hidden;text-overflow:ellipsis}
  .combo .arw{color:var(--muted);font-size:10px;flex-shrink:0}
  .combopanel{position:fixed;z-index:400;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 34px rgba(0,0,0,.55);width:270px;max-height:320px;display:flex;flex-direction:column;overflow:hidden}
  .combopanel #comboSearch{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 11px;font-size:13px;margin:9px;outline:none}
  .combopanel #comboSearch:focus{border-color:var(--green)}
  .combolist{overflow-y:auto;padding:0 7px 9px}
  .comboitem{padding:9px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--txt)}
  .comboitem:hover{background:var(--line)}
  .comboitem.clear{color:var(--muted);font-size:12px}
  .comboitem .csub{color:var(--muted);font-size:11px}
  select option,select optgroup{background:var(--panel-2);color:var(--txt)}
  select optgroup{font-weight:700;color:var(--muted)}
  .inlinedesc{width:100%;min-width:130px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--txt);padding:5px 7px;font-size:13px;font-family:inherit;outline:none}
  .inlinedesc:hover{border-color:var(--line)}
  .inlinedesc:focus{border-color:var(--green);background:var(--bg)}
  .modal input.maiusc{text-transform:uppercase}
  .qin:focus{border-color:var(--green)}
  .qin.calc{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
  .tipo-toggle{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden;height:42px}
  .tipo-toggle button{flex:1;background:none;border:none;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
  .tipo-toggle button.des{background:rgba(255,107,107,.15);color:var(--red)}
  .tipo-toggle button.rec{background:rgba(61,220,145,.15);color:var(--green)}
  .tipo-toggle button.tra{background:rgba(125,162,255,.15);color:var(--blue)}
  .addbtn{width:100%;height:42px;border:none;border-radius:9px;background:var(--green);color:var(--accent-ink);font-size:14px;font-weight:700;cursor:pointer}
  .addbtn:disabled{opacity:.6;cursor:wait}
  .miniadd{width:42px;height:42px;flex-shrink:0;border:1px solid var(--line);background:var(--panel-2);color:var(--green);border-radius:9px;font-size:18px;font-weight:700;cursor:pointer}
  .hint{font-size:11px;color:var(--muted);margin-top:9px;display:flex;gap:14px;flex-wrap:wrap}
  .kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:monospace;font-size:10.5px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px}
  .search input{background:none;border:none;outline:none;color:var(--txt);font-size:13.5px;width:100%}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:11px 13px;border-bottom:1px solid var(--line);font-weight:700}
  tbody td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr.neutra{background:rgba(125,162,255,.06)}
  .amt{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}
  .amt.green{color:var(--green)}.amt.red{color:var(--red)}.amt.blue{color:var(--blue)}
  .catchip{font-size:11.5px;background:var(--chip);padding:3px 11px;border-radius:20px;border:1px solid var(--line)}
  .catchip.neutra{border-color:var(--blue);color:var(--blue);background:rgba(125,162,255,.08)}
  .contchip{font-size:11.5px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
  .contchip.emp{background:rgba(232,196,104,.1);color:var(--gold);border-color:rgba(232,196,104,.3)}
  .contchip.func{background:rgba(125,162,255,.1);color:var(--blue);border-color:rgba(125,162,255,.3)}
  .parc{font-size:10.5px;color:var(--gold);background:rgba(232,196,104,.1);padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:700}
  .mut{color:var(--muted)}
  .delx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;opacity:.5}.delx:hover{opacity:1;color:var(--red)}
  .empty{text-align:center;padding:44px;color:var(--muted)}.empty .big{font-size:36px;margin-bottom:12px;opacity:.6}
  .cfgrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}.cfgrow:last-child{border:none}
  .grp{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;text-transform:uppercase}
  .grp.rec{background:rgba(61,220,145,.14);color:var(--green)}.grp.cmv{background:rgba(232,196,104,.14);color:var(--gold)}
  .grp.imp{background:rgba(192,132,252,.14);color:#c084fc}.grp.fixo{background:rgba(125,162,255,.14);color:var(--blue)}
  .grp.nop{background:rgba(255,107,107,.14);color:var(--red)}.grp.neutra{background:rgba(138,160,150,.18);color:var(--muted)}.grp.adef{background:rgba(245,183,64,.18);color:var(--amber)}
  .btn{background:var(--green);color:var(--accent-ink);border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line)}
  .arqbtn{margin-left:12px;font-size:11.5px;color:var(--muted);cursor:pointer;padding:3px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
  .arqbtn:hover{color:var(--amber);border-color:var(--amber)}.arqbtn.ativar:hover{color:var(--green);border-color:var(--green)}
  .note{background:rgba(125,162,255,.08);border:1px solid rgba(125,162,255,.2);border-radius:12px;padding:13px 15px;font-size:12.5px;color:#aec2ff;margin-bottom:16px;line-height:1.5}
  .note.soon{background:rgba(245,183,64,.08);border-color:rgba(245,183,64,.25);color:#f5d98a}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:100}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(440px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal h3{font-size:16px;margin-bottom:8px}.modal p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .modal input,.modal select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--txt);font-size:14px;outline:none;margin-bottom:14px}
  .modal .qlabel{margin-bottom:5px}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end}
  .err{color:var(--red);font-size:12px;margin-top:-8px;margin-bottom:12px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{text-align:center;padding:50px;color:var(--muted)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);color:#fff}
  .toast.ok{background:var(--green);color:#04130c}.toast.erro{background:var(--red)}
</style>
</head>
<body>
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <div class="login-logo">R</div>
      <h1>Caixa Rocha</h1>
      <div class="sub">Sistema Financeiro · entre para continuar</div>
      <div class="login-err" id="loginErr"></div>
      <div class="field"><label>E-mail</label><input type="email" id="email" placeholder="seu@email.com" autocomplete="username" /></div>
      <div class="field"><label>Senha</label><input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()" /></div>
      <button class="login-btn" id="loginBtn" onclick="fazerLogin()">Entrar</button>
      <div class="login-foot">Grupo Rocha · acesso restrito</div>
    </div>
  </div>

  <div id="app">
    <aside class="side" id="side">
      <div class="brand"><div class="logo">R</div><b>Caixa Rocha<small>FINANCEIRO</small></b>
        <button class="burger" id="burgerBtn" title="Fechar menu" onclick="toggleMenu()">‹</button></div>
      <nav id="nav"></nav>
      <div class="sidefoot" id="sidefoot">—</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <span class="pagetitle" id="ptitle">Dashboard</span>
        <select class="store" id="store" onchange="trocarLoja()"></select>
        <button class="iconbtn" id="temaBtn" onclick="alternarTema()" title="Tema claro / escuro">🌙</button>
        <button class="iconbtn help" onclick="go('manual')" title="Manual: como usar o sistema">?</button>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          <button class="logout" onclick="sair()">Sair</button>
          <span id="versao" class="mut" style="font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap" title="Versão do sistema"></span>
        </div>
      </div>
      <div class="content" id="content"><div class="loading"><span class="spin"></span> Carregando...</div></div>
    </div>
  </div>
  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
  let sb=null, conectado=false;
  let USER=null, PERFIL={nome:'',papel:''};
  let LOJAS=[], CATS=[], CONTATOS=[], CONTAS=[], LANC=[];
  let lojaAtual=null;
  let page='visao', tipo='des', q='', busy=false;
  let filtroDia=''; // '' = todos os dias; senão 'YYYY-MM-DD'

  const BRL=n=>(n<0?'-':'')+'R$ '+Math.abs(Number(n)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const GRUPOS={rec:{nome:'Receita',cls:'rec'},cmv:{nome:'CMV',cls:'cmv'},imp:{nome:'Imposto',cls:'imp'},fixo:{nome:'Custo Fixo',cls:'fixo'},nop:{nome:'Não Operacional',cls:'nop'},neutra:{nome:'Neutra',cls:'neutra'},adef:{nome:'A definir',cls:'adef'}};
  const ANO_FIXO=2026;
  // Versão do sistema — some um número a cada atualização e anote no histórico do manual
  const APP_VERSAO='1.3', APP_DATA='20/10/2026';

  // ---- TEMA claro/escuro (fica salvo no navegador de cada pessoa) ----
  function aplicarTema(t){document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');const b=document.getElementById('temaBtn');if(b)b.textContent=t==='light'?'☀️':'🌙';}

  // ---- MANUAL (lê o arquivo manual.md que fica na mesma pasta do index.html) ----
  function mdParaHTML(md){
    const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<i>$1</i>');
    const lines=md.replace(/\r/g,'').split('\n');let html='',i=0;
    while(i<lines.length){
      const L=lines[i];
      if(/^\s*$/.test(L)){i++;continue;}
      if(/^#{1,3} /.test(L)){const n=L.match(/^#+/)[0].length;html+=`<h${n}>${inline(L.replace(/^#+ /,''))}</h${n}>`;i++;continue;}
      if(/^\|/.test(L)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
        const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
        const body=rows.filter(r=>!/^\|\s*-{2,}/.test(r));
        html+='<table>'+body.map((r,k)=>'<tr>'+cells(r).map(c=>k===0?`<th>${inline(c)}</th>`:`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue;}
      if(/^> /.test(L)){let t=[];while(i<lines.length&&/^> ?/.test(lines[i])){t.push(lines[i].replace(/^> ?/,''));i++;}html+=`<blockquote>${inline(t.join(' '))}</blockquote>`;continue;}
      if(/^(\d+)\. /.test(L)||/^[-*] /.test(L)){const ord=/^\d+\. /.test(L);const tag=ord?'ol':'ul';let items=[];
        while(i<lines.length&&(/^(\d+)\. /.test(lines[i])||/^[-*] /.test(lines[i])||/^\s{2,}\S/.test(lines[i]))){const ln=lines[i];if(/^\s{2,}\S/.test(ln)&&items.length){items[items.length-1]+=' '+ln.trim();}else{items.push(ln.replace(/^(\d+\. |[-*] )/,''));}i++;}
        html+=`<${tag}>`+items.map(x=>`<li>${inline(x)}</li>`).join('')+`</${tag}>`;continue;}
      if(/^---+$/.test(L)){i++;continue;}
      let t=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,3} |\||> |\d+\. |[-*] |---)/.test(lines[i])){t.push(lines[i]);i++;}
      html+=`<p>${inline(t.join(' '))}</p>`;
    }
    return html;
  }

  // gera só os totais + tabela (usado pela busca sem redesenhar a barra)
  function htmlResultadoLanc(rows,somaE,somaS){
    const editavel=podeEditar();
    const tr=rows.map(l=>{
      const cat=l.categorias||{};const cont=l.contatos||{};const neutra=cat.grupo==='neutra';
      const saida=l.valor<0;
      // seletor de categoria inline
      const selCat=editavel?`<div style="display:flex;gap:3px;align-items:center"><div class="combo" style="min-width:120px" onclick="abrirComboCatLanc(this,${l.id})"><span>${cat.nome||'⚠ categoria'}</span><span class="arw">▾</span></div><button class="miniadd" style="width:28px;height:28px;font-size:15px" title="Nova categoria" onclick="abrirNovaCat(${l.id})">+</button></div>`:`<span class="catchip ${neutra?'neutra':''}">${cat.nome||'—'}</span>`;
      // seletor de contato inline (vermelho se saída sem contato)
      const faltaContato=saida&&!l.contato_id;
      const selCont=editavel?`<div style="display:flex;gap:3px;align-items:center"><div class="combo ${faltaContato?'falta':''}" style="min-width:110px" onclick="abrirComboContLanc(this,${l.id})"><span>${cont.nome||(saida?'⚠ contato':'— contato')}</span><span class="arw">▾</span></div><button class="miniadd" style="width:28px;height:28px;font-size:15px" title="Novo contato" onclick="abrirNovoContato(${l.id})">+</button></div>`:(cont.nome?`<span class="contchip ${cont.tipo==='funcionario'?'func':'emp'}">${cont.nome}</span>`:'—');
      // seletor de conta inline
      // conta: sempre Sicoob (banco), não precisa mostrar/editar na lista
      return `<tr class="${neutra?'neutra':''}">
        <td class="mut" style="white-space:nowrap">${isoParaBR(l.data).slice(0,5)}</td>
        <td style="min-width:140px">${editavel?`<input class="inlinedesc maiusc" value="${(l.descricao||'').replace(/"/g,'&quot;')}" onchange="mudarDescLanc(${l.id},this.value)" title="Clique pra editar">`:l.descricao}${l.parcela?`<span class="parc">${l.parcela}</span>`:''}</td>
        <td>${selCat}</td>
        <td>${selCont}</td>
        <td class="amt ${l.valor>0?'green':'red'}" style="white-space:nowrap">${l.valor>0?'+':'-'}${BRL(Math.abs(l.valor))}</td>
        <td style="text-align:center;white-space:nowrap">${editavel?`<button class="delx" onclick="abrirEditarLanc(${l.id})" title="Editar tudo">✏️</button> <button class="delx" onclick="excluirLanc(${l.id})" title="Excluir">🗑</button>`:''}</td>
      </tr>`;
    }).join('');
    return `<div style="display:flex;gap:16px;margin-bottom:12px;font-size:12.5px;flex-wrap:wrap">
        <span class="mut">${rows.length} lançamento(s)</span>
        <span style="color:var(--green)">Entradas: ${BRL(somaE)}</span>
        <span style="color:var(--red)">Saídas: ${BRL(somaS)}</span>
        <span style="font-weight:700">Saldo: ${BRL(somaE-somaS)}</span>
      </div>
      <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Contato</th><th style="text-align:right">Valor</th><th></th></tr></thead><tbody>${tr}</tbody></table>${rows.length===0?'<div class="empty"><div class="big">📭</div>Nenhum lançamento'+(filtroDia?' nesse dia.':' ainda. Lance o primeiro acima!')+'</div>':''}</div>`;
  }
  // muda a descrição direto na linha
  async function mudarDescLanc(id,valor){
    const l=LANC.find(x=>x.id===id);if(!l)return;
    if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    const desc=(valor||'').toUpperCase();
    const {data,error}=await sb.from('lancamentos').update({descricao:desc}).eq('id',id).select();
    if(error){toast('Erro ao salvar: '+error.message,'erro');return;}
    if(!data||data.length===0){toast('⚠️ NÃO salvou! Sem permissão para editar este lançamento.','erro');return;}
    l.descricao=desc;toast('Descrição salva!','ok');
  }
  // muda um campo direto na linha e salva no banco
  async function mudarCampoLanc(id,campo,valor){
    const l=LANC.find(x=>x.id===id);if(!l)return;
    if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    const val=valor||null;
    const {data,error}=await sb.from('lancamentos').update({[campo]:val}).eq('id',id).select();
    if(error){toast('Erro ao salvar: '+error.message,'erro');return;}
    if(!data||data.length===0){toast('⚠️ NÃO salvou! Sem permissão para editar este lançamento.','erro');return;}
    l[campo]=val;
    // atualiza os dados aninhados pra refletir
    if(campo==='categoria_id'){const c=CATS.find(x=>x.id==val);l.categorias=c?{nome:c.nome,grupo:c.grupo}:null;}
    if(campo==='contato_id'){const c=CONTATOS.find(x=>x.id==val);l.contatos=c?{nome:c.nome,tipo:c.tipo}:null;}
    if(campo==='conta_id'){const c=CONTAS.find(x=>x.id==val);l.contas=c?{nome:c.nome}:null;}
    toast('Salvo!','ok');
  }
  // filtra os lançamentos pela busca, atualizando SÓ a tabela (sem recriar a barra)
  function filtrarLanc(valor){
    q=valor;
    const qn=q.replace(/[^0-9,]/g,'').replace(',','.');
    const rows=LANC.filter(l=>{
      const m=parseInt(l.data.split('-')[1],10)-1;
      if(m!==mesSel)return false;
      if(filtroDia && l.data!==filtroDia)return false;
      if(!q)return true;
      const cat=(l.categorias&&l.categorias.nome)||'';const cont=(l.contatos&&l.contatos.nome)||'';
      const txt=(l.descricao||'').toLowerCase().includes(q.toLowerCase())||cat.toLowerCase().includes(q.toLowerCase())||cont.toLowerCase().includes(q.toLowerCase());
      const val=qn&&Math.abs(l.valor).toFixed(2).includes(qn);return txt||val;
    });
    let somaE=0,somaS=0;rows.forEach(l=>{if(l.valor>0)somaE+=Number(l.valor);else somaS+=Math.abs(Number(l.valor));});
    const box=document.getElementById('lancResultado');
    if(box)box.innerHTML=htmlResultadoLanc(rows,somaE,somaS);
  }
  function navDia(d){
    // se não tem dia filtrado, começa do primeiro lançamento
    if(!filtroDia){if(LANC.length){filtroDia=LANC[0].data;}return render();}
    const dt=new Date(filtroDia+'T12:00:00');dt.setDate(dt.getDate()+d);
    filtroDia=dt.toISOString().slice(0,10);render();
  }
  function setTipo(t){tipo=t;render();}

  async function salvarLanc(){
    if(busy)return;
    const desc=document.getElementById('qDesc').value.trim();
    const cents=parseInt(document.getElementById('qVal').dataset.cents||'0',10);
    const catId=document.getElementById('qCat').value;
    const contatoId=document.getElementById('qContato').value;
    const pa=document.getElementById('qParcA').value,pb=document.getElementById('qParcB').value;
    const parc=(pa&&pb)?`${pa}/${pb}`:null;
    const dataStr=document.getElementById('qData').value;
    const doc=document.getElementById('qDoc').value.trim();
    const contaBancoLanc=CONTAS.find(c=>/sicoob/i.test(c.nome))||CONTAS.find(c=>!/caixinha/i.test(c.nome));
    const contaId=contaBancoLanc?contaBancoLanc.id:null;
    const isTra=tipo==='tra';
    if(!desc){toast('Preencha a descrição','erro');return;}
    if(!cents){toast('Preencha o valor','erro');return;}
    const iso=dataParaISO(dataStr);
    if(!iso){toast('Data inválida (use dia/mês)','erro');return;}
    if(!catId){toast('Escolha a categoria','erro');return;}
    if(!contatoId && categoriaExigeContato(catId)){toast('Para Funcionários, escolha o contato (qual funcionário)','erro');return;}
    if(bloqueadoPorFechamento(iso,contaId))return;
    const v=cents/100;
    const tipoDb=isTra?'transferencia':(tipo==='rec'?'receita':'despesa');
    const valor=(tipo==='rec')?v:-v;
    busy=true;const btn=document.getElementById('btnLancar');if(btn){btn.disabled=true;btn.textContent='Salvando...';}
    const {error}=await sb.from('lancamentos').insert({
      loja_id:lojaAtual,conta_id:contaId||null,data:iso,descricao:desc.toUpperCase(),
      valor,tipo:tipoDb,categoria_id:catId,contato_id:contatoId,parcela:parc,
      documento:doc||null,pago:true,origem:'manual',criado_por:USER.id
    });
    busy=false;
    if(error){toast('Erro ao salvar: '+error.message,'erro');if(btn){btn.disabled=false;btn.textContent='+ Lançar';}return;}
    toast('Lançamento salvo!','ok');await viewLanc();
  }
  async function excluirLanc(id){
    const senha=prompt('Digite a senha para excluir este lançamento:');
    if(senha===null)return;
    if(senha!=='1234'){toast('Senha incorreta','erro');return;}
    const l=LANC.find(x=>x.id===id);
    if(l&&bloqueadoPorFechamento(l.data,l.conta_id))return;
    await sb.from('lixeira').insert({loja_id:lojaAtual,dados:l,excluido_por:USER.id});
    const {error}=await sb.from('lancamentos').delete().eq('id',id);
    if(error){toast('Erro ao excluir: '+error.message,'erro');return;}
    _keepY=window.scrollY;toast('Excluído (foi pra lixeira)','ok');await viewLanc();
  }

    document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal">
      <h3>✏️ Editar lançamento</h3>
      ${l.valor>0
        ?'<div style="background:rgba(61,220,145,.15);border:1px solid rgba(61,220,145,.4);color:var(--green);border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;margin-bottom:14px;text-align:center">🟢 ENTRADA — recebimento de dinheiro</div>'

  async function salvarEditarLanc(id,proximo,anterior){
    const l=LANC.find(x=>x.id===id);
    const cat=document.getElementById('edCat').value;const contato=document.getElementById('edContato').value;
    if(!cat){document.getElementById('edErr').innerHTML='<div class="err">Escolha a categoria.</div>';return;}
    if(!contato && categoriaExigeContato(cat)){document.getElementById('edErr').innerHTML='<div class="err">Para Funcionários, escolha qual funcionário.</div>';return;}
    const cents=parseInt(document.getElementById('edVal').dataset.cents||'0',10);
    const pa=document.getElementById('edParcA').value,pb=document.getElementById('edParcB').value;
    const iso=dataParaISO(document.getElementById('edData').value)||l.data;
    const contaNova=document.getElementById('edConta').value||null;
    if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    if(bloqueadoPorFechamento(iso,contaNova))return;
    const {error}=await sb.from('lancamentos').update({
      data:iso,descricao:document.getElementById('edDesc').value.toUpperCase(),
      valor:(l.valor<0?-1:1)*(cents/100),categoria_id:cat,contato_id:contato,
      conta_id:document.getElementById('edConta').value||null,
      parcela:(pa&&pb)?`${pa}/${pb}`:null,documento:document.getElementById('edDoc').value||null
    }).eq('id',id);
    if(error){toast('Erro: '+error.message,'erro');return;}
    Object.assign(l,{data:iso,descricao:document.getElementById('edDesc').value.toUpperCase(),valor:(l.valor<0?-1:1)*(cents/100),categoria_id:cat,contato_id:contato});
    const catObj=CATS.find(c=>c.id==cat);if(catObj)l.categorias={nome:catObj.nome,grupo:catObj.grupo};
    const contObj=CONTATOS.find(c=>c.id==contato);if(contObj)l.contatos={nome:contObj.nome,tipo:contObj.tipo};
    const idx=LANC.findIndex(x=>x.id===id);
    if(anterior){
      const ant=LANC[idx-1];
      if(ant){toast('Salvo! ← Anterior','ok');filtrarLanc(q);abrirEditarLanc(ant.id);return;}
      else {toast('Salvo! Era o primeiro.','ok');fecharModal();filtrarLanc(q);return;}
    }
    if(proximo){
      const prox=LANC[idx+1];
      if(prox){toast('Salvo! Próximo →','ok');filtrarLanc(q);abrirEditarLanc(prox.id);return;}
      else {toast('Salvo! Era o último.','ok');fecharModal();await viewLanc();return;}
    }
    fecharModal();toast('Salvo!','ok');filtrarLanc(q);
  }

  async function salvarNovaCat(){
    const nome=document.getElementById('ncNome').value.trim().toUpperCase();const grupo=document.getElementById('ncGrupo').value;
    if(!nome){document.getElementById('ncErr').innerHTML='<div class="err">Digite o nome.</div>';return;}
    const {data,error}=await sb.from('categorias').insert({loja_id:null,nome,grupo}).select().single();
    if(error){document.getElementById('ncErr').innerHTML='<div class="err">'+error.message+'</div>';return;}
    CATS.push(data);

  // ---- DRE ----
  async function viewDRE(){
    document.getElementById('content').innerHTML='<div class="loading"><span class="spin"></span> Calculando DRE...</div>';
    await carregarLancAno();
    // soma por mês e grupo
    const meses=Array.from({length:12},(_,i)=>({rec:0,cmv:0,imp:0,fixo:0,nop:0}));
    LANC_ANO.forEach(l=>{
      const g=l.categorias&&l.categorias.grupo;if(!g||g==='neutra'||g==='adef')return;
      const m=parseInt(l.data.split('-')[1],10)-1;
      const v=Math.abs(Number(l.valor));
      if(meses[m][g]!==undefined)meses[m][g]+=v;
    });
    // só mostra meses que têm algum movimento
    const comDados=[];
    meses.forEach((m,i)=>{if(m.rec||m.cmv||m.imp||m.fixo||m.nop)comDados.push(i);});
    if(comDados.length===0){
      document.getElementById('content').innerHTML=`<div class="note">📊 <b>DRE</b> — mostra o resultado (lucro) calculado dos seus lançamentos, mês a mês.</div><div class="card empty"><div class="big">📊</div><b>Ainda sem dados pra montar o DRE</b><div style="margin-top:6px">Conforme você for lançando, o DRE se preenche sozinho aqui. Lance receitas e despesas em <b>Lançamentos</b> e volte.</div></div>`;
      return;
    }
    let saldoAnt=0;
    const cols=comDados.map(i=>{
      const d=meses[i];const margem=d.rec-d.cmv;const resultOp=margem-d.imp-d.fixo;const resultFinal=resultOp-d.nop;const saldoAtual=saldoAnt+resultFinal;
      const r={mesNome:MESES_NOME[i],...d,margem,resultOp,resultFinal,saldoAnt,saldoAtual};saldoAnt=saldoAtual;return r;
    });
    const av=(v,rec)=>rec?`<span style="color:var(--muted);font-size:11px">${(v/rec*100).toFixed(1).replace('.',',')}%</span>`:'';
    const head=`<th></th><th>Conta</th>`+cols.map(c=>`<th style="text-align:right">${c.mesNome}</th>`).join('');
    // linha clicável por grupo: clica na célula do mês → abre lançamentos daquele grupo naquele mês
    const lineG=(op,nome,key,grupoKey,o={})=>`<tr class="${o.cls||''}"><td style="text-align:center;color:var(--muted);font-weight:700">${op}</td><td>${nome}</td>`+cols.map((c,ci)=>{const v=o.sign?o.sign*c[key]:c[key];const mesIdx=comDados[ci];const clic=grupoKey?`onclick="abrirDetalheGrupoDRE('${grupoKey}',${mesIdx})" style="text-align:right;cursor:pointer;${v<0?'color:var(--red)':''}" onmouseover="this.style.background='rgba(255,255,255,.04)'" onmouseout="this.style.background='transparent'" title="Ver lançamentos"`:`style="text-align:right;${v<0?'color:var(--red)':''}"`;return `<td ${clic}>${BRL(v)}<br>${av(Math.abs(c[key]),c.rec)}${grupoKey?' <span class="mut" style="font-size:10px">›</span>':''}</td>`}).join('')+`</tr>`;
    const line=(op,nome,key,o={})=>`<tr class="${o.cls||''}"><td style="text-align:center;color:var(--muted);font-weight:700">${op}</td><td>${nome}</td>`+cols.map(c=>{const v=o.sign?o.sign*c[key]:c[key];return `<td style="text-align:right;${v<0?'color:var(--red)':''}">${BRL(v)}<br>${av(Math.abs(c[key]),c.rec)}</td>`}).join('')+`</tr>`;
    const sl=(nome,key)=>`<tr style="font-size:12px;color:var(--muted)"><td></td><td>${nome}</td>`+cols.map(c=>`<td style="text-align:right"><b style="color:var(--txt)">${BRL(c[key])}</b></td>`).join('')+`</tr>`;
    document.getElementById('content').innerHTML=`<div class="note">📊 <b>DRE</b> — calculado de verdade dos seus lançamentos. 💡 <b>Clique num valor</b> (Receita, CMV, Custo Fixo...) pra ver e corrigir os lançamentos daquele grupo no mês.</div>
    <div class="card"><div class="cardhead"><h3>DRE — ${LOJAS.find(l=>l.id===lojaAtual)?.nome||''}</h3><span class="tag">${ANO_FIXO}</span></div>
    <div style="overflow-x:auto"><table style="font-variant-numeric:tabular-nums;font-size:12.5px"><thead><tr>${head}</tr></thead><tbody>
      ${lineG('','Receita','rec','rec')}
      ${lineG('−','Custo da Mercadoria (CMV)','cmv','cmv',{sign:-1})}
      ${line('=','Margem de Contribuição','margem',{cls:''})}
      ${lineG('−','Imposto','imp','imp',{sign:-1})}
      ${lineG('−','Custo Fixo','fixo','fixo',{sign:-1})}
      ${line('=','Resultado Operacional','resultOp')}
      ${lineG('−','Não Operacional','nop','nop',{sign:-1})}
      ${line('=','Resultado Final','resultFinal')}
      ${sl('Saldo anterior','saldoAnt')}
      ${sl('Saldo atual','saldoAtual')}
    </tbody></table></div></div>`;
  }
  // abre janela com os lançamentos de um GRUPO do DRE num mês, podendo corrigir categoria e grupo
  async function abrirDetalheGrupoDRE(grupoKey,mesIdx){
    document.getElementById('modalRoot').innerHTML='<div class="modal-bg"><div class="modal"><div class="loading"><span class="spin"></span> Carregando...</div></div></div>';
    // busca lançamentos completos do mês/grupo (usa o 1º dia do mês seguinte pra pegar o mês inteiro)
    const ini=`${ANO_FIXO}-${String(mesIdx+1).padStart(2,'0')}-01`;
    const proxMes=mesIdx+1>=12?`${ANO_FIXO+1}-01-01`:`${ANO_FIXO}-${String(mesIdx+2).padStart(2,'0')}-01`;
    const {data}=await sb.from('lancamentos').select('id,data,valor,descricao,categoria_id,categorias(nome,grupo),contatos(nome)').eq('loja_id',lojaAtual).gte('data',ini).lt('data',proxMes).limit(2000);
    const lista=(data||[]).filter(l=>{const g=l.categorias&&l.categorias.grupo;return g===grupoKey;}).sort((a,b)=>a.data.localeCompare(b.data));
    let total=0;
    // opções dos 7 grupos do DRE pra troca rápida
    const ordemG=['rec','cmv','imp','fixo','nop','neutra','adef'];
    const grpOpts=(sel)=>ordemG.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${GRUPOS[k].nome}</option>`).join('');
    const rows=lista.map(l=>{total+=Math.abs(Number(l.valor));const gAtual=(l.categorias&&l.categorias.grupo)||'adef';
      // etiqueta do grupo que vira seletor ao clicar
      const grupoCel=podeEditar()
        ?`<span class="grp ${gAtual}" style="cursor:pointer" title="Clique pra trocar o grupo" onclick="this.style.display='none';this.nextElementSibling.style.display='inline-block';this.nextElementSibling.focus()">${GRUPOS[gAtual].nome} ✎</span><select class="qin inlinesel" style="display:none;height:28px;font-size:11px;min-width:120px" onchange="mudarGrupoDeLancDRE(${l.categoria_id},this.value,'${grupoKey}',${mesIdx})" onblur="this.style.display='none';this.previousElementSibling.style.display='inline-block'">${grpOpts(gAtual)}</select>`
        :`<span class="grp ${gAtual}">${GRUPOS[gAtual].nome}</span>`;
      return `<tr>
      <td class="mut" style="white-space:nowrap;font-size:12px">${isoParaBR(l.data).slice(0,5)}</td>
      <td style="font-size:12.5px">${l.descricao||'—'}</td>
      <td class="mut" style="font-size:11.5px">${l.categorias?.nome||'—'}</td>
      <td>${grupoCel}</td>
      <td class="amt ${l.valor<0?'red':'green'}" style="white-space:nowrap;text-align:right;font-size:12.5px">${l.valor<0?'-':'+'}${BRL(Math.abs(l.valor))}</td>
    </tr>`;}).join('');
    const nomeGrupo=GRUPOS[grupoKey]?GRUPOS[grupoKey].nome:grupoKey;
    document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal" style="max-width:760px;width:96vw">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="margin:0"><span class="grp ${grupoKey}">${nomeGrupo}</span> — ${MESES_NOME[mesIdx]}</h3><button class="delx" style="font-size:18px" onclick="fecharModal()">✕</button></div>
      <p style="margin-top:4px;font-size:12.5px">${lista.length} lançamento(s). Passe o olho pra conferir. Pra trocar o grupo, clique na etiqueta (✎). <b style="color:var(--amber)">Muda a categoria inteira.</b></p>
      <div style="max-height:60vh;overflow-y:auto;overflow-x:hidden"><table style="width:100%;table-layout:fixed"><thead><tr><th style="width:42px">Data</th><th>Descrição</th><th style="width:120px">Categoria</th><th style="width:130px">Grupo</th><th style="width:90px;text-align:right">Valor</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="mut" style="text-align:center;padding:20px">Nenhum lançamento</td></tr>'}</tbody></table></div>
      <div style="display:flex;justify-content:space-between;border-top:2px solid var(--line);margin-top:10px;padding-top:10px"><b>Total</b><b style="font-size:16px">${BRL(total)}</b></div>
    </div></div>`;
  }
  // troca o GRUPO de uma categoria (afeta todos os lançamentos dela) a partir da janela do DRE
  async function mudarGrupoDeLancDRE(catId,grupo,grupoKey,mesIdx){
    if(!catId){toast('Este lançamento está sem categoria. Defina a categoria em Lançamentos primeiro.','erro');return;}
    if(!grupo)return;
    const {error}=await sb.from('categorias').update({grupo}).eq('id',catId);
    if(error){toast('Erro: '+error.message,'erro');return;}
    const c=CATS.find(x=>x.id==catId);if(c)c.grupo=grupo;
    toast('Grupo alterado (categoria inteira)!','ok');
    abrirDetalheGrupoDRE(grupoKey,mesIdx);
  }

  // ---- FECHAMENTO DO MÊS ----
  function seletorMes(){return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 14px;width:fit-content">
    <button class="burger" style="width:32px;height:32px" onclick="navMes(-1)">‹</button>
    <span style="font-weight:700;font-size:14px;min-width:130px;text-align:center">${MESES_NOME[mesSel]} ${ANO_FIXO}</span>
    <button class="burger" style="width:32px;height:32px" onclick="navMes(1)">›</button></div>`;}
  function navMes(d){mesSel+=d;if(mesSel<0)mesSel=0;if(mesSel>11)mesSel=11;filtroDia='';render();}
  // ---- FECHAMENTO DO MÊS (saldo por mês, saldo real no fim do mês, fechar/travar) ----
  // Fechamentos do ano desta loja: mes(1-12) -> linha da tabela fechamentos
  let FECH_ANO={};
  async function carregarFechamentos(){
    FECH_ANO={};
    try{const {data}=await sb.from('fechamentos').select('*').eq('loja_id',lojaAtual).eq('ano',ANO_FIXO);(data||[]).forEach(r=>{FECH_ANO[r.mes]=r;});}catch(e){}
  }
  function contaEhCaixinha(contaId){const c=CONTAS.find(x=>x.id==contaId);return !!(c&&/caixinha/i.test(c.nome));}
  function mesFechadoISO(iso){
    if(!iso)return false;const p=String(iso).split('-');if(parseInt(p[0],10)!==ANO_FIXO)return false;
    const r=FECH_ANO[parseInt(p[1],10)];return !!(r&&r.fechado);
  }
  // true = bloqueado (já avisa). A caixinha não entra no bloqueio.
  function bloqueadoPorFechamento(iso,contaId){
    if(contaId&&contaEhCaixinha(contaId))return false;
    if(!mesFechadoISO(iso))return false;
    const m=parseInt(String(iso).split('-')[1],10);
    toast(`🔐 ${MESES_NOME[m-1]} está fechado. Para mexer, o dono precisa reabrir o mês em "Fechamento do mês".`,'erro');
    return true;
  }
  const _mm=mi=>String(mi+1).padStart(2,'0');
  function _ultimoDiaBR(mi){const d=new Date(ANO_FIXO,mi+1,0).getDate();return `${String(d).padStart(2,'0')}/${_mm(mi)}`;}
  function _saldosDe(row,contaId){const s=(row&&row.saldos)||{};return s[String(contaId)]||{};}
  // movimento (sem neutras) de uma conta num mês, a partir de LANC_ANO
  function _movMes(contaId,mi){
    let e=0,s=0;
    LANC_ANO.forEach(l=>{if(l.conta_id!==contaId)return;const m=parseInt(l.data.split('-')[1],10)-1;if(m!==mi)return;const v=Number(l.valor);if(v>0)e+=v;else s+=Math.abs(v);});
    return {ent:e,sai:s};
  }
  // Saldo inicial da conta no mês: (1) copiado do último mês anterior fechado, (2) digitado neste mês, (3) calculado
  function _saldoInicialMes(conta,mi,antesDoAno){
    for(let k=mi-1;k>=0;k--){
      const r=FECH_ANO[k+1];if(!(r&&r.fechado))continue;
      const s=_saldosDe(r,conta.id);if(s.real==null)continue;
      let v=Number(s.real);for(let j=k+1;j<mi;j++){const mv=_movMes(conta.id,j);v+=mv.ent-mv.sai;}
      return {valor:v,origem:'anterior',mesBase:k};
    }
    const s=_saldosDe(FECH_ANO[mi+1],conta.id);
    if(s.inicial_manual!=null)return {valor:Number(s.inicial_manual),origem:'manual',por:s.inicial_por||'',motivo:s.inicial_motivo||''};
    let v=Number(conta.saldo_inicial_banco||0)+(antesDoAno[conta.id]||0);
    for(let j=0;j<mi;j++){const mv=_movMes(conta.id,j);v+=mv.ent-mv.sai;}
    return {valor:v,origem:'calculado'};
  }
  let _escadas=[]; // último cálculo da tela (pra fechar o mês)
  function _fmtTs(ts){if(!ts)return '';const d=new Date(ts);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}

  async function viewFechamento(){
    document.getElementById('content').innerHTML='<div class="loading"><span class="spin"></span> Carregando...</div>';
    await carregarContas();await carregarLancAno();await carregarFechamentos();
    // o que aconteceu antes do ano (pra calcular o saldo inicial quando nenhum mês anterior foi fechado)
    const {data:antesRows}=await sb.from('lancamentos').select('valor,conta_id,categorias(grupo)').eq('loja_id',lojaAtual).lt('data',ANO_FIXO+'-01-01');
    const antes={};(antesRows||[]).forEach(l=>{if(!l.conta_id)return;antes[l.conta_id]=(antes[l.conta_id]||0)+Number(l.valor);});
    const row=FECH_ANO[mesSel+1]||null;const fechado=!!(row&&row.fechado);
    const mesNome=MESES_NOME[mesSel],ult=_ultimoDiaBR(mesSel);
    const bancos=CONTAS.filter(c=>!/caixinha/i.test(c.nome));
    // resumo do mês (sem saldo inicial) + lançamentos sem categoria
    let entradas=0,saidas=0,semCat=0;
    LANC_ANO.forEach(l=>{
      const m=parseInt(l.data.split('-')[1],10)-1;if(m!==mesSel)return;
      const g=l.categorias&&l.categorias.grupo;
      if(!l.categorias||g==='adef')semCat++;
      if(g==='neutra')return;
      const v=Number(l.valor);if(v>0)entradas+=v;else saidas+=Math.abs(v);
    });
    const resultado=entradas-saidas;
    const cxHTML=await cxBlocoFechamento();
    _escadas=[];
    const escadasHTML=bancos.map(c=>{
      const si=_saldoInicialMes(c,mesSel,antes);const mv=_movMes(c.id,mesSel);const calc=si.valor+mv.ent-mv.sai;
      const s=_saldosDe(row,c.id);const real=(s.real!=null)?Number(s.real):null;
      _escadas.push({id:c.id,nome:c.nome,calc,real});
      const origemTxt=si.origem==='anterior'?`copiado do fechamento de ${MESES_NOME[si.mesBase]}`:(si.origem==='manual'?`digitado por ${si.por||'—'}${si.motivo?' · '+si.motivo:''}`:'calculado pelo sistema — confira com o extrato');
      const podeCorrigir=!fechado&&podeEditar()&&si.origem!=='anterior';
      const neg=real!=null&&real<0;
      return `<div class="card" style="margin-bottom:12px">
        <div class="cardhead"><h3>🏦 ${c.nome} — ${mesNome}</h3>${fechado?'<span class="catchip" style="border-color:var(--green);color:var(--green)">🔐 fechado</span>':''}</div>
        <div class="cfgrow"><span>Saldo inicial em 01/${_mm(mesSel)}<br><span class="mut" style="font-size:11px">${origemTxt}</span></span><b style="margin-left:auto;color:${si.valor<0?'var(--red)':'var(--txt)'};font-variant-numeric:tabular-nums">${BRL(si.valor)}</b>${podeCorrigir?`<button class="btn ghost" style="padding:4px 9px;margin-left:8px" title="Corrigir saldo inicial (pede motivo)" onclick="abrirCorrigirSaldoInicialMes(${c.id},${Math.round(si.valor*100)})">✎</button>`:''}</div>
        <div class="cfgrow"><span>+ Entradas de ${mesNome}<br><span class="mut" style="font-size:11px">tudo que entrou na conta, transferências inclusive</span></span><b style="margin-left:auto;color:var(--green);font-variant-numeric:tabular-nums">${BRL(mv.ent)}</b></div>
        <div class="cfgrow"><span>− Saídas de ${mesNome}<br><span class="mut" style="font-size:11px">tudo que saiu da conta, transferências inclusive</span></span><b style="margin-left:auto;color:var(--red);font-variant-numeric:tabular-nums">${BRL(mv.sai)}</b></div>
        <div class="cfgrow" style="border-top:2px solid var(--line)"><b>= Tem que ter em ${ult}</b><b style="margin-left:auto;font-size:16px;color:${calc<0?'var(--red)':'var(--txt)'};font-variant-numeric:tabular-nums">${BRL(calc)}</b></div>
        <div class="cfgrow" style="flex-wrap:wrap;gap:8px"><span>Saldo real no banco em ${ult}<br><span class="mut" style="font-size:11px">o que o app do Sicoob mostra nesse dia · se o mês ainda não acabou, o saldo de agora</span></span>
          <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
            <button class="btn ghost" id="sinalReal${c.id}" data-neg="${neg?'1':'0'}" ${fechado?'disabled':''} onclick="toggleSinalReal(${c.id})" title="Positivo / negativo" style="min-width:42px;font-size:17px;font-weight:800;color:${neg?'var(--red)':'var(--green)'}">${neg?'−':'+'}</button>
            <input id="real${c.id}" class="qin calc" data-cents="${real==null?0:Math.round(Math.abs(real)*100)}" data-calc="${Math.round(calc*100)}" value="${real==null?'':Math.abs(real).toLocaleString('pt-BR',{minimumFractionDigits:2})}" placeholder="0,00" inputmode="numeric" style="max-width:150px" ${fechado?'disabled':''} onkeydown="calcInput(this,event);atualizaDifMes(${c.id});salvarSaldoRealMes(${c.id})">
          </div></div>
        <div id="dif${c.id}" style="padding:8px 0 2px;font-size:13px">${_difHTML(c.id,calc,real)}</div>
      </div>`;
    }).join('');
    const fechadoHTML=fechado
      ?`<p style="font-size:13px;line-height:1.6;margin-top:6px">Fechado por <b>${row.fechado_por||'—'}</b> em <b>${_fmtTs(row.fechado_em)}</b>.${row.motivo?`<br><span class="mut">Motivo registrado: ${row.motivo}</span>`:''}<br>${mesNome} não aceita mais lançamentos no banco. O saldo real virou o saldo inicial de ${mesSel<11?MESES_NOME[mesSel+1]:'janeiro'}.</p>
        ${PERFIL.papel==='dono'?`<button class="btn ghost" style="margin-top:10px" onclick="reabrirMes()">🔓 Reabrir ${mesNome}</button>`:'<p class="mut" style="font-size:12px;margin-top:8px">Só o dono pode reabrir.</p>'}`
      :`<p class="mut" style="font-size:12.5px;line-height:1.5;margin-top:6px">Para fechar: digite o saldo real de cada conta. Se alguma não bateu, escreva o motivo. Depois de fechado, ninguém lança mais nada em ${mesNome} sem o dono reabrir.</p>
        ${semCat?`<p style="font-size:13px;color:var(--amber);margin-top:8px">⚠️ <b>${semCat} lançamento(s)</b> de ${mesNome} sem categoria. Dá pra fechar, mas o DRE fica errado — <a style="color:var(--blue);cursor:pointer;text-decoration:underline" onclick="go('lanc')">resolver em Lançamentos</a>.</p>`:''}
        <textarea id="motivoFech" placeholder="Motivo, se alguma conta não bateu (obrigatório nesse caso)" style="width:100%;min-height:64px;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none"></textarea>
        ${podeEditar()?`<button class="btn" style="margin-top:10px" onclick="fecharMes()">🔐 Fechar ${mesNome}</button>`:''}`;
    document.getElementById('content').innerHTML=`<div class="note">🔐 <b>Fechamento do mês</b> — a conta do dinheiro, igual ao extrato: <b>quanto tinha, quanto entrou, quanto saiu, quanto tem que ter</b>. Bateu com o app do banco, o mês fecha.</div>
    ${seletorMes()}
    ${escadasHTML||'<div class="card" style="margin-bottom:12px"><p class="mut" style="font-size:13px">Nenhuma conta de banco cadastrada. Vá em <b>Configurações</b>.</p></div>'}
    ${cxHTML}
    <div class="grid two" style="margin-top:4px">
      <div class="card"><div class="cardhead"><h3>Resultado de ${mesNome}</h3><span class="tag">sem saldo inicial</span></div>
        <p class="mut" style="font-size:11.5px;margin-top:4px">Desempenho do mês. Esta conta <b>não</b> usa o saldo inicial.</p>
        <div class="cfgrow">Entradas (recebido)<b style="margin-left:auto;color:var(--green)">${BRL(entradas)}</b></div>
        <div class="cfgrow">Saídas (pago)<b style="margin-left:auto;color:var(--red)">-${BRL(saidas)}</b></div>
        <div class="cfgrow" style="border-top:2px solid var(--line)"><b>Resultado do mês</b><b style="margin-left:auto;color:${resultado>=0?'var(--green)':'var(--red)'};font-size:17px">${BRL(resultado)}</b></div>
        <div class="cfgrow">Lançamentos sem categoria<b style="margin-left:auto;color:${semCat?'var(--amber)':'var(--green)'}">${semCat}</b></div>
      </div>
      <div class="card"><div class="cardhead"><h3>${fechado?'🔐 Mês fechado':'Fechar '+mesNome}</h3></div>${fechadoHTML}</div>
    </div>
    <div class="card" style="margin-top:16px"><div class="cardhead"><h3>📝 Observações de ${mesNome}</h3></div>
      <p class="mut" style="font-size:12px;margin:6px 0 10px">Anote aqui o que precisar sobre o fechamento deste mês. Salva sozinho.</p>
      <textarea id="obsFech" placeholder="Ex: Faltou lançar a nota da Essilor. Conferir depósito do dia 15..." style="width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:12px;font-size:13.5px;font-family:inherit;resize:vertical;outline:none" oninput="salvarObsFech(this.value)">${row&&row.observacao?row.observacao.replace(/</g,'&lt;'):''}</textarea>
      <div id="obsFechStatus" class="mut" style="font-size:11.5px;margin-top:6px"></div>
    </div>`;
  }
  function _difHTML(contaId,calc,real){
    if(real==null)return `<span class="mut">digite o saldo do banco no dia ${_ultimoDiaBR(mesSel)}</span>`;
    const dif=real-calc;
    if(Math.abs(dif)<0.01)return '<span style="color:var(--green);font-weight:700">✅ Bateu certinho! O sistema está igual ao banco.</span>';
    if(dif>0)return `<span style="color:var(--amber);font-weight:700">⚠️ Sobrando ${BRL(dif)}</span> <span class="mut">— o banco tem mais que o sistema. Falta lançar alguma entrada, ou tem saída lançada a mais.</span>`;
    return `<span style="color:var(--red);font-weight:700">🚨 Faltando ${BRL(Math.abs(dif))}</span> <span class="mut">— o banco tem menos que o sistema. Falta lançar alguma saída.</span>`;
  }
  function _lerReal(contaId){
    const inp=document.getElementById('real'+contaId);if(!inp)return null;
    if(inp.value==='')return null;
    const neg=document.getElementById('sinalReal'+contaId).dataset.neg==='1';
    return (neg?-1:1)*parseInt(inp.dataset.cents||'0',10)/100;
  }
  function atualizaDifMes(contaId){
    const inp=document.getElementById('real'+contaId);const out=document.getElementById('dif'+contaId);if(!inp||!out)return;
    const calc=parseInt(inp.dataset.calc||'0',10)/100;const real=_lerReal(contaId);
    out.innerHTML=_difHTML(contaId,calc,real);
    const e=_escadas.find(x=>x.id===contaId);if(e)e.real=real;
  }
  function toggleSinalReal(contaId){
    const b=document.getElementById('sinalReal'+contaId);if(!b||b.disabled)return;
    const neg=b.dataset.neg==='1';b.dataset.neg=neg?'0':'1';b.textContent=neg?'+':'−';b.style.color=neg?'var(--green)':'var(--red)';
    atualizaDifMes(contaId);salvarSaldoRealMes(contaId);
  }
  // grava o saldo real digitado (salva sozinho, com atraso curto)
  let _realTimer={};
  function salvarSaldoRealMes(contaId){
    clearTimeout(_realTimer[contaId]);
    _realTimer[contaId]=setTimeout(async()=>{
      const real=_lerReal(contaId);
      await _gravarSaldos(mesSel+1,String(contaId),{real,real_por:PERFIL.nome||'',real_em:new Date().toISOString()});
    },600);
  }
  // mescla e grava o JSON de saldos do mês no banco
  async function _gravarSaldos(mes,contaKey,patch,extra){
    const atual=FECH_ANO[mes]||{};const saldos=Object.assign({},atual.saldos||{});
    if(contaKey)saldos[contaKey]=Object.assign({},saldos[contaKey]||{},patch||{});
    const payload=Object.assign({loja_id:lojaAtual,ano:ANO_FIXO,mes,saldos},extra||{});
    const {data,error}=await sb.from('fechamentos').upsert(payload,{onConflict:'loja_id,ano,mes'}).select().maybeSingle();
    if(error){toast('Erro ao salvar: '+error.message,'erro');return false;}
    FECH_ANO[mes]=data||Object.assign({},atual,payload);
    return true;
  }
  function abrirCorrigirSaldoInicialMes(contaId,centsAtual){
    const c=CONTAS.find(x=>x.id===contaId);if(!c)return;
    const neg=centsAtual<0;const abs=Math.abs(centsAtual);
    document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal">
      <h3>✎ Corrigir saldo inicial — ${c.nome} · 01/${_mm(mesSel)}</h3>
      <p>Use só se o valor calculado estiver errado (ex.: o mês anterior não foi fechado). Pode ser negativo (cheque especial). Fica registrado quem corrigiu e por quê.</p>
      <span class="qlabel">Saldo em 01/${_mm(mesSel)}/${ANO_FIXO}</span>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
        <button class="btn ghost" id="csSinal" data-neg="${neg?'1':'0'}" onclick="const b=this;const n=b.dataset.neg==='1';b.dataset.neg=n?'0':'1';b.textContent=n?'+':'−';b.style.color=n?'var(--green)':'var(--red)'" style="min-width:46px;font-size:18px;font-weight:800;color:${neg?'var(--red)':'var(--green)'}">${neg?'−':'+'}</button>
        <input id="csVal" class="calc" data-cents="${abs}" value="${(abs/100).toLocaleString('pt-BR',{minimumFractionDigits:2})}" inputmode="numeric" onkeydown="calcInput(this,event)" style="flex:1;margin-bottom:0">
      </div>
      <span class="qlabel">Motivo *</span><input id="csMotivo" class="maiusc" placeholder="Ex: SALDO DO EXTRATO DE 01/06">
      <div id="csErr"></div>
      <div class="modal-btns" style="flex-wrap:wrap"><button class="btn ghost" onclick="fecharModal()">Cancelar</button><button class="btn ghost" onclick="limparCorrecaoSaldoInicial(${contaId})" title="Volta ao valor calculado pelo sistema">Voltar ao calculado</button><button class="btn" onclick="salvarCorrecaoSaldoInicial(${contaId})">Salvar</button></div></div></div>`;
  }
  async function salvarCorrecaoSaldoInicial(contaId){
    const cents=parseInt(document.getElementById('csVal').dataset.cents||'0',10);
    const neg=document.getElementById('csSinal').dataset.neg==='1';
    const motivo=(document.getElementById('csMotivo').value||'').trim().toUpperCase();

  let IMPORT=[];
  let importPeriodo={de:'',ate:''};
  let importObs='';
  // regras de categoria por texto (memo+name), baseadas no extrato real
  const REGRAS_CAT=[
    [/ANTECIPA|CR COMPRAS|SIPAG|STONE|PAGSEGURO|PAGBANK|PAG\\*|GETNET|CIELO|REDE /i,'Cartão'],
    [/DEP\.?DINHEIRO/i,'__IGNORAR__'],
    [/CHEQUE ESP|CH ESP|LIMITE|JUROS LIS|JUROS CHEQUE|ADIANT.*DEPOSIT|JUROS ADIANT/i,'Juros Cheque Especial'],
    [/EMPR[ÉE]STIMO|JUROS CONTA|PARCELAS SUBSC/i,'Empréstimo'],
    [/ESSILOR|LENTE/i,'Lentes/Laboratório'],
    [/PEREGO|GV OPTICAL|FREEFORM|SURFA/i,'Surfaçagem Freeform'],
    [/FZ GRIFES|LUXOTICA/i,'Óculos/FZ Grifes'],
    [/PACOTE SERVI|IOF|TARIFA|DÉB\.CONV/i,'Tarifas Banco'],
    [/SIMPLES|DAS|DARF/i,'Imposto (Simples)'],
    [/CEMIG|SANEAMENTO|SAAE|VIVO|TELEFON/i,'CEMIG/SAAE/Telefones'],
    [/CONTABIL/i,'Contabilidade'],
    [/SAL[AÁ]RIO|RESCIS|FOLHA|FGTS|VALE /i,'Funcionários'],
    [/MIDIA|FACEBOOK|GOOGLE|MARKETING/i,'Mídia'],
    [/SEGURO/i,'Tarifas Banco'],
  ];
  const REGRAS_CONTATO=[
    [/ESSILOR/i,'Essilor'],[/PEREGO/i,'Perego'],[/GV OPTICAL/i,'GV Optical'],
    [/SATISLOH/i,'Satisloh'],[/MULTI[OÓ]PTICA/i,'Multióptica'],
    [/CEMIG/i,'CEMIG'],[/VIVO/i,'Vivo'],[/VALENET/i,'Valenet'],[/CONTABIL/i,'Contabilidade'],
  ];
  function adivinhaCat(txt){for(const[rx,c]of REGRAS_CAT)if(rx.test(txt))return c;return null;}
  function adivinhaContato(txt){for(const[rx,c]of REGRAS_CONTATO)if(rx.test(txt))return c;return null;}
  // detecta transferência entre lojas (contas Rocha)
  function ehTransferenciaRocha(txt){return /TRANSF\.CONTAS|OTICA ROCHA|REM\.:|FAV\.:/i.test(txt);}
  // classifica recebimento pro fluxo misto do Lucas
  function tipoRecebimento(memo,name){
    const t=(memo+' '+name);
    if(/ANTECIPA|CR COMPRAS|SIPAG|STONE|PAGSEGURO|PAGBANK|PAG\\*|GETNET|CIELO|REDE /i.test(t))return 'conta';   // cartão: conta pelo banco
    if(/DEP\.?DINHEIRO/i.test(t))return 'ignora';             // dinheiro: Linx já contou
    if(/PIX RECEBIDO|TRANSF\.RECEBIDA/i.test(t))return 'confere'; // pix: conferir
    return 'confere';
  }

  function parseOFX(txt){
    // separa cada transação
    const trans=[];
    const blocos=txt.split('<STMTTRN>').slice(1);
    blocos.forEach(b=>{
      const corte=b.split('</STMTTRN>')[0];
      const get=(tag)=>{const m=corte.match(new RegExp('<'+tag+'>([^<\\n]*)'));return m?m[1].trim():'';};
      const tipo=get('TRNTYPE');
      const amt=parseFloat(get('TRNAMT'));
      const dt=get('DTPOSTED').slice(0,8); // AAAAMMDD
      const fitid=get('FITID');
      const memo=get('MEMO');
      const name=get('NAME');
      if(!dt||isNaN(amt))return;
      const iso=dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8);
      const desc=(name||memo||'').trim();
      trans.push({iso,amt,fitid,memo,name,desc});
    });
    return trans;
  }

  function lerArquivoOFX(input){
    const file=input.files[0];if(!file)return;
    // só aceita OFX (protege contra PDF/Excel por engano)
    if(!file.name.toLowerCase().endsWith('.ofx')){
      toast('⚠️ Só aceita arquivo OFX! Baixe o extrato no formato OFX no Sicoob.','erro');
      input.value='';return;
    }
    const reader=new FileReader();
    reader.onload=function(e){
      let txt=e.target.result;
      // confere se é mesmo um OFX por dentro
      if(!/<STMTTRN>|OFXHEADER|<OFX>/i.test(txt)){
        toast('⚠️ Esse arquivo não parece um extrato OFX válido.','erro');
        input.value='';return;
      }
      const trans=parseOFX(txt);
      if(trans.length===0){toast('Não consegui ler transações do arquivo','erro');return;}
      // pega o período do extrato (DTSTART e DTEND)
      const ds=txt.match(/<DTSTART>(\d{8})/);const de=txt.match(/<DTEND>(\d{8})/);
      importPeriodo={de:ds?`${ds[1].slice(6,8)}/${ds[1].slice(4,6)}/${ds[1].slice(0,4)}`:'',ate:de?`${de[1].slice(6,8)}/${de[1].slice(4,6)}/${de[1].slice(0,4)}`:''};
      // monta a lista com adivinhação
      IMPORT=trans.map(t=>{
        const full=(t.memo+' '+t.name);
        const item={iso:t.iso,amt:t.amt,fitid:t.fitid,desc:t.desc||t.memo};
        // recebimentos: só cartão entra; pix e dinheiro ignoram (Linx já conta)
        if(t.amt>0){
          if(/ANTECIPA|CR COMPRAS|SIPAG|STONE|PAGSEGURO|PAGBANK|PAG\\*|GETNET|CIELO|REDE /i.test(full)){item.destino='conta';const c=catsAtivas().find(c=>c.nome==='Cartão');item.catId=c?c.id:null;}
          else {item.destino='ignora';} // pix, dinheiro, transferência recebida: Linx conta
          return item;
        }
        // saídas: adivinha categoria. Transferência entre lojas vira "a corrigir" pra Heloísa conferir
        if(ehTransferenciaRocha(full)){item.catId='';item.corrigir=true;return item;}
        const catNome=adivinhaCat(full);
        if(catNome&&catNome!=='__IGNORAR__'){const c=catsAtivas().find(c=>c.nome===catNome);item.catId=c?c.id:'';}else item.catId='';
        const contNome=adivinhaContato(full);
        if(contNome){const c=contatosAtivos().find(c=>c.nome===contNome);item.contatoId=c?c.id:null;}
        return item;
      });
      toast(trans.length+' transações lidas!','ok');
      render();
    };
    reader.readAsText(file,'ISO-8859-1'); // Sicoob usa Latin1
  }

  async function confirmarImport(){
    const btn=document.getElementById('btnConfImport');if(btn){btn.disabled=true;btn.textContent='Lançando...';}
    const catCartao=catsAtivas().find(c=>c.nome==='Cartão');
    const catTransf=catsAtivas().find(c=>c.grupo==='neutra');
    // extrato é sempre do Sicoob — pega a conta Sicoob da loja
    const contaSicoob=CONTAS.find(c=>/sicoob/i.test(c.nome))||CONTAS.find(c=>!/caixinha/i.test(c.nome))||null;
    const registros=[];
    let semContato=0;
    IMPORT.forEach(r=>{
      if(r.amt>0&&r.destino==='ignora')return; // pula pix e dinheiro (Linx conta)
      let catId=r.catId||null,contatoId=r.contatoId||null,tipoDb;
      if(r.amt>0){catId=catCartao?catCartao.id:r.catId;tipoDb='receita';}
      else {catId=r.catId||null;tipoDb='despesa';}
      registros.push({
        loja_id:lojaAtual,conta_id:contaSicoob?contaSicoob.id:null,data:r.iso,descricao:(r.desc||'').toUpperCase().slice(0,200),
        valor:r.amt,tipo:tipoDb,categoria_id:catId||null,contato_id:contatoId,
        pago:true,origem:'ofx',fitid:r.fitid||null,criado_por:USER.id
      });
    });
    // insere em lotes, ignorando duplicados (fitid)
    let ok=0,dup=0,erro=0,fech=0;
    for(const reg of registros){
      if(mesFechadoISO(reg.data)){fech++;continue;} // mês fechado: não lança
      const {error}=await sb.from('lancamentos').insert(reg);
      if(error){if(error.message.includes('duplicate')||error.code==='23505')dup++;else erro++;}
      else ok++;
    }
    // salva o histórico da importação
    try{
      await sb.from('importacoes').insert({
        loja_id:lojaAtual,
        periodo_de:importPeriodo.de?importPeriodo.de.split('/').reverse().join('-'):null,
        periodo_ate:importPeriodo.ate?importPeriodo.ate.split('/').reverse().join('-'):null,
        qtd_lancamentos:ok,observacao:importObs||null,importado_por:USER.id
      });
    }catch(e){}
    IMPORT=[];importObs='';importPeriodo={de:'',ate:''};
    toast(`${ok} lançados · ${dup} já existiam · ${erro} com erro${fech?` · ${fech} em mês fechado (não lançados)`:''}`, (erro>0||fech>0)?'erro':'ok');
    go('lanc');
  }

    LANC_ANO.forEach(l=>{
      const m=parseInt(l.data.split('-')[1],10)-1;if(m!==mesSel)return;
      const g=l.categorias&&l.categorias.grupo;if(g==='neutra')return; // transferências fora
      const nome=(l.categorias&&l.categorias.nome)||'Sem categoria';
      const v=Number(l.valor);
      if(v>0){entradaMes+=v;receitasCat[nome]=(receitasCat[nome]||0)+v;}
      else{saidaMes+=Math.abs(v);despesasCat[nome]=(despesasCat[nome]||0)+Math.abs(v);}
    });
    // transforma em listas ordenadas da maior pra menor
    const receitas=Object.entries(receitasCat).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
    const despesas=Object.entries(despesasCat).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
    const resultMes=entradaMes-saidaMes;
    // DRE do mês (por grupo)
    const gr={rec:0,cmv:0,imp:0,fixo:0,nop:0};
    LANC_ANO.forEach(l=>{
      const m=parseInt(l.data.split('-')[1],10)-1;if(m!==mesSel)return;
      const g=l.categorias&&l.categorias.grupo;if(!g||g==='neutra'||g==='adef')return;
      if(gr[g]!==undefined)gr[g]+=Math.abs(Number(l.valor));
    });
    const margem=gr.rec-gr.cmv;const resultOp=margem-gr.imp-gr.fixo;const resultFinal=resultOp-gr.nop;
    // contas a pagar (em aberto) por categoria
    const {data:apagar}=await sb.from('lancamentos').select('valor, categorias(nome)').eq('loja_id',lojaAtual).eq('pago',false);
    const apagarCat={};let totalApagar=0;
    (apagar||[]).forEach(l=>{const n=(l.categorias&&l.categorias.nome)||'Sem categoria';const v=Math.abs(Number(l.valor));apagarCat[n]=(apagarCat[n]||0)+v;totalApagar+=v;});
    const apagarLista=Object.entries(apagarCat).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor);
    const mesNome=MESES_NOME[mesSel];

    const seletor=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 14px">
        <button class="burger" style="width:32px;height:32px" onclick="navMes(-1)">‹</button>
        <span style="font-weight:700;font-size:14px;min-width:130px;text-align:center">${mesNome} ${ANO_FIXO}</span>
        <button class="burger" style="width:32px;height:32px" onclick="navMes(1)">›</button>
      </div>
      <span class="mut" style="font-size:13px">${lojaNome}</span></div>`;
    const card=(label,valor,cor,sub)=>`<div class="card"><div class="mut" style="font-size:12px;font-weight:600">${label}</div><div style="font-size:22px;font-weight:800;color:${cor};margin-top:6px;font-variant-numeric:tabular-nums">${BRL(valor)}</div>${sub?`<div class="mut" style="font-size:11px;margin-top:3px">${sub}</div>`:''}</div>`;
    // quadro DRE resumido
    const pctDRE=(v)=>gr.rec?`<span class="mut" style="font-size:10.5px;margin-left:5px">${(Math.abs(v)/gr.rec*100).toFixed(1).replace('.',',')}%</span>`:'';
    const linhaDRE=(nome,valor,op,forte)=>`<div class="cfgrow" style="${forte?'border-top:1px solid var(--line)':''}">${op?`<span class="mut" style="width:16px;display:inline-block">${op}</span>`:'<span style="width:16px;display:inline-block"></span>'}${nome}<span style="margin-left:auto;white-space:nowrap"><b style="${valor<0?'color:var(--red)':''};${forte?'font-size:14px':''}">${BRL(valor)}</b>${pctDRE(valor)}</span></div>`;
    const dreCard=`<div class="card"><div class="cardhead"><h3 style="font-size:14px">📊 DRE — ${mesNome}</h3></div>
      <div style="margin-top:6px">
        ${linhaDRE('Receita',gr.rec,'')}
        ${linhaDRE('Custo Mercadoria (CMV)',-gr.cmv,'−')}
        ${linhaDRE('Margem de Contribuição',margem,'=',true)}
        ${linhaDRE('Imposto',-gr.imp,'−')}
        ${linhaDRE('Custo Fixo',-gr.fixo,'−')}
        ${linhaDRE('Resultado Operacional',resultOp,'=',true)}
        ${linhaDRE('Não Operacional',-gr.nop,'−')}
        ${linhaDRE('Resultado Final',resultFinal,'=',true)}
      </div>
      <div class="mut" style="font-size:11px;text-align:center;margin-top:8px">referente a ${mesNome} ${ANO_FIXO}</div></div>`;
    // quadro Fechamento resumido
    const fechCard=`<div class="card"><div class="cardhead"><h3 style="font-size:14px">🔐 Fechamento — ${mesNome}</h3></div>
      <div style="margin-top:6px">
        <div class="cfgrow">Entradas (recebido)<b style="margin-left:auto;color:var(--green)">${BRL(entradaMes)}</b></div>
        <div class="cfgrow">Saídas (pago)<b style="margin-left:auto;color:var(--red)">-${BRL(saidaMes)}</b></div>
        <div class="cfgrow" style="border-top:2px solid var(--line)"><b>Resultado do mês</b><b style="margin-left:auto;color:${resultMes>=0?'var(--green)':'var(--red)'};font-size:16px">${BRL(resultMes)}</b></div>
      </div>
      <div class="mut" style="font-size:11px;text-align:center;margin-top:8px">referente a ${mesNome} ${ANO_FIXO}</div></div>`;

    document.getElementById('content').innerHTML=`${seletor}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px">
        ${card('Saídas do mês',saidaMes,'var(--red)','pago em '+mesNome)}
        ${card('Entradas do mês',entradaMes,'var(--green)','recebido em '+mesNome)}
        ${card('Resultado do mês',resultMes,resultMes>=0?'var(--green)':'var(--red)','entradas − saídas')}
        ${card('A pagar (aberto)',totalApagar,'var(--amber)','boletos não pagos')}
      </div>
      <div class="grid two">
        ${graficoCard('💸 Despesas pagas',despesas,saidaMes,'var(--red)',mesNome,'des')}
        ${graficoCard('💰 Receitas / Entradas',receitas,entradaMes,'var(--green)',mesNome,'rec')}
        ${graficoCard('🧾 Contas a pagar (aberto)',apagarLista,totalApagar,'var(--amber)','')}
        ${dreCard}
        ${fechCard}
      </div>`;
  }

        <div class="card" style="text-align:center"><div class="mut" style="font-size:12px;font-weight:600">TOTAL DE JUROS/TARIFAS (todas as lojas)</div><div style="font-size:28px;font-weight:800;color:var(--red);margin-top:8px">${BRL(totalGeral)}</div><div class="mut" style="font-size:11px;margin-top:4px">no ano de ${ANO_FIXO}</div></div>
        <div class="card" style="text-align:center"><div class="mut" style="font-size:12px;font-weight:600">MÉDIA POR MÊS</div><div style="font-size:28px;font-weight:800;color:var(--amber);margin-top:8px">${BRL(totalGeral/12)}</div><div class="mut" style="font-size:11px;margin-top:4px">custo financeiro mensal do grupo</div></div>
      </div>

  // ---- COMPARATIVO mês a mês ----
  async function viewComparativo(){
    document.getElementById('content').innerHTML='<div class="loading"><span class="spin"></span> Calculando...</div>';
    await carregarLancAno();
    const meses=Array.from({length:12},()=>({entrada:0,saida:0}));
    LANC_ANO.forEach(l=>{
      const g=l.categorias&&l.categorias.grupo;if(g==='neutra')return;
      const m=parseInt(l.data.split('-')[1],10)-1;const v=Number(l.valor);
      if(v>0)meses[m].entrada+=v;else meses[m].saida+=Math.abs(v);
    });
    const comDados=[];meses.forEach((m,i)=>{if(m.entrada||m.saida)comDados.push(i);});
    if(comDados.length===0){document.getElementById('content').innerHTML='<div class="note">📈 <b>Comparativo</b> — entradas, saídas e resultado de cada mês, lado a lado.</div><div class="card empty"><div class="big">📈</div>Sem dados ainda. Conforme você lança, os meses aparecem aqui.</div>';return;}
    const maxVal=Math.max(...comDados.map(i=>Math.max(meses[i].entrada,meses[i].saida)));
    const rows=comDados.map(i=>{
      const m=meses[i];const res=m.entrada-m.saida;
      const barE=maxVal>0?(m.entrada/maxVal*100):0;const barS=maxVal>0?(m.saida/maxVal*100):0;
      return `<tr><td><b>${MESES_NOME[i]}</b></td>

        <td class="amt green">${BRL(m.entrada)}</td>
        <td style="width:200px"><div style="background:rgba(255,107,107,.15);border-radius:4px;height:18px;width:${barS}%;min-width:2px"></div></td>
        <td class="amt red">-${BRL(m.saida)}</td>
        <td class="amt"><b style="color:${res>=0?'var(--green)':'var(--red)'}">${BRL(res)}</b></td></tr>`;
    }).join('');
    document.getElementById('content').innerHTML=`<div class="note">📈 <b>Comparativo ${ANO_FIXO}</b> — entradas (verde) e saídas (vermelho) de cada mês, com o resultado.</div>
      <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Mês</th><th>Entradas</th><th style="text-align:right">Total</th><th>Saídas</th><th style="text-align:right">Total</th><th style="text-align:right">Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  async function addRecorrente(){
    const desc=document.getElementById('recDesc').value.trim().toUpperCase();
    const cents=parseInt(document.getElementById('recVal').dataset.cents||'0',10);
    const dia=parseInt(document.getElementById('recDia').value,10)||null;
    const catId=document.getElementById('recCat').value||null;
    if(!desc||!cents){toast('Preencha descrição e valor','erro');return;}
    const {error}=await sb.from('recorrentes').insert({loja_id:lojaAtual,descricao:desc,valor:-(cents/100),categoria_id:catId,dia_vencimento:dia});
    if(error){toast('Erro: '+error.message,'erro');return;}
    toast('Recorrente cadastrado!','ok');viewRecorrentes();
  }
  async function excluirRecorrente(id){if(!confirm('Remover este recorrente?'))return;await sb.from('recorrentes').delete().eq('id',id);toast('Removido','ok');viewRecorrentes();}

  // mesma conta do Caixinha (calcMes): abertura = tudo antes do dia 1º; fechamento = abertura + entradas + reposições + guardado − saídas − empréstimos − depósitos
  function cxCalcMes(k,ano,mes){
    const first=`${ano}-${String(mes).padStart(2,'0')}-01`,pref=`${ano}-${String(mes).padStart(2,'0')}`;
    let abertura=0,ent=0,sai=0,emp=0,rep=0,dep=0,gua=0,abEmp=0;
    k.mov.forEach(m=>{const v=(m.tipo==='entrada'||m.tipo==='reposicao'||m.tipo==='guardado')?m.valor:-m.valor;
      if((m.data||'')<first){abertura+=v;if(m.tipo==='emprestimo'&&m.para)abEmp+=m.valor;else if(m.tipo==='reposicao'&&m.para)abEmp-=m.valor;}
      else if((m.data||'').slice(0,7)===pref){if(m.tipo==='entrada')ent+=m.valor;else if(m.tipo==='saida')sai+=m.valor;else if(m.tipo==='emprestimo')emp+=m.valor;else if(m.tipo==='reposicao')rep+=m.valor;else if(m.tipo==='deposito')dep+=m.valor;else if(m.tipo==='guardado')gua+=m.valor;}});
    return {abertura,abEmp:Math.max(abEmp,0),ent,sai,emp,rep,dep,gua,fechamento:abertura+ent+rep+gua-sai-emp-dep,aReceber:Math.max(emp-rep,0)};
  }
  function cxFaltaRecolher(k){
    const movs=(k.mov||[]).filter(m=>(m.data||'')>=CX_INICIO_RECOLHER&&(m.tipo==='guardado'||(m.tipo==='deposito'&&!m.para))).slice().sort((a,b)=>((a.data||'')<(b.data||'')?-1:(a.data||'')>(b.data||'')?1:((a.id||0)<(b.id||0)?-1:1)));
    const fila=[];movs.forEach(m=>{if(m.tipo==='guardado'){if(!m.recolhido)fila.push(m.valor);}else{let d=m.valor;while(d>0&&fila.length){if(fila[0]<=d){d-=fila.shift();}else{fila[0]-=d;d=0;}}}});
    return fila.reduce((s,v)=>s+v,0);
  }
