      ${r.fechamento<-0.009?'<p style="font-size:12.5px;color:var(--red);margin-top:8px">🚨 Caixinha não pode ficar negativa. É lançamento faltando no Caixinha, não saldo.</p>':''}
      ${compacta?'':`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px"><span class="mut" title="Empréstimos − reposições da loja, igual à tela do Caixinha">Emprestado a outras lojas (igual ao Caixinha): <b style="color:var(--txt)">${BRL(r.fimEmp)}</b></span><span class="mut">A recolher: <b style="color:var(--txt)">${BRL(cxFaltaRecolher(k))}</b></span></div>`}
      ${(()=>{const q=cxConferir(k,mi);if(!q.loja&&!q.semCat)return '';return `<div style="margin-top:8px;font-size:12.5px;padding:8px 11px;border-radius:9px;background:rgba(245,183,64,.08);border:1px solid rgba(245,183,64,.3)">🔎 <b>Conferir no Caixinha:</b> ${q.loja} saída(s) de ${mesNome} lançada(s) pela própria loja${q.semCat?` · <b style="color:var(--amber)">${q.semCat} sem categoria</b>`:''}. A Rhaiane confere e completa lá.</div>`;})()}
      ${(()=>{const b=cxBancoResumo(k.id,ANO_FIXO,mi+1);const fimLbl=b.mesAtual?'hoje':ult;return `<div style="margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)"><div style="font-weight:700;font-size:13.5px;margin-bottom:4px">🔁 Banco Caixinha ${k.nome} — ${mesNome} <span class="mut" style="font-weight:500;font-size:11.5px">o que o escritório pagou pela loja e ela ainda vai devolver (aba Banco do Caixinha)</span></div>
      ${row(`Em aberto em 01/${_mm(mi)}`,b.inicio,{sub:'início do mês'})}
      ${row(`+ Emprestado em ${mesNome}`,b.emprestado,{cor:'var(--red)'})}
      ${row(`− Voltou (estornado) em ${mesNome}`,b.voltou,{cor:'var(--green)'})}
      <div class="cfgrow" style="border-top:2px solid var(--line)"><b>= Em aberto ${fimLbl}</b><b style="margin-left:auto;font-size:15px;color:var(--blue);font-variant-numeric:tabular-nums">${BRL(b.fim)}</b></div></div>`;})()}
      <div style="margin-top:10px"><a href="${CX_LINK}" target="_blank" rel="noopener" style="color:var(--blue);font-size:12.5px">Abrir no Caixinha ↗</a><span class="mut" style="font-size:11.5px;margin-left:10px">Para corrigir qualquer número, corrija lá — aqui atualiza sozinho.</span></div>
    </div>`;
  }
  async function viewCaixinha(){
    const c=document.getElementById('content');
    c.innerHTML='<div class="loading"><span class="spin"></span> Abrindo o espelho do Caixinha...</div>';
    const nota=`<div class="note">💵 <b>Caixinha (dinheiro)</b> — o dinheiro físico mora no <b>sistema Caixinha</b>. Esta aba é um <b>espelho</b>: mostra, loja por loja, o que ele calcula. Ninguém lança nem ajusta aqui.</div>`;
    const sess=await cxSessao();
    if(!sess){c.innerHTML=nota+cxLoginHTML();return;}
    const ok=await cxCarregar();
    if(!ok){c.innerHTML=nota+`<div class="card"><p style="color:var(--red);font-size:13px">Não consegui ler o Caixinha: ${CX.erro||'erro desconhecido'}.</p><div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" onclick="CX.carregado=false;render()">Tentar de novo</button><button class="btn ghost" onclick="cxSair()">Sair do Caixinha</button></div></div>`;return;}
    const mi=mesSel;const atualCh=(()=>{const L=LOJAS.find(l=>l.id===lojaAtual);return L?cxChaveLoja(L.nome):'';})();
    const bT=cxBancoResumo(null,ANO_FIXO,mi+1);const fimLbl=bT.mesAtual?'hoje':_ultimoDiaBR(mi);
    const linhas=CX.caixas.map(k=>{const r=cxCalcMes(k,ANO_FIXO,mi+1);const b=cxBancoResumo(k.id,ANO_FIXO,mi+1);const ehAtual=cxChaveLoja(k.nome)===atualCh;
      return `<tr style="${ehAtual?'background:rgba(61,220,145,.07)':''}"><td><b>${k.nome}</b>${ehAtual?' <span class="catchip" style="border-color:var(--green);color:var(--green)">loja atual</span>':''}</td><td class="amt" style="color:${r.abertura<0?'var(--red)':'var(--txt)'}">${BRL(r.abertura)}</td><td class="amt green">${BRL(r.ent+r.rep+r.gua)}</td><td class="amt red">${BRL(r.sai+r.emp)}</td><td class="amt red">${BRL(r.dep)}</td><td class="amt" style="font-weight:800;color:${r.fechamento<0?'var(--red)':'var(--txt)'};border-right:2px solid var(--line)">${BRL(r.fechamento)}</td><td class="amt">${BRL(b.inicio)}</td><td class="amt red">${BRL(b.emprestado)}</td><td class="amt green">${BRL(b.voltou)}</td><td class="amt" style="font-weight:800;color:var(--blue)">${BRL(b.fim)}</td><td class="amt" style="white-space:nowrap">${(()=>{const q=cxConferir(k,mi);return q.loja?`${q.loja}${q.semCat?` <span style="color:var(--amber)">· ${q.semCat} sem cat.</span>`:''}`:'<span class="mut">—</span>';})()}</td></tr>`;}).join('');
    const tot=CX.caixas.reduce((a,k)=>{const r=cxCalcMes(k,ANO_FIXO,mi+1);a.ab+=r.abertura;a.en+=r.ent+r.rep+r.gua;a.sa+=r.sai+r.emp;a.de+=r.dep;a.fe+=r.fechamento;return a;},{ab:0,en:0,sa:0,de:0,fe:0});
    c.innerHTML=nota+seletorMes()+`
      <div class="card" style="padding:0;overflow:auto"><table>
      <thead><tr><th></th><th colspan="5" style="text-align:center;color:var(--green);border-right:2px solid var(--line)">💵 Caixa (gaveta) — dinheiro físico da loja</th><th colspan="4" style="text-align:center;color:var(--blue)">🔁 Banco Caixinha — o escritório pagou, a loja vai devolver</th><th style="text-align:center;color:var(--amber)">🔎 Conferir</th></tr>
      <tr><th>Loja</th><th style="text-align:right">Abertura 01/${_mm(mi)}</th><th style="text-align:right">+ Entradas</th><th style="text-align:right">− Saídas</th><th style="text-align:right">− Depósitos</th><th style="text-align:right;border-right:2px solid var(--line)">= Tem que ter</th><th style="text-align:right">Em aberto 01/${_mm(mi)}</th><th style="text-align:right">+ Emprestado</th><th style="text-align:right">− Voltou</th><th style="text-align:right">= Em aberto ${fimLbl}</th><th style="text-align:right">Lançado pela loja</th></tr></thead>
      <tbody>${linhas||'<tr><td colspan="11" class="mut">Nenhuma caixinha de loja encontrada.</td></tr>'}</tbody>
      <tfoot><tr style="font-weight:800"><td>Total</td><td class="amt">${BRL(tot.ab)}</td><td class="amt green">${BRL(tot.en)}</td><td class="amt red">${BRL(tot.sa)}</td><td class="amt red">${BRL(tot.de)}</td><td class="amt" style="border-right:2px solid var(--line)">${BRL(tot.fe)}</td><td class="amt">${BRL(bT.inicio)}</td><td class="amt red">${BRL(bT.emprestado)}</td><td class="amt green">${BRL(bT.voltou)}</td><td class="amt" style="color:var(--blue)">${BRL(bT.fim)}</td><td class="amt">${CX.caixas.reduce((a,k)=>a+cxConferir(k,mi).loja,0)}</td></tr></tfoot></table></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px" class="mut">
        <span>Lido do Caixinha às ${CX.em?CX.em.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—'} · entrou como <b>${(document.querySelector(`#cxEmail option[value='${sess.user?.email||''}']`)||{}).textContent||({'lucas@caixinharocha.com':'Lucas','heloisa@caixinharocha.com':'Heloísa','rhaiane@caixinharocha.com':'Rhaiane','carol@caixinharocha.com':'Carol','flavia@caixinharocha.com':'Flávia'})[sess.user?.email]||sess.user?.email||''}</b></span>
        <button class="btn ghost" style="padding:5px 10px;font-size:12px" onclick="CX.carregado=false;render()">↻ Atualizar</button>
        <a class="btn ghost" href="${CX_LINK}" target="_blank" rel="noopener" style="padding:5px 10px;font-size:12px;text-decoration:none">Abrir o Caixinha ↗</a>
        ${ehDono()?`<button class="btn ghost" style="padding:5px 10px;font-size:12px;margin-left:auto" onclick="if(confirm('Sair do Caixinha neste computador? A aba vai pedir a senha do Caixinha de novo.'))cxSair()">Sair do Caixinha</button>`:''}
      </div>
      <div class="card" style="margin-top:14px"><div class="cardhead"><h3>Os três "bancos" — para não confundir</h3></div>
        <div class="cfgrow"><span>🏦 <b>Banco Sicoob</b> — a conta da loja no banco de verdade</span><span class="mut" style="margin-left:auto;font-size:12px">mora no <b>Fechamento do mês</b> (a escada do Sicoob)</span></div>
        <div class="cfgrow"><span>💵 <b>Caixa (gaveta)</b> — o dinheiro físico que a loja tem na mão</span><span class="mut" style="margin-left:auto;font-size:12px">mora no <b>Caixinha → aba Caixa</b>; aqui é espelho</span></div>
        <div class="cfgrow"><span>🔁 <b>Banco Caixinha</b> — o que o escritório pagou pela loja e ela ainda vai devolver (estornar). Vira o mês e continua em aberto</span><span class="mut" style="margin-left:auto;font-size:12px">mora no <b>Caixinha → aba Banco</b>; aqui é espelho</span></div>
        <p class="mut" style="font-size:11.5px;margin-top:8px;line-height:1.5">🔎 <b>Conferir</b> = saídas do mês que a própria loja lançou pelo login dela (Rocha N / GV Optical). A Rhaiane confere no Caixinha e completa o que faltar; as sem categoria aparecem em amarelo. Nenhum dos três se soma ao outro. Entradas = entradas + reposições + guardado · Saídas = saídas + emprestado para outra loja · Em aberto = contas com status "a estornar" ainda não devolvidas, pela mesma conta da aba Banco do Caixinha.</p></div>`;
  }
  // bloco da caixinha dentro do Fechamento do mês (abaixo da escada do Sicoob)
  async function cxBlocoFechamento(){
    const sess=await cxSessao();
    if(!sess)return `<div class="card" style="margin-bottom:12px"><div class="cardhead"><h3>💵 Caixa (gaveta) e 🔁 Banco Caixinha — ${MESES_NOME[mesSel]}</h3><span class="tag">espelho</span></div><p class="mut" style="font-size:12.5px;margin-top:6px">Para ver a escada da caixinha aqui, <a style="color:var(--blue);cursor:pointer;text-decoration:underline" onclick="go('caixinha')">entre no Caixinha uma vez</a> (aba Caixinha).</p></div>`;
    const ok=await cxCarregar();if(!ok)return `<div class="card" style="margin-bottom:12px"><p class="mut" style="font-size:12.5px">Caixinha indisponível agora: ${CX.erro||''}</p></div>`;
    const k=cxCaixaDaLojaAtual();
    if(!k)return `<div class="card" style="margin-bottom:12px"><div class="cardhead"><h3>💵 Caixinha — ${MESES_NOME[mesSel]}</h3></div><p class="mut" style="font-size:12.5px;margin-top:6px">Esta loja não tem caixinha no sistema Caixinha (ou o nome não casou).</p></div>`;
    return cxEscadaHTML(k,mesSel,false);
  }

  function fecharModal(){document.getElementById('modalRoot').innerHTML='';}

  // ====== GRÁFICO DE ROSCA (SVG puro) ======
  const CORES_GRAF=['#3ddc91','#7da2ff','#e8c468','#ff6b6b','#c084fc','#4dd4d4','#f5905a','#a0d468','#ec87c0','#5d9cec','#aab2bd','#ffce54','#48cfad','#ed5565','#967adc'];
  function donut(itens,total,tipo){
    // itens: [{nome,valor,pct}] já ordenados. total: soma. tipo: 'rec' ou 'des' pra abrir detalhes
    if(total<=0||itens.length===0)return '<div class="empty" style="padding:30px"><div class="big">📊</div>Sem dados neste mês</div>';
    const R=70,r=42,cx=90,cy=90;let ang=-Math.PI/2;
    const arcs=itens.map((it,i)=>{
      const frac=it.valor/total;const a2=ang+frac*Math.PI*2;
      const x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang);
      const x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      const xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2);
      const xi1=cx+r*Math.cos(ang),yi1=cy+r*Math.sin(ang);
      const large=frac>0.5?1:0;
      const cor=CORES_GRAF[i%CORES_GRAF.length];
      const path=`M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${r} ${r} 0 ${large} 0 ${xi1} ${yi1} Z`;
      ang=a2;
      // rótulo de % na fatia (só se >5%)
      let lbl='';
      if(frac>0.05){const mid=(ang+ (ang-frac*Math.PI*2))/2;const lx=cx+(R+r)/2*Math.cos(mid),ly=cy+(R+r)/2*Math.sin(mid);lbl=`<text x="${lx}" y="${ly}" fill="#04130c" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">${(frac*100).toFixed(1).replace('.',',')}%</text>`;}
      const clique=tipo?`onclick="abrirDetalheCategoria('${(it.nome||'').replace(/'/g,"\\'")}','${tipo}')" style="cursor:pointer"`:'';
      return `<path d="${path}" fill="${cor}" ${clique}><title>${it.nome}: ${BRL(it.valor)}</title></path>${lbl}`;
    }).join('');
    return `<svg viewBox="0 0 180 180" style="width:180px;height:180px;flex-shrink:0">${arcs}</svg>`;
  }
  function legenda(itens,total,tipo){
    return itens.map((it,i)=>{
      const cor=CORES_GRAF[i%CORES_GRAF.length];const pct=total>0?(it.valor/total*100):0;
      const clique=tipo?`onclick="abrirDetalheCategoria('${(it.nome||'').replace(/'/g,"\\'")}','${tipo}')" style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer" onmouseover="this.style.background='rgba(255,255,255,.03)'" onmouseout="this.style.background='transparent'"`:'style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"';
      return `<div ${clique}>
        <span style="width:11px;height:11px;border-radius:3px;background:${cor};flex-shrink:0"></span>
        <span style="flex:1">${it.nome} <span class="mut" style="font-size:11px">${pct.toFixed(1).replace('.',',')}%</span></span>
        <b style="font-variant-numeric:tabular-nums">${BRL(it.valor)}</b>${tipo?'<span class="mut" style="font-size:11px;margin-left:4px">›</span>':''}</div>`;
    }).join('');
  }
  function graficoCard(titulo,itens,total,corTotal,refMes,tipo){
    return `<div class="card"><div class="cardhead"><h3 style="font-size:14px">${titulo}</h3></div>
      <div style="display:flex;flex-direction:column;align-items:center;margin-top:6px">
        ${donut(itens,total,tipo)}
        <div style="width:100%;margin-top:10px">${legenda(itens,total,tipo)||'<div class="mut" style="font-size:13px;padding:16px 0;text-align:center">Sem dados neste mês</div>'}</div>
      </div>
      <div style="display:flex;justify-content:space-between;border-top:2px solid var(--line);margin-top:10px;padding-top:10px"><b>Total</b><b style="color:${corTotal};font-size:15px">${BRL(total)}</b></div>
      ${refMes?`<div class="mut" style="font-size:11px;text-align:center;margin-top:6px">referente a ${refMes} ${ANO_FIXO}</div>`:''}</div>`;
  }
  // abre janela com os lançamentos de uma categoria (clicando no gráfico do dashboard)
  function abrirDetalheCategoria(nomeCat,tipo){
    const lista=_lancMesDash.filter(l=>{
      const g=l.categorias&&l.categorias.grupo;if(g==='neutra')return false;
      const nome=(l.categorias&&l.categorias.nome)||'Sem categoria';
      if(nome!==nomeCat)return false;
      return tipo==='rec'?Number(l.valor)>0:Number(l.valor)<0;
    }).sort((a,b)=>a.data.localeCompare(b.data));
    let total=0;
    const rows=lista.map(l=>{total+=Math.abs(Number(l.valor));return `<tr>
      <td class="mut" style="white-space:nowrap">${isoParaBR(l.data).slice(0,5)}</td>
      <td>${l.descricao||'—'}</td>
      <td class="mut">${(l.contatos&&l.contatos.nome)||'—'}</td>
      <td class="amt ${tipo==='rec'?'green':'red'}" style="white-space:nowrap;text-align:right">${tipo==='rec'?'+':'-'}${BRL(Math.abs(l.valor))}</td>
    </tr>`;}).join('');
    const cor=tipo==='rec'?'var(--green)':'var(--red)';
    document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal" style="max-width:640px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="margin:0">${nomeCat}</h3><button class="delx" style="font-size:18px" onclick="fecharModal()">✕</button></div>
      <p style="margin-top:0">${lista.length} lançamento(s) em ${MESES_NOME[mesSel]} ${ANO_FIXO}</p>
      <div style="max-height:60vh;overflow:auto"><table><thead><tr><th>Data</th><th>Descrição</th><th>Contato</th><th style="text-align:right">Valor</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="mut" style="text-align:center;padding:20px">Nenhum lançamento</td></tr>'}</tbody></table></div>
      <div style="display:flex;justify-content:space-between;border-top:2px solid var(--line);margin-top:10px;padding-top:10px"><b>Total</b><b style="color:${cor};font-size:16px">${BRL(total)}</b></div>
    </div></div>`;
  }

  // maiúsculo automático em qualquer campo com classe "maiusc"
  document.addEventListener('input',function(e){
    const el=e.target;
    if(el&&el.classList&&el.classList.contains('maiusc')&&el.type!=='date'){
      const pos=el.selectionStart;const up=el.value.toUpperCase();
      if(el.value!==up){el.value=up;try{el.setSelectionRange(pos,pos);}catch(_){}}
    }
  });

  window.addEventListener('load',async()=>{
    if(!initSupabase())return;
    try{const {data}=await sb.auth.getSession();if(data&&data.session){await iniciarApp(data.session.user);}}catch(e){}
  });
  </script>
</body>
