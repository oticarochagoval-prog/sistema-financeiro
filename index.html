  function agDiaUtil(iso){const d=new Date(iso+'T00:00:00').getDay();return d===6?addDias(iso,2):d===0?addDias(iso,1):iso;}
  const AG_BANCOS={'001':'Banco do Brasil','033':'Santander','104':'Caixa','237':'Bradesco','341':'Itaú','756':'Sicoob','748':'Sicredi','077':'Inter','260':'Nubank','336':'C6','422':'Safra','041':'Banrisul','070':'BRB','136':'Unicred','085':'Ailos','212':'Original','655':'Votorantim'};
  // lê linha digitável (47 boleto / 48 conta de consumo) ou código de barras (44): valor e vencimento
  function lerCodigoBoleto(txt){const d=String(txt||'').replace(/\D/g,'');if(d.length<44)return null;
    const fatorData=f=>{if(!f)return null;const hoje=new Date();const c1=new Date(1997,9,7);c1.setDate(c1.getDate()+f);const c2=new Date(2025,1,22);c2.setDate(c2.getDate()+(f-1000));
      return _isoLocal([c1,c2].sort((a,b)=>Math.abs(a-hoje)-Math.abs(b-hoje))[0]);};
    const consumo=bar=>({tipo:'conta',banco:'conta de consumo / tributo',valor:['6','8'].includes(bar[2])?parseInt(bar.slice(4,15),10)/100:null,venc:null});
    if(d.length===48&&d[0]==='8')return consumo(d.slice(0,11)+d.slice(12,23)+d.slice(24,35)+d.slice(36,47));
    if(d.length===44&&d[0]==='8')return consumo(d);
    if(d.length===47)return {tipo:'boleto',banco:AG_BANCOS[d.slice(0,3)]||('banco '+d.slice(0,3)),valor:parseInt(d.slice(37,47),10)/100||null,venc:fatorData(parseInt(d.slice(33,37),10))};
    if(d.length===44)return {tipo:'boleto',banco:AG_BANCOS[d.slice(0,3)]||('banco '+d.slice(0,3)),valor:parseInt(d.slice(9,19),10)/100||null,venc:fatorData(parseInt(d.slice(5,9),10))};

  // ---- Ler boleto por foto ou PDF (v2.8.4) ----

  async function agLerArquivo(input){const f=input.files&&input.files[0];if(!f)return;const info=document.getElementById('agCodInfo');const set=h=>{if(info)info.innerHTML=h;};

  const stripVazio=o=>{const x={};Object.entries(o||{}).forEach(([k,v])=>{if(v!=null&&v!=='')x[k]=v;});return x;};
  async function boletoDoPDF(f){const pags=await pdfExtratoLinhas(f);const txt=pags.map(p=>p.map(l=>l.txt).join('\n')).join('\n');const r={};
    const ld=txt.match(/\d{5}[.\s]?\d{5}\s*\d{5}[.\s]?\d{6}\s*\d{5}[.\s]?\d{6}\s*\d\s*\d{14}/)||txt.match(/\d{11}[\s-]?\d\s*\d{11}[\s-]?\d\s*\d{11}[\s-]?\d\s*\d{11}[\s-]?\d/);

  function agPreencherLido(r){const g=id=>document.getElementById(id);const info=g('agCodInfo');

    if(linha.length>=44&&g('agCod')){g('agCod').value=linha;cod=lerCodigoBoleto(linha);agLerCodigo();}
    const valor=(cod&&cod.valor)||Number(r.valor)||0,venc=(cod&&cod.venc)||(/^\d{4}-\d{2}-\d{2}$/.test(r.vencimento||'')?r.vencimento:'');
    if(valor>0&&g('agValor'))g('agValor').value=valor.toFixed(2).replace('.',',');if(venc&&g('agVenc'))g('agVenc').value=venc;

    const rg=aplicarRegrasP(`${benef} ${cnpj}`,lojaAtual);const c=g('agCat'),k=g('agCont');
    if(rg&&rg.categoria_id&&c)c.value=String(rg.categoria_id);if(rg&&rg.contato_id&&k)k.value=String(rg.contato_id);
    if(k&&!k.value&&benef){const ct=CONTATOS.find(x=>x.nome&&benef.includes(String(x.nome).toUpperCase())&&String(x.nome).length>=4);if(ct)k.value=String(ct.id);}

  async function agAprenderBoleto(cat,cont){const L=_agLido;_agLido=null;if(!L||!L.cnpj||L.cnpj.length<11||!cat)return;

  // baixa automática: conta aberta + lançamento do extrato com o mesmo valor, de 7 dias antes a 10 dias depois do vencimento
  async function agBaixaAutomatica(lojaIds){
    if(!podeEditar())return 0;const hoje=_hojeLocal();
    let q=sb.from('contas_pagar').select('id,loja_id,valor,vencimento,categoria_id,contato_id').eq('status','aberto').lte('vencimento',addDias(hoje,10)).gte('vencimento',addDias(hoje,-120));
    if(lojaIds)q=q.in('loja_id',lojaIds);const {data:ab,error}=await q;if(error||!ab||!ab.length)return 0;
    const de=addDias(ab.reduce((m,c)=>c.vencimento<m?c.vencimento:m,hoje),-7);
    let lq=sb.from('lancamentos').select('id,loja_id,data,valor,categoria_id,contato_id').lt('valor',0).gte('data',de).lte('data',hoje);if(lojaIds)lq=lq.in('loja_id',lojaIds);
    let lancs=[];for(let o=0;;o+=1000){const {data,error:e2}=await lq.order('id').range(o,o+999);if(e2)return 0;lancs=lancs.concat(data||[]);if(!data||data.length<1000)break;}
    const {data:usadosRows}=await sb.from('contas_pagar').select('pago_lancamento_id').not('pago_lancamento_id','is',null).gte('vencimento',addDias(hoje,-200));
    const usados=new Set((usadosRows||[]).map(r=>r.pago_lancamento_id));let n=0;
    for(const c of ab.sort((a,b)=>a.vencimento.localeCompare(b.vencimento))){
      const cands=lancs.filter(l=>l.loja_id==c.loja_id&&!usados.has(l.id)&&Math.abs(Math.abs(Number(l.valor))-Number(c.valor))<0.01&&l.data>=addDias(c.vencimento,-7)&&l.data<=addDias(c.vencimento,10))
        .sort((a,b)=>_dias(a.data,c.vencimento)-_dias(b.data,c.vencimento));
      const l=cands[0];if(!l)continue;usados.add(l.id);
      const {error:e3}=await sb.from('contas_pagar').update({status:'pago',pago_em:l.data,pago_lancamento_id:l.id,pago_como:'baixa automática pelo extrato',atualizado_em:new Date().toISOString(),atualizado_por:USER.id}).eq('id',c.id);
      if(e3)continue;n++;

      if(Object.keys(up).length){try{await sb.from('lancamentos').update(up).eq('id',l.id);}catch(e){}}
    }
    return n;
  }
  async function agCarregar(lojaIds,de,ate){

    const nomeCat=id=>{const c=CATS.find(x=>x.id===id);return c?c.nome:'';};
    // contas lançadas
    let qa=sb.from('contas_pagar').select('*').eq('status','aberto').lte('vencimento',ate);if(lojaIds)qa=qa.in('loja_id',lojaIds);
    let qp=sb.from('contas_pagar').select('*').eq('status','pago').gte('vencimento',de).lte('vencimento',ate);if(lojaIds)qp=qp.in('loja_id',lojaIds);
    const [ra,rp]=await Promise.all([qa,qp]);
    if(ra.error){AG_ERRO_TAB=/contas_pagar|relation|schema|exist/i.test(ra.error.message||'');}
    [...(ra.data||[]),...(rp.data||[])].forEach(c=>itens.push({k:'c'+c.id,tipo:'conta',id:c.id,loja_id:c.loja_id,desc:c.descricao,valor:Number(c.valor),venc:c.vencimento,status:c.status,cat:nomeCat(c.categoria_id),parcela:c.parcela,pagoComo:c.pago_como,pagoEm:c.pago_em,critico:!!c.critico,rateioDe:c.rateio_de||null}));
    // A pagar antigo (lançamento marcado como não pago)
    try{let ql=sb.from('lancamentos').select('id,loja_id,descricao,valor,vencimento,data,categoria_id').eq('pago',false);if(lojaIds)ql=ql.in('loja_id',lojaIds);const {data}=await ql;
      (data||[]).forEach(l=>{const v=l.vencimento||l.data;if(v>ate)return;itens.push({k:'l'+l.id,tipo:'legado',id:l.id,loja_id:l.loja_id,desc:l.descricao,valor:Math.abs(Number(l.valor)),venc:v,status:'aberto',cat:nomeCat(l.categoria_id)});});}catch(e){}
    // fixos (Recorrentes): aparecem sozinhos; ficam "pagos" quando sai um lançamento parecido perto do dia
    let rq=sb.from('recorrentes').select('*');if(lojaIds)rq=rq.in('loja_id',lojaIds);const {data:recs}=await rq;
    if(recs&&recs.length){
      let lq=sb.from('lancamentos').select('loja_id,data,valor,categoria_id').lt('valor',0).gte('data',addDias(de,-12)).lte('data',addDias(ate,12));if(lojaIds)lq=lq.in('loja_id',lojaIds);
      let ls=[];for(let o=0;;o+=1000){const {data}=await lq.order('id').range(o,o+999);ls=ls.concat(data||[]);if(!data||data.length<1000)break;}
      const meses=[...new Set([de.slice(0,7),ate.slice(0,7)])];
      const contIds=[...new Set(recs.filter(r=>r.contato_id).map(r=>r.contato_id))];let lc=[];
      if(contIds.length){for(let o=0;;o+=1000){const {data}=await sb.from('lancamentos').select('loja_id,data,valor,contato_id').in('contato_id',contIds).lt('valor',0).gte('data',mesShift(de.slice(0,7),-3)+'-01').lte('data',_fimMes(ate.slice(0,7))).order('id').range(o,o+999);lc=lc.concat(data||[]);if(!data||data.length<1000)break;}}
      recs.forEach(r=>{if(!r.dia_vencimento)return;meses.forEach(m=>{const ult=Number(_fimMes(m).slice(8,10));const v=`${m}-${String(Math.min(r.dia_vencimento,ult)).padStart(2,'0')}`;if(v<de||v>ate)return;
        let val=Math.abs(Number(r.valor)||0),pago;
        if(r.contato_id){const doCt=lc.filter(l=>l.loja_id==r.loja_id&&l.contato_id===r.contato_id);const ant=[1,2,3].map(n=>mesShift(m,-n));
          const somaAnt=doCt.filter(l=>ant.includes(String(l.data).slice(0,7))).reduce((t,l)=>t-Number(l.valor),0);const nAnt=ant.filter(a=>doCt.some(l=>String(l.data).slice(0,7)===a)).length;
          if(nAnt)val=Math.round(somaAnt/nAnt*100)/100;pago=doCt.some(l=>String(l.data).slice(0,7)===m);}
        else pago=ls.some(l=>l.loja_id==r.loja_id&&l.categoria_id===r.categoria_id&&_dias(l.data,v)<=10&&Math.abs(Math.abs(Number(l.valor))-val)<=val*0.15);
        itens.push({k:'r'+r.id+m,tipo:'fixo',loja_id:r.loja_id,desc:r.descricao||nomeCat(r.categoria_id),valor:val,venc:v,status:pago?'pago':'aberto',cat:nomeCat(r.categoria_id)+(r.contato_id?' · valor pela média do contato':'')});});});
    }

    try{if(await cxSessao()){const r=await lentesLerCaixinha();((r&&r.diag&&r.diag.listaPrevistos)||[]).forEach((b,i)=>{if(!b.lojaId||(lojaIds&&!lojaIds.includes(b.lojaId)))return;if(b.data>ate||(b.data<de&&b.data<hoje))return;

    return itens;
  }

    LANC_ANO.forEach(l=>{

      const obs=!(l.contatos&&l.contatos.nome)&&l.documento&&String(l.documento).trim()?String(l.documento).trim().toUpperCase():'';

      const tipo=(l.contatos&&l.contatos.tipo)||'';

      const pc=porContato[chave];pc.qtd++;if(l.categorias&&l.categorias.nome)pc.cats.add(l.categorias.nome);

  // ---- COMPARATIVO mês a mês ----
  async function viewComparativo(){
    document.getElementById('content').innerHTML='<div class="loading"><span class="spin"></span> Calculando...</div>';
    await carregarLancAno();
    const meses=Array.from({length:12},()=>({entrada:0,saida:0}));
    LANC_ANO.forEach(l=>{
      const g=l.categorias&&l.categorias.grupo;if(g==='neutra')return;
      const m=parseInt(l.data.split('-')[1],10)-1;const v=Number(l.valor);
      if(v>0)meses[m].entrada+=v;else meses[m].saida+=Math.abs(v);
    });
    const comDados=[];meses.forEach((m,i)=>{if(m.entrada||m.saida)comDados.push(i);});
    if(comDados.length===0){document.getElementById('content').innerHTML='<div class="note">📈 <b>Comparativo</b> — entradas, saídas e resultado de cada mês, lado a lado.</div><div class="card empty"><div class="big">📈</div>Sem dados ainda. Conforme você lança, os meses aparecem aqui.</div>';return;}
    const maxVal=Math.max(...comDados.map(i=>Math.max(meses[i].entrada,meses[i].saida)));
    const rows=comDados.map(i=>{
      const m=meses[i];const res=m.entrada-m.saida;
      const barE=maxVal>0?(m.entrada/maxVal*100):0;const barS=maxVal>0?(m.saida/maxVal*100):0;
      return `<tr><td><b>${MESES_NOME[i]}</b></td>
        <td style="width:200px"><div style="background:rgba(61,220,145,.15);border-radius:4px;height:18px;width:${barE}%;min-width:2px"></div></td>
        <td class="amt green">${BRL(m.entrada)}</td>
        <td style="width:200px"><div style="background:rgba(255,107,107,.15);border-radius:4px;height:18px;width:${barS}%;min-width:2px"></div></td>
        <td class="amt red">-${BRL(m.saida)}</td>
        <td class="amt"><b style="color:${res>=0?'var(--green)':'var(--red)'}">${BRL(res)}</b></td></tr>`;
    }).join('');
    document.getElementById('content').innerHTML=`<div class="note">📈 <b>Comparativo ${ANO_FIXO}</b> — entradas (verde) e saídas (vermelho) de cada mês, com o resultado.</div>
      <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Mês</th><th>Entradas</th><th style="text-align:right">Total</th><th>Saídas</th><th style="text-align:right">Total</th><th style="text-align:right">Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  async function viewCaixa(){

  async function addRecorrente(){
    const desc=document.getElementById('recDesc').value.trim().toUpperCase();
    const cents=parseInt(document.getElementById('recVal').dataset.cents||'0',10);
    const dia=parseInt(document.getElementById('recDia').value,10)||null;
    const catId=document.getElementById('recCat').value||null;
    if(!desc||!cents){toast('Preencha descrição e valor','erro');return;}
    const contId=(document.getElementById('recCont')||{}).value||null;
    const reg={loja_id:lojaAtual,descricao:desc,valor:-(cents/100),categoria_id:catId,dia_vencimento:dia};if(contId)reg.contato_id=Number(contId);
    const {error}=await sb.from('recorrentes').insert(reg);
    if(error){toast('Erro: '+error.message,'erro');return;}
    toast('Recorrente cadastrado!','ok');viewRecorrentes();
  }

  async function viewLixeira(){

    const quem=(uid)=>nomeDe(uid)||(uid?'conta antiga':'—');

    const linha=(it,restaurado)=>{const l=it.dados||{};const cat=l.categorias?.nome||'';return `<tr style="${restaurado?'opacity:.6':''}"><td class="mut">${l.data?isoParaBR(l.data):'—'}</td><td>${l.descricao||'—'}${cat?`<div class="mut" style="font-size:11px">${cat}</div>`:''}</td><td class="amt ${l.valor>0?'green':'red'}">${l.valor>0?'+':'-'}${BRL(Math.abs(l.valor||0))}</td><td style="font-size:12px"><b>${quem(it.excluido_por)}</b><div class="mut" style="font-size:11px">${qd(it.excluido_em)}</div></td><td style="font-size:12px">${restaurado?`<b>${quem(it.restaurado_por)}</b><div class="mut" style="font-size:11px">${qd(it.restaurado_em)}</div>`:(podeExcluir()?`<button class="btn ghost" style="padding:6px 12px" onclick="restaurarLix(${it.id})">↩ Restaurar</button>`:'<span class="mut">só Lucas/Heloísa</span>')}</td></tr>`;};
    document.getElementById('content').innerHTML=`<div class="note">🗑 <b>Lixeira</b> — ${ativos.length} excluído(s) e ${rest.length} já restaurado(s). Cada linha mostra <b>quem excluiu</b> e <b>quem restaurou</b>. Nada some de vez.</div>
      <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Data</th><th>Descrição</th><th style="text-align:right">Valor</th><th>Excluído por</th><th>Restaurado por</th></tr></thead><tbody>${ativos.map(it=>linha(it,false)).join('')}${rest.length?`<tr><td colspan="5" class="mut" style="font-size:11.5px;padding:8px 12px;background:var(--bg)">↩ já restaurados</td></tr>${rest.map(it=>linha(it,true)).join('')}`:''}</tbody></table></div>`;
  }
  async function restaurarLix(lixId){
    if(!podeExcluir()){toast('Seu acesso não restaura. Peça ao Lucas ou à Heloísa.','erro');return;}
    const {data:lix}=await sb.from('lixeira').select('*').eq('id',lixId).single();
    if(!lix){toast('Não encontrado','erro');return;}
    if(lix.restaurado_em){toast('Esse já foi restaurado.','erro');return;}
    const l=lix.dados;
    // remove campos que o banco gera sozinho
    delete l.id;delete l.criado_em;delete l.categorias;delete l.contatos;delete l.contas;Object.keys(l).forEach(k=>{if(k.startsWith('_'))delete l[k];});
    if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    const {error}=await sb.from('lancamentos').insert(l);
    if(error){toast('Erro ao restaurar: '+error.message,'erro');return;}
    const {error:eUp}=await sb.from('lixeira').update({restaurado_em:new Date().toISOString(),restaurado_por:USER.id}).eq('id',lixId);
    if(eUp)await sb.from('lixeira').delete().eq('id',lixId); // banco antigo sem as colunas: some da lista como antes
    toast('Restaurado!','ok');viewLixeira();
  }

  // mesma conta do Caixinha (calcMes): abertura = tudo antes do dia 1º; fechamento = abertura + entradas + reposições + guardado − saídas − empréstimos − depósitos
  function cxCalcMes(k,ano,mes){
    const first=`${ano}-${String(mes).padStart(2,'0')}-01`,pref=`${ano}-${String(mes).padStart(2,'0')}`;
    // Regra oficial do Caixinha: dinheiro = (entrada + reposicao + guardado) − (saida + emprestimo + deposito);
    // emprestado a receber = max(Σ emprestimo − Σ reposicao, 0), QUALQUER contraparte (loja, pessoa ou em branco). Lançamentos excluídos já ficam de fora na carga.
    let abertura=0,ent=0,sai=0,emp=0,rep=0,dep=0,gua=0,empAntes=0,repAntes=0,empTudo=0,repTudo=0;
    k.mov.forEach(m=>{const v=(m.tipo==='entrada'||m.tipo==='reposicao'||m.tipo==='guardado')?m.valor:-m.valor;
      if(m.tipo==='emprestimo')empTudo+=m.valor;else if(m.tipo==='reposicao')repTudo+=m.valor;
      if((m.data||'')<first){abertura+=v;if(m.tipo==='emprestimo')empAntes+=m.valor;else if(m.tipo==='reposicao')repAntes+=m.valor;}
      else if((m.data||'').slice(0,7)===pref){if(m.tipo==='entrada')ent+=m.valor;else if(m.tipo==='saida')sai+=m.valor;else if(m.tipo==='emprestimo')emp+=m.valor;else if(m.tipo==='reposicao')rep+=m.valor;else if(m.tipo==='deposito')dep+=m.valor;else if(m.tipo==='guardado')gua+=m.valor;}});
    // IGUAL AO CAIXINHA v57 (aReceberAte): emprestado em 01/MM = empréstimos − reposições com data ANTES do dia 1º;
    // no fim do mês = com data ATÉ o último dia. Qualquer contraparte. Nunca negativo.
    const abEmp=Math.max(empAntes-repAntes,0), fimEmp=Math.max(empAntes+emp-(repAntes+rep),0);
    const fechamento=abertura+ent+rep+gua-sai-emp-dep;
    return {abertura,abEmp,empAntes,repAntes,ent,sai,emp,rep,dep,gua,fechamento,fimEmp,aReceber:fimEmp,totalAbertura:abertura+abEmp,totalFim:fechamento+fimEmp};

  function fecharModal(){document.getElementById('modalRoot').innerHTML='';}

  // ====== GRÁFICO DE ROSCA (SVG puro) ======
  const CORES_GRAF=['#3ddc91','#7da2ff','#e8c468','#ff6b6b','#c084fc','#4dd4d4','#f5905a','#a0d468','#ec87c0','#5d9cec','#aab2bd','#ffce54','#48cfad','#ed5565','#967adc'];
  function donut(itens,total,tipo){
    // itens: [{nome,valor,pct}] já ordenados. total: soma. tipo: 'rec' ou 'des' pra abrir detalhes
    if(total<=0||itens.length===0)return '<div class="empty" style="padding:30px"><div class="big">📊</div>Sem dados neste mês</div>';
    const R=70,r=42,cx=90,cy=90;let ang=-Math.PI/2;
    const arcs=itens.map((it,i)=>{
      const frac=it.valor/total;const a2=ang+frac*Math.PI*2;
      const x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang);
      const x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      const xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2);
      const xi1=cx+r*Math.cos(ang),yi1=cy+r*Math.sin(ang);
      const large=frac>0.5?1:0;
      const cor=CORES_GRAF[i%CORES_GRAF.length];
      const path=`M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${r} ${r} 0 ${large} 0 ${xi1} ${yi1} Z`;
      ang=a2;
      // rótulo de % na fatia (só se >5%)
      let lbl='';
      if(frac>0.05){const mid=(ang+ (ang-frac*Math.PI*2))/2;const lx=cx+(R+r)/2*Math.cos(mid),ly=cy+(R+r)/2*Math.sin(mid);lbl=`<text x="${lx}" y="${ly}" fill="#04130c" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">${(frac*100).toFixed(1).replace('.',',')}%</text>`;}
      const clique=tipo&&!it.semClique?`onclick="abrirDetalheCategoria('${(it.nome||'').replace(/'/g,"\\'")}','${tipo}')" style="cursor:pointer"`:'';
      return `<path d="${path}" fill="${cor}" ${clique}><title>${it.nome}: ${BRL(it.valor)}</title></path>${lbl}`;
    }).join('');
    return `<svg viewBox="0 0 180 180" style="width:180px;height:180px;flex-shrink:0">${arcs}</svg>`;
  }
  function legenda(itens,total,tipo){
    return itens.map((it,i)=>{
      const cor=CORES_GRAF[i%CORES_GRAF.length];const pct=total>0?(it.valor/total*100):0;
      const clique=tipo&&!it.semClique?`onclick="abrirDetalheCategoria('${(it.nome||'').replace(/'/g,"\\'")}','${tipo}')" style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer" onmouseover="this.style.background='rgba(255,255,255,.03)'" onmouseout="this.style.background='transparent'"`:'style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"';
      return `<div ${clique}>
        <span style="width:11px;height:11px;border-radius:3px;background:${cor};flex-shrink:0"></span>
        <span style="flex:1">${it.nome}${it.sub?` <span class="mut" style="font-size:11px">· ${it.sub}</span>`:''} <span class="mut" style="font-size:11px">${pct.toFixed(1).replace('.',',')}%</span></span>
        <b style="font-variant-numeric:tabular-nums">${BRL(it.valor)}</b>${tipo?'<span class="mut" style="font-size:11px;margin-left:4px">›</span>':''}</div>`;
    }).join('');
  }
  function graficoCard(titulo,itens,total,corTotal,refMes,tipo){
    return `<div class="card"><div class="cardhead"><h3 style="font-size:14px">${titulo}</h3></div>

  // abre janela com os lançamentos de uma categoria (clicando no gráfico do dashboard)
  function abrirDetalheCategoria(nomeCat,tipo){
    const lista=_lancMesDash.filter(l=>{
      const g=l.categorias&&l.categorias.grupo;if(g==='neutra')return false;
      const nome=(l.categorias&&l.categorias.nome)||'Sem categoria';
      if(nome!==nomeCat)return false;
      return tipo==='rec'?Number(l.valor)>0:Number(l.valor)<0;
    }).sort((a,b)=>a.data.localeCompare(b.data));
    let total=0;
    const rows=lista.map(l=>{total+=Math.abs(Number(l.valor));return `<tr>
      <td class="mut" style="white-space:nowrap">${isoParaBR(l.data).slice(0,5)}</td>
      <td>${l.descricao||'—'}</td>
      <td class="mut">${(l.contatos&&l.contatos.nome)||'—'}</td>
      <td class="amt ${tipo==='rec'?'green':'red'}" style="white-space:nowrap;text-align:right">${tipo==='rec'?'+':'-'}${BRL(Math.abs(l.valor))}</td>
    </tr>`;}).join('');
    const cor=tipo==='rec'?'var(--green)':'var(--red)';
    document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal" style="max-width:640px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="margin:0">${nomeCat}</h3><button class="delx" style="font-size:18px" onclick="fecharModal()">✕</button></div>
      <p style="margin-top:0">${lista.length} lançamento(s) em ${MESES_NOME[mesSel]} ${ANO_FIXO}</p>
      <div style="max-height:60vh;overflow:auto"><table><thead><tr><th>Data</th><th>Descrição</th><th>Contato</th><th style="text-align:right">Valor</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="mut" style="text-align:center;padding:20px">Nenhum lançamento</td></tr>'}</tbody></table></div>
      <div style="display:flex;justify-content:space-between;border-top:2px solid var(--line);margin-top:10px;padding-top:10px"><b>Total</b><b style="color:${cor};font-size:16px">${BRL(total)}</b></div>
    </div></div>`;
  }

  // maiúsculo automático em qualquer campo com classe "maiusc"
  document.addEventListener('input',function(e){
    const el=e.target;
    if(el&&el.classList&&el.classList.contains('maiusc')&&el.type!=='date'){
      const pos=el.selectionStart;const up=el.value.toUpperCase();
      if(el.value!==up){el.value=up;try{el.setSelectionRange(pos,pos);}catch(_){}}
    }
  });

  window.addEventListener('load',async()=>{
    if(!initSupabase())return;
    try{const {data}=await sb.auth.getSession();if(data&&data.session){await iniciarApp(data.session.user);}}catch(e){}
  });
  </script>
</body>
</html>
