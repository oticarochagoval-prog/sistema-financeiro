<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Fluxo — Financeiro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f9d6b'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='40' fill='white'%3EF%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0f0d;--panel:#121814;--panel-2:#18211c;--line:#23302a;
    --txt:#eaf2ed;--muted:#8aa096;--green:#3ddc91;--red:#ff6b6b;--gold:#e8c468;--amber:#f5b740;--blue:#7da2ff;
    --accent:#3ddc91;--accent-ink:#04130c;--chip:#1d2722;
    --shadow:0 1px 0 rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.4);
  }
  /* tema claro (botão ☀️/🌙 na barra de cima) */
  :root[data-theme="light"]{
    --bg:#f3f6f4;--panel:#ffffff;--panel-2:#eaf0ed;--line:#d6dfda;
    --txt:#14201a;--muted:#5c6e65;--green:#1f9d6b;--red:#d64545;--gold:#b58a1b;--amber:#c7861a;--blue:#3b63d9;
    --accent:#1f9d6b;--accent-ink:#ffffff;--chip:#e6ece9;
    --shadow:0 1px 0 rgba(0,0,0,.02),0 8px 24px rgba(20,32,26,.08);
  }
  :root[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c3cdc8}

  :root[data-theme="light"] .note b{color:#1d3480}
  /* v2.9.72: a linha em que a pessoa está mexendo fica marcada até ela ir para outra */
  tr.lancFoco>td{background:rgba(59,99,217,.10)!important}
  tr.lancFoco>td:first-child{box-shadow:inset 4px 0 0 var(--blue)}
  :root[data-theme="light"] tr.lancFoco>td{background:#e3e9fb!important}
  /* v2.9.70: etiquetas da Íris legíveis no modo claro */
  .iris-tag{font-size:10.5px}
  .iris-certeza{color:rgb(61,214,140);border-color:rgba(61,214,140,.45)!important;background:rgba(61,214,140,.08)}
  .iris-confira{color:rgb(245,183,64);border-color:rgba(245,183,64,.45)!important;background:rgba(245,183,64,.08)}
  .iris-gente{color:rgb(240,110,110);border-color:rgba(214,69,69,.5)!important;background:rgba(214,69,69,.08)}
  .iris-nunca{color:rgb(150,168,158);border-color:rgba(143,161,151,.45)!important;background:rgba(143,161,151,.08)}
  :root[data-theme="light"] .iris-certeza{color:#0b6a45;border-color:rgba(11,106,69,.55)!important;background:rgba(61,214,140,.14);font-weight:600}
  :root[data-theme="light"] .iris-confira{color:#7a4a00;border-color:rgba(160,100,0,.6)!important;background:rgba(245,183,64,.18);font-weight:600}
  :root[data-theme="light"] .iris-gente{color:#9e1f1f;border-color:rgba(158,31,31,.55)!important;background:rgba(214,69,69,.12);font-weight:600}
  :root[data-theme="light"] .iris-nunca{color:#3f4b45;border-color:rgba(63,75,69,.45)!important;background:rgba(143,161,151,.16);font-weight:600}
  .iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:15px;display:grid;place-items:center;flex-shrink:0}
  .iconbtn.help{background:#1f9d6b;border-color:#1f9d6b;color:#fff;font-weight:800;font-size:16px}
  .iconbtn.help.cx{background:#2f6fd6;border-color:#2f6fd6;font-size:12px;width:auto;padding:0 9px;letter-spacing:-.5px}
  .manual{max-width:860px;line-height:1.65;font-size:14.5px}
  .manual h1{font-size:22px;margin:4px 0 14px}.manual h2{font-size:17px;margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--line)}.manual h3{font-size:15px;margin:18px 0 8px}
  .manual p{margin:0 0 10px}.manual ul,.manual ol{margin:0 0 12px 22px}.manual li{margin-bottom:5px}
  .manual table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13.5px}.manual th,.manual td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}.manual th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
  .manual blockquote{border-left:3px solid var(--green);padding:6px 12px;margin:0 0 12px;color:var(--muted);background:var(--panel-2);border-radius:0 8px 8px 0}
  .manual code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12.5px}
  .manual blockquote.ok{border-left-color:var(--green);background:rgba(61,214,140,.10);color:var(--txt)}.manual blockquote.nao{border-left-color:var(--red);background:rgba(255,92,92,.10);color:var(--txt)}.manual blockquote.cuidado{border-left-color:var(--amber);background:rgba(245,183,64,.12);color:var(--txt)}.manual blockquote.dica{border-left-color:var(--blue);background:rgba(125,162,255,.10);color:var(--txt)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a3a32;border-radius:6px}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(61,220,145,.06),transparent 60%)}

  .login-card .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:26px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px 15px;color:var(--txt);font-size:15px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--green)}
  .field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px 15px;color:var(--txt);font-size:15px;outline:none}
  .login-alt{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:12px;cursor:pointer;text-decoration:underline}
  .login-btn{width:100%;background:var(--green);color:var(--accent-ink);border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}

  .login-err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:#ffc9c9;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:16px;display:none}
  .login-foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px}
  #app{display:none}
  #app.show{display:flex;min-height:100vh}
  .side{width:230px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0;transition:width .18s}
  .side.collapsed{width:62px}
  .brand{display:flex;align-items:center;gap:11px;padding:18px 16px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#3ddc91,#1f9d6b);display:grid;place-items:center;font-weight:800;color:#04130c;font-size:17px;flex-shrink:0}
  .brand b{font-size:16px;white-space:nowrap}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.5px}
  .burger{margin-left:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--txt);cursor:pointer;font-size:17px;width:34px;height:34px;display:grid;place-items:center;flex-shrink:0}
  .burger:hover{background:var(--line);color:var(--green)}
  .side.collapsed .brand b,.side.collapsed .brand small,.side.collapsed .navtxt{display:none}
  .side.collapsed .brand{justify-content:center;padding:18px 10px}.side.collapsed .logo{display:none}
  .side.collapsed .burger{margin:0 auto;width:42px;height:42px}
  nav{padding:8px 10px;flex:1;overflow-y:auto}
  .seclabel{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:12px 12px 5px}
  .seclabel.dobra{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;border-radius:8px}
  .seclabel.dobra:hover{color:var(--txt)}
  .seclabel .seta{font-size:11px;transition:transform .15s}.seclabel.fechada .seta{transform:rotate(-90deg)}
  .side.collapsed .seclabel{display:none}
  .nav{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:550;white-space:nowrap;margin-bottom:2px;border:1px solid transparent;position:relative}
  .nav:hover{background:var(--panel-2);color:var(--txt)}
  .nav.active{background:linear-gradient(100deg,rgba(61,220,145,.16),rgba(61,220,145,.04));color:var(--green);border-color:rgba(61,220,145,.22)}
  .nav .ic{width:19px;text-align:center;font-size:15px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
  .nav .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav .soon{margin-left:auto;font-size:9px;background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:8px;font-weight:700}
  .side.collapsed .nav{justify-content:center;padding:11px}.side.collapsed .nav .soon{display:none}
  .side.collapsed .nav:hover::after{content:attr(data-label);position:absolute;left:58px;background:#000;color:#fff;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;white-space:nowrap;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .sidefoot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .side.collapsed .sidefoot{display:none}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:var(--bg)}
  .pagetitle{font-size:18px;font-weight:700}
  .modbox{margin-left:auto;display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}

  .store{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt);max-width:230px}
  .logout{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--txt);cursor:pointer;font-size:12px;padding:7px 12px}
  .logout:hover{border-color:var(--red);color:var(--red)}
  .content{padding:24px;max-width:1280px;width:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}@media(max-width:980px){.two{grid-template-columns:1fr}}
  .cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.cardhead h3{font-size:15px;font-weight:700}
  .tag{font-size:11px;color:var(--muted);background:var(--chip);padding:3px 10px;border-radius:20px}
  .quickbar{background:linear-gradient(100deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
  .quickrow{display:grid;gap:10px;align-items:end}
  .quickrow.l1{grid-template-columns:200px 130px 1fr 150px;margin-bottom:10px}
  .quickrow.l2{grid-template-columns:130px 1fr 1fr 150px}
  @media(max-width:900px){.quickrow.l1,.quickrow.l2{grid-template-columns:1fr 1fr}}
  .qlabel{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;display:block}
  .qin{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13.5px;outline:none;height:42px}
  .maiusc{text-transform:uppercase}

  .combolist{overflow-y:auto;padding:0 7px 9px}
  .comboitem{padding:9px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--txt)}
  .comboitem:hover{background:var(--line)}
  .comboitem.sel{background:var(--line);outline:1px solid var(--green)}
  .comboitem.clear{color:var(--muted);font-size:12px}
  .comboitem .csub{color:var(--muted);font-size:11px}
  select option,select optgroup{background:var(--panel-2);color:var(--txt)}
  select optgroup{font-weight:700;color:var(--muted)}
  .inlinedesc{width:100%;min-width:130px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--txt);padding:5px 7px;font-size:13px;font-family:inherit;outline:none}

  .tipo-toggle button.rec{background:rgba(61,220,145,.15);color:var(--green)}
  .tipo-toggle button.tra{background:rgba(125,162,255,.15);color:var(--blue)}
  .addbtn{width:100%;height:42px;border:none;border-radius:9px;background:var(--green);color:var(--accent-ink);font-size:14px;font-weight:700;cursor:pointer}

  .miniadd{width:42px;height:42px;flex-shrink:0;border:1px solid var(--line);background:var(--panel-2);color:var(--green);border-radius:9px;font-size:18px;font-weight:700;cursor:pointer}
  .hint{font-size:11px;color:var(--muted);margin-top:9px;display:flex;gap:14px;flex-wrap:wrap}
  .kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:monospace;font-size:10.5px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px}
  .search input{background:none;border:none;outline:none;color:var(--txt);font-size:13.5px;width:100%}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:11px 13px;border-bottom:1px solid var(--line);font-weight:700}
  tbody td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr.neutra{background:rgba(125,162,255,.15)}

  .amt.green{color:var(--green)}.amt.red{color:var(--red)}.amt.blue{color:var(--blue)}
  .catchip{font-size:11.5px;background:var(--chip);padding:3px 11px;border-radius:20px;border:1px solid var(--line)}

  .contchip.func{background:rgba(125,162,255,.1);color:var(--blue);border-color:rgba(125,162,255,.3)}
  .parc{font-size:10.5px;color:var(--gold);background:rgba(232,196,104,.1);padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:700}

  .btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line)}

  // ---- MANUAL (lê o arquivo manual.md que fica na mesma pasta do index.html) ----
  function mdParaHTML(md){
    const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<i>$1</i>');
    const lines=md.replace(/\r/g,'').split('\n');let html='',i=0;
    while(i<lines.length){
      const L=lines[i];
      if(/^\s*$/.test(L)){i++;continue;}
      if(/^#{1,3} /.test(L)){const n=L.match(/^#+/)[0].length;html+=`<h${n}>${inline(L.replace(/^#+ /,''))}</h${n}>`;i++;continue;}
      if(/^\|/.test(L)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
        const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
        const body=rows.filter(r=>!/^\|\s*-{2,}/.test(r));
        html+='<table>'+body.map((r,k)=>'<tr>'+cells(r).map(c=>k===0?`<th>${inline(c)}</th>`:`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue;}
      if(/^> /.test(L)){let t=[];while(i<lines.length&&/^> ?/.test(lines[i])){t.push(lines[i].replace(/^> ?/,''));i++;}const tx=t.join(' ');const cls=/^✅/.test(tx)?'ok':(/^⛔|^❌|^🚫/.test(tx)?'nao':(/^⚠/.test(tx)?'cuidado':(/^💡|^ℹ/.test(tx)?'dica':'')));html+=`<blockquote class="${cls}">${inline(tx)}</blockquote>`;continue;}
      if(/^(\d+)\. /.test(L)||/^[-*] /.test(L)){const ord=/^\d+\. /.test(L);const tag=ord?'ol':'ul';let items=[];
        while(i<lines.length&&(/^(\d+)\. /.test(lines[i])||/^[-*] /.test(lines[i])||/^\s{2,}\S/.test(lines[i]))){const ln=lines[i];if(/^\s{2,}\S/.test(ln)&&items.length){items[items.length-1]+=' '+ln.trim();}else{items.push(ln.replace(/^(\d+\. |[-*] )/,''));}i++;}
        html+=`<${tag}>`+items.map(x=>`<li>${inline(x)}</li>`).join('')+`</${tag}>`;continue;}
      if(/^---+$/.test(L)){i++;continue;}
      let t=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,3} |\||> |\d+\. |[-*] |---)/.test(lines[i])){t.push(lines[i]);i++;}
      html+=`<p>${inline(t.join(' '))}</p>`;
    }
    return html;
  }

  async function trocarModulo(k){if(k===MODULO_ATUAL)return;_lojaPorModulo[MODULO_ATUAL]=lojaAtual;MODULO_ATUAL=k;try{localStorage.setItem('fluxo_modulo',k);}catch(e){}

  // ---- CONCILIAÇÃO SIPAG (v2.0): extrato do Sicoob × previsto do Cartões Rocha (só leitura lá) ----
  const CT_URL='https://rhyojtbxcpvjfbdqpaef.supabase.co';
  const CT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoeW9qdGJ4Y3B2amZiZHFwYWVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDcyMTQsImV4cCI6MjA5NDIyMzIxNH0.0ghbsYqK8WwLnYCHQ7_ejmNZg_Y6f7Uc8ZbySxnbG54';
  let _ct=null;let _ctCache={};
  function ctCli(){if(!_ct&&window.supabase)_ct=window.supabase.createClient(CT_URL,CT_ANON,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'sb-cartoes-espelho'}});return _ct;}
  async function ctMes(chave){if(_ctCache[chave]!==undefined)return _ctCache[chave];const c=ctCli();if(!c)throw new Error('sem conexão com o Cartões');
    const {data,error}=await c.from('meses').select('observacoes').eq('mes',chave).maybeSingle();if(error)throw error;_ctCache[chave]=data?(data.observacoes||{}):null;return _ctCache[chave];}
  function mesShift(m,n){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
  function diaUtilSipag(iso){const [y,m,d]=iso.split('-').map(Number);const x=new Date(y,m-1,d);const w=x.getDay();if(w===6)x.setDate(x.getDate()+2);else if(w===0)x.setDate(x.getDate()+1);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;}
  const CARTAO_RE=/SIPAG|ANTECIPA|CR ANT|CR CPS|CR CMP|CR COMPRAS|STONE|PAGSEGURO|PAGBANK|GETNET|CIELO|REDE /i;
  // "SIPAG_Ant._Mastercard" → antecipação · "SIPAG_Deb._Visa Electron" → débito · "SIPAG_Cred._Visa" → parcela de crédito
  function sipagInfo(full,amt){const t=String(full||'');if(!/SIPAG|ANTECIPA|CR ANT|CR CPS|CR CMP|CR COMPRAS/i.test(t))return null;
    let tipo='outro',band='';const m=t.match(/SIPAG[_ ]+(Ant|D[eé]b|Cr[eé]d)[._ ]+([A-Za-zÀ-ú ]+)/i);
    if(m){const k=m[1].toLowerCase();tipo=k.startsWith('ant')?'antecipacao':(k.startsWith('d')?'debito':'credito_parcela');band=m[2].trim();}
    else if(/ANTECIPA|CR ANT/i.test(t))tipo='antecipacao';else if(/ELECTRON|MAESTRO|D[EÉ]BITO/i.test(t))tipo='debito';else if(/CR CMP|CR CPS|COMPRAS|CR[EÉ]DITO/i.test(t))tipo='credito_parcela';
    if(!band){const b=t.match(/VISA ELECTRON|ELECTRON|MAESTRO|MASTERCARD|MSTD|MASTER|VISA|ELO|OUTRAS BANDEIRAS|OUT BND|HIPERCARD|AMEX/i);band=b?b[0]:'';}
    if(amt<0)tipo='estorno';return {tipo,band};}
  function lojaNomeCurto(id){const L=LOJAS.find(l=>l.id===id);return L?L.nome.split(' — ')[0].trim():'';}

  const CAT_PIX_VENDA='VENDA PIX', PIX_VENDA_DESDE='2026-10-01'; // v2.9.6: já vale em outubro
  const CAT_PIX='PIX DE CLIENTE — VENDA NA LINX', CAT_DEPGAV='DEPÓSITO DA GAVETA (CAIXINHA)', CAT_DEVOL='DEVOLUÇÃO A CLIENTE';
  function catPorNome(n){const u=String(n).toUpperCase();return catsAtivas().find(c=>String(c.nome).toUpperCase()===u)||null;}

  // previsto do Cartões para uma loja, nos depósitos que caem no mês M do banco
  // antecipação das vendas de M-1 cai no 1º dia útil de M (e eventuais de M caem em M); débito cai D+1 (agenda do Detalhado)
  async function sipagEsperado(lojaCurta,M){
    const mapaRow=await ctMes('_CONC_MAPA');const mapa=(mapaRow&&mapaRow.ecMap)||{};
    const ch=cxChaveLoja(lojaCurta);
    const ecs=Object.entries(mapa).filter(([,l])=>l&&l!=='_ignorar'&&cxChaveLoja(l)===ch).map(([ec])=>ec);
    const E=[],extras=[],avisos=[];let temAntec=false,temAgenda=false;

      const bk=Object.keys(o.banco||{}).find(k=>cxChaveLoja(k)===ch);const b=bk?o.banco[bk]:{};const bItens=b.itens||{};

            E.push({k:mv+'/'+kc,kc,mesV:mv,data:a.data,valor:Math.round(a.liquido*100)/100,t:'a',sub:a.tipo,bruto:a.antecipado,marca:bItens[kc]||null});});
        }else if(mv===mesShift(M,-1)){const dia=diaUtilSipag(M+'-01');
          ecs.forEach(ec=>{const v=ant.porEC[ec];if(!v)return;temAntec=true;const kc=`a:${ec}`;E.push({k:mv+'/'+kc,kc,mesV:mv,data:dia,valor:Math.round(v.liquido*100)/100,t:'a',sub:'automatica',bruto:v.antecipado,marca:bItens[kc]||null,total:true});});}
      }

      if(ag){const porDia={};ecs.forEach(ec=>{Object.entries(ag[ec]||{}).forEach(([dia,arr])=>{const deb=arr&&arr[1];if(deb>0&&dia.slice(0,7)===M)porDia[dia]=(porDia[dia]||0)+deb;});});
        Object.keys(porDia).sort().forEach(dia=>{temAgenda=true;const kc=`d:${dia}`;E.push({k:mv+'/'+kc,kc,mesV:mv,data:dia,valor:Math.round(porDia[dia]*100)/100,t:'d',marca:bItens[kc]||null});});}
      (b.extras||[]).forEach(x=>extras.push(Object.assign({},x,{mesV:mv})));

      if(!temAgenda)avisos.push('__SEMAGENDA__');}
    // total de débito líquido das vendas de M (arquivo da Sipag subido no Cartões) — usado quando não tem a agenda dia a dia
    let debTotal=0;try{const oM=await ctMes('_CONC_'+M);const pe=(oM&&oM.sipag&&oM.sipag.porEC)||{};
      ecs.forEach(ec=>{const v=pe[ec];if(!v)return;const cb=Object.entries(v.combos||{});
        const cred=typeof v.credito==='number'?v.credito:cb.reduce((a,[k,c])=>/cr[eé]dito/i.test(k.split('|')[1]||'')?a+(c.bruto||0)+(c.estorno||0):a,0);

      :(debTotal>0?`Sem a agenda dia a dia dos débitos (Detalhado de vendas não subido no Cartões). O quadro de cima compara pelo total do mês: ${BRL(Math.round(debTotal*100)/100)} (aproximado).`:'Sem valor de débito no Cartões (arquivo da Sipag / Detalhado não subido) — débitos aparecem como "caiu sem estar previsto".');
    return {E,extras,avisos,ecs,debTotal};

  // casa previsto × caiu: 1 a 1 (valor ±5 centavos, data ±3 dias); depois soma do dia (a Sipag junta/separa depósitos); antecipação: soma do mês
  function conciliarSipag(E,R){
    const eq=(a,b,tol)=>Math.abs(a-b)<(tol||0.05);const pares=[];const eU=new Set(),rU=new Set();
    const lado=(t,tipos,somaGeral)=>{
      const Es=E.filter(e=>e.t===t),Rs=R.filter(r=>tipos.includes(r.tipo));
      Es.slice().sort((a,b)=>b.valor-a.valor).forEach(e=>{const r=Rs.find(r=>!rU.has(r.id)&&eq(r.valor,e.valor)&&Math.abs(_dias(r.data,e.data))<=3);if(r){eU.add(e.k);rU.add(r.id);pares.push({t,e:[e],r:[r]});}});
      const dias=[...new Set(Es.filter(e=>!eU.has(e.k)).map(e=>e.data))].sort();
      dias.forEach(d=>{const ee=Es.filter(e=>!eU.has(e.k)&&e.data===d);if(!ee.length)return;const se=ee.reduce((a,e)=>a+e.valor,0);
        for(const off of [0,1,-1,2,3]){const dd=addDias(d,off);const rr=Rs.filter(r=>!rU.has(r.id)&&r.data===dd);if(!rr.length)continue;const sr=rr.reduce((a,r)=>a+r.valor,0);
          if(eq(se,sr,0.05*Math.max(ee.length,rr.length))){ee.forEach(e=>eU.add(e.k));rr.forEach(r=>rU.add(r.id));pares.push({t,e:ee,r:rr});break;}}});
      if(somaGeral){const eL=Es.filter(e=>!eU.has(e.k)),rL=Rs.filter(r=>!rU.has(r.id));
        if(eL.length&&rL.length){const se=eL.reduce((a,e)=>a+e.valor,0),sr=rL.reduce((a,r)=>a+r.valor,0);if(eq(se,sr,0.05*Math.max(eL.length,rL.length))){eL.forEach(e=>eU.add(e.k));rL.forEach(r=>rU.add(r.id));pares.push({t,e:eL,r:rL});}}}
    };
    lado('a',['antecipacao','outro'],true);lado('d',['debito','outro'],false);
    return {pares,eSobra:E.filter(e=>!eU.has(e.k)),rSobra:R.filter(r=>!rU.has(r.id))};
  }

  const _CT_T=0.05;

      <div style="overflow-x:auto;margin-top:12px"><table style="min-width:640px"><thead><tr><th>Loja</th><th ${tdN}>Antecipação · tem que cair</th><th ${tdN}>caiu</th><th ${tdN}>Débitos · tem que cair</th><th ${tdN}>caiu</th><th>Situação</th></tr></thead>
        <tbody>${tr}<tr style="font-weight:800"><td>Total</td><td ${tdN}>${sR(s(linhas,'prevA'))}</td><td ${tdN}>${sR(s(C,'caiuA'))}</td><td ${tdN}>${sR(s(linhas.filter(compD),'prevD'))}</td><td ${tdN}>${sR(s(C,'caiuD'))}</td><td>${resumo}</td></tr></tbody></table></div>

  // ---- "Conferi no extrato": aprovação manual dos depósitos digitados (só dono; o banco grava nome e hora) ----
  async function sipagConfirmar(desfazer){
    if(!ehDono()){toast('Só o gestor (Lucas ou Heloísa) pode conferir no extrato.','erro');return;}
    if(!_concSip){render();return;}
    const loja=lojaNomeCurto(lojaAtual),mesNome=MESES_NOME[mesSel];
    const alvo=_concSip.R.filter(r=>r.origem==='digitado'&&(desfazer?!!r.confirmado_em:!r.confirmado_em));
    if(!alvo.length){toast('Nada pra '+(desfazer?'desfazer':'conferir')+'.','ok');return;}
    const tot=alvo.reduce((a,r)=>a+Number(r.valor||0),0);
    const msg=desfazer?`Desfazer a conferência de ${alvo.length} depósito(s) digitado(s) da ${loja} em ${mesNome} (${BRL(tot)})?\n\nEles voltam a ficar "falta o banco confirmar" no Cartões Rocha.`
      :`Confirmar que você olhou o extrato do Sicoob e caíram ${alvo.length} depósito(s) digitado(s) da ${loja} em ${mesNome}, total ${BRL(tot)}?\n\nFica gravado o seu nome e a hora. Quando o OFX entrar, a linha do banco passa a valer.`;
    if(!confirm(msg))return;
    const {error}=await sb.from('sipag_lancamentos').update(desfazer?{confirmado_por:null,confirmado_em:null}:{confirmado_por:PERFIL.nome||'?',confirmado_em:new Date().toISOString()}).in('id',alvo.map(r=>r.id));
    if(error){toast(/confirmado/i.test(error.message)&&/column|coluna|schema/i.test(error.message)?'Rode o SQL da v2.1 no sistema-financeiro primeiro.':'Erro: '+error.message,'erro');return;}
    toast(desfazer?'↩ Conferência desfeita.':`✅ ${alvo.length} depósito(s) conferido(s) no extrato.`,'ok');render();
  }

  // =================== 🧭 RADAR DO MÊS ===================
  // Previsão por categoria (média dos 3 meses anteriores, ou o valor do Recorrente = fixo). Não é conta a pagar:
  // ninguém lança nem dá baixa, nunca acumula de um mês pro outro, e o "pago" vem sozinho do que entrou no extrato.
  let RADAR_ESCOPO='loja',RADAR_CMP=null,_radarSeq=0;
  const _mesAdd=(M,n)=>mesShift(M,n);
  const _fimMes=M=>`${M}-${String(new Date(Number(M.slice(0,4)),Number(M.slice(5,7)),0).getDate()).padStart(2,'0')}`;
  const _mesNomeM=M=>MESES_NOME[parseInt(M.slice(5,7),10)-1];
  function radarIcone(c){const n=(c&&c.nome)||'';
    if(/FUNCION|SAL[AÁ]RIO|FOLHA|PR[OÓ]-?LABORE|COMISS/i.test(n))return '👥';if(/IMPOSTO|SIMPLES|DAS\b|ICMS|ISS|TRIBUT/i.test(n))return '🧾';
    if(/ALUGUEL|CONDOM/i.test(n))return '🏠';if(/LENTE|LABORAT/i.test(n))return '🔬';if(/FORNEC|ARMA[CÇ]|MERCADORIA|COMPRA/i.test(n))return '📦';
    if(/CEMIG|ENERGIA|LUZ|SAAE|[AÁ]GUA|TELEF|INTERNET/i.test(n))return '⚡';if(/MARKETING|PROPAGANDA|AN[UÚ]NCIO/i.test(n))return '📣';
    if(/JUROS|TARIFA|BANC/i.test(n))return '🏦';if(/CART[AÃ]O/i.test(n))return '💳';
    return ({cmv:'📦',imp:'🧾',fixo:'🏢',nop:'💼'})[c&&c.grupo]||'•';}
  async function radarCarregar(M,lojaIds){
    const de=_mesAdd(M,-3)+'-01',ate=_fimMes(_mesAdd(M,3));let lancs=[];
    for(let o=0;;o+=1000){let q=sb.from('lancamentos').select('id,loja_id,data,valor,categoria_id,contato_id,descricao,parcela,pago,vencimento').gte('data',de).lte('data',ate);
      if(lojaIds)q=q.in('loja_id',lojaIds);const {data,error}=await q.order('id').range(o,o+999);if(error)throw error;lancs=lancs.concat(data||[]);if(!data||data.length<1000)break;}
    try{let cq=sb.from('contas_pagar').select('id,loja_id,descricao,valor,vencimento,categoria_id,contato_id,parcela').eq('status','aberto').lte('vencimento',ate);if(lojaIds)cq=cq.in('loja_id',lojaIds);
      const {data:cps}=await cq;(cps||[]).forEach(c=>lancs.push({id:'cp'+c.id,loja_id:c.loja_id,data:c.vencimento,vencimento:c.vencimento,valor:-Number(c.valor),categoria_id:c.categoria_id,contato_id:c.contato_id,descricao:c.descricao,parcela:null,pago:false}));}catch(e){}
    let rq=sb.from('recorrentes').select('*');if(lojaIds)rq=rq.in('loja_id',lojaIds);
    const {data:recs}=await rq;return {lancs,recs:recs||[]};
  }
  function radarCalcular(M,dados){
    const hoje=new Date().toISOString().slice(0,10),mesHoje=hoje.slice(0,7);
    const cat=id=>CATS.find(c=>c.id===id)||null;const grupo=l=>{const c=cat(l.categoria_id);return c?c.grupo:'adef';};
    const mesDe=l=>String(l.data||'').slice(0,7);const vencDe=l=>String(l.vencimento||l.data||'').slice(0,7);
    const passados=[_mesAdd(M,-1),_mesAdd(M,-2),_mesAdd(M,-3)];
    const L=dados.lancs.filter(l=>grupo(l)!=='neutra');
    const pagoOk=l=>l.pago!==false;
    const mesesComDado=passados.filter(m=>dados.lancs.some(l=>mesDe(l)===m));const nM=Math.max(mesesComDado.length,1);
    const C={};const pega=id=>{const k=id==null?'sem':id;if(!C[k])C[k]={id:k,cat:cat(id),media:0,fixo:0,dia:null,pago:0,aberto:0,fut:{},ct:{}};return C[k];};
    let recMedia=0,recMes=0;
    L.forEach(l=>{const v=Number(l.valor),m=mesDe(l);
      if(v>0){if(!pagoOk(l))return;if(mesesComDado.includes(m))recMedia+=v/nM;if(m===M)recMes+=v;return;}
      const x=pega(l.categoria_id),a=-v;
      if(pagoOk(l)){const kc=l.contato_id||'sem',cc=x.ct[kc]||(x.ct[kc]={id:l.contato_id,media:0,pago:0});
        if(mesesComDado.includes(m)){x.media+=a/nM;cc.media+=a/nM;}if(m===M){x.pago+=a;cc.pago+=a;}else if(m>M)x.fut[m]=(x.fut[m]||0)+a;}
      else{const vm=vencDe(l);if(vm===M)x.aberto+=a;else if(vm>M)x.fut[vm]=(x.fut[vm]||0)+a;}});
    // parcelas: "3/6" lançada → projeta 4ª, 5ª, 6ª nos meses seguintes (se ainda não foram lançadas)
    const series={};
    L.filter(l=>Number(l.valor)<0&&/^\s*\d+\s*\/\s*\d+\s*$/.test(l.parcela||'')).forEach(l=>{const [a,b]=l.parcela.split('/').map(n=>parseInt(n,10));if(!(a<b))return;
      const k=[l.loja_id,l.categoria_id,normDesc(l.descricao).replace(/\b\d+ \d+\b/g,'').trim(),Math.round(-l.valor*100),b].join('|');
      const s=series[k]||(series[k]={a:0,m:null,valor:-Number(l.valor),cat:l.categoria_id,b});if(a>s.a){s.a=a;s.m=vencDe(l);}
      if(vencDe(l)===M){const x=pega(l.categoria_id);x.parcM=(x.parcM||0)+(-Number(l.valor));x.temParcela=true;}});
    Object.values(series).forEach(s=>{for(let k=s.a+1;k<=s.b;k++){const fm=_mesAdd(s.m,k-s.a);if(fm<M)continue;const x=pega(s.cat);x.temParcela=true;if(fm===M){x.parcM=(x.parcM||0)+s.valor;continue;}x.fut[fm]=(x.fut[fm]||0)+s.valor;}});
    // fixos = Recorrentes
    dados.recs.forEach(r=>{if(r.contato_id)return;const x=pega(r.categoria_id);x.fixo+=Math.abs(Number(r.valor)||0);if(r.dia_vencimento)x.dia=x.dia?Math.min(x.dia,r.dia_vencimento):r.dia_vencimento;x.recDesc=(x.recDesc?x.recDesc+', ':'')+(r.descricao||'');});
    const pctMes=M<mesHoje?1:(M>mesHoje?0:Number(hoje.slice(8,10))/Number(_fimMes(M).slice(8,10)));
    const passado=M<mesHoje;
    const linhas=Object.values(C).map(x=>{const prev=Math.max(x.fixo>0?x.fixo:x.media,x.parcM||0);const deve=passado?x.pago:Math.max(prev,x.pago+x.aberto); // mês que já acabou: não sobra "deve sair" (nunca acumula)
      let sit,cls;const diaHoje=Number(hoje.slice(8,10));
      if(x.fixo>0&&x.dia&&M===mesHoje&&diaHoje>x.dia&&x.pago<prev*0.5){sit=`venceu dia ${x.dia} e não apareceu no extrato`;cls='wa';}
      else if(prev>0&&x.pago>prev*1.1&&x.pago-prev>100){sit=`▲ ${Math.round((x.pago/prev-1)*100)}% acima do normal`;cls='wa';}
      else if(prev<=0&&x.pago>0){sit='não costuma ter';cls='bl';}
      else if(prev>0&&x.pago>=prev*0.95){sit=x.fixo>0?'✓ pago':'✓ já saiu o normal';cls='ok';}
      else if(M<mesHoje&&prev>0&&x.pago<prev*0.9){sit=`▼ ${Math.round((1-x.pago/prev)*100)}% abaixo do normal`;cls='bl';}
      else{sit='normal';cls='mu';}
      return Object.assign(x,{prev,deve,falta:passado?0:Math.max(deve-x.pago,0),sit,cls});}).filter(x=>x.prev>0.5||x.pago>0.5||x.aberto>0.5||Object.keys(x.fut).length).sort((a,b)=>b.deve-a.deve);
    const futuros=[1,2,3].map(n=>{const fm=_mesAdd(M,n);let tot=0,sab=0;linhas.forEach(x=>{const k=x.fut[fm]||0;sab+=k;tot+=Math.max(x.prev,k);});return {M:fm,tot,sab};});
    return {linhas,recMedia,recMes,nM,mesesComDado,pctMes,futuros,passado,saidasPrev:linhas.reduce((t,x)=>t+x.deve,0),jaSaiu:linhas.reduce((t,x)=>t+x.pago,0)};
  }
  // cartões: antecipação que o Cartões Rocha diz que cai no mês × média do que caiu nos 3 meses anteriores
  async function radarCartoes(M,soLoja){
    try{const r=await cartoesLinhas(M,soLoja);if(r.erroSb||r.erroCt)return null;
      const known=r.linhas.reduce((t,l)=>t+l.prevA+l.fut.filter(e=>e.t==='a').reduce((a,e)=>a+e.valor,0),0);
      let soma=0,n=0;for(const pm of [_mesAdd(M,-1),_mesAdd(M,-2),_mesAdd(M,-3)]){const p=await cartoesLinhas(pm,soLoja);if(p.erroSb||p.erroCt)continue;const c=p.linhas.filter(l=>l.temExtrato);if(!c.length)continue;soma+=c.reduce((t,l)=>t+l.caiuA,0);n++;}
      return {known,antMedia:n?soma/n:0,nAnt:n};}catch(e){return null;}
  }
  async function viewRadar(){
    const box=document.getElementById('content');const seq=++_radarSeq;const mi=mesSel;
    const M=`${ANO_FIXO}-${_mm(mi)}`,mesNome=MESES_NOME[mi],grupo=RADAR_ESCOPO==='grupo';
    const lojaIds=grupo?idsDoModulo():[lojaAtual];const nomeEscopo=grupo?nomeTodas()+' ('+(MODULOS.find(m=>m[0]===MODULO_ATUAL)||['',''])[1]+')':lojaNomeCurto(lojaAtual);
    box.innerHTML=`<div class="loading"><span class="spin"></span> Montando o radar de ${mesNome}…</div>`;
    let dados,ct;try{await agBaixaAutomatica(lojaIds);}catch(e){}
    try{[dados,ct]=await Promise.all([radarCarregar(M,lojaIds),radarCartoes(M,grupo?null:lojaAtual)]);}catch(e){box.innerHTML=`<div class="note" style="border-color:rgba(255,92,92,.4)">Não consegui montar o radar: ${e.message||e}</div>`;return;}
    if(seq!==_radarSeq||mi!==mesSel||page!=='radar')return;
    const R=radarCalcular(M,dados);
    const usaCartao=ct&&ct.known>0&&ct.antMedia>0;
    const entradasPrev=Math.max(R.recMes,usaCartao?(R.recMedia-ct.antMedia+ct.known):R.recMedia);
    const sobra=entradasPrev-R.saidasPrev;
    const pctE=entradasPrev>0?R.recMes/entradasPrev:0,pctS=R.saidasPrev>0?R.jaSaiu/R.saidasPrev:0;
    let ritmo,ritmoCor;
    if(R.pctMes>=1){ritmo=R.recMes-R.jaSaiu>=0?'mês fechado com sobra':'mês fechado no vermelho';ritmoCor=R.recMes-R.jaSaiu>=0?'var(--green)':'var(--red)';}
    else if(R.pctMes<=0){ritmo='mês ainda não começou';ritmoCor='var(--muted)';}
    else if(pctE<R.pctMes-0.15){ritmo='entradas abaixo do ritmo do mês — atenção';ritmoCor='var(--amber)';}
    else if(pctS>R.pctMes+0.15){ritmo='saídas acima do ritmo do mês — atenção';ritmoCor='var(--amber)';}
    else{ritmo='ritmo normal';ritmoCor='var(--green)';}
    const pct=v=>Math.round(v*100)+'%';const n0=v=>BRL(v).replace('R$ ','').replace(/,\d\d$/,'');const n2=v=>BRL(v).replace('R$ ','');
    const mesesTxt=R.mesesComDado.length?R.mesesComDado.slice().reverse().map(m=>_mesNomeM(m).slice(0,3).toLowerCase()).join(', '):'sem histórico ainda';
    const pill=(t,c)=>`<span style="display:inline-block;padding:2px 9px;border-radius:20px;font-weight:700;font-size:11.5px;white-space:nowrap;${({ok:'background:rgba(31,157,107,.13);color:var(--green)',wa:'background:rgba(199,134,26,.15);color:var(--amber)',bl:'background:rgba(59,99,217,.13);color:var(--blue)',mu:'background:var(--panel-2);color:var(--muted)'})[c]}">${t}</span>`;
    const barra=(p,cor)=>`<span style="display:inline-block;height:7px;width:110px;background:var(--panel-2);border-radius:6px;position:relative;overflow:hidden;vertical-align:middle"><i style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(100,Math.round(p*100))}%;background:${cor}"></i></span>`;
    const tdN='style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap"';
    const linhasHTML=R.linhas.map(x=>{const nome=x.cat?x.cat.nome:'Sem categoria';const det=x.fixo>0?`fixo${x.dia?' · vence dia '+x.dia:''}${Math.abs(x.media-x.fixo)>1&&x.media>0?' · média '+n0(x.media):''}`:(x.temParcela?'média · tem parcela':'média');
      const fixar=!grupo&&ehDono()&&x.cat&&!(x.fixo>0)?` <span class="arqbtn rfixar" style="margin-left:6px;font-size:10.5px;padding:1px 7px" onclick="radarFixar(${x.cat.id})" title="Valor que não varia (ex.: aluguel): vale este valor em vez da média">📌 fixar</span>`:'';
      const cts=Object.values(x.ct).filter(c=>c.media>0.5||c.pago>0.5).sort((a,b)=>Math.max(b.media,b.pago)-Math.max(a.media,a.pago));
      const temCt=cts.some(c=>c.id);const rid='rc'+String(x.id).replace(/\W/g,'');
      const nomeCt=c=>{if(!c.id)return '<span class="mut">sem contato</span>';const k=CONTATOS.find(z=>z.id===c.id);return k?k.nome:'contato #'+c.id;};
      const subs=temCt?cts.slice(0,10).map(c=>{let sc='';if(c.media>0&&c.pago>c.media*1.1&&c.pago-c.media>100)sc=pill(`▲ ${Math.round((c.pago/c.media-1)*100)}% acima`,'wa');else if(c.media<=0&&c.pago>0)sc=pill('novo','bl');
          return `<tr class="${rid}" style="display:none;background:var(--panel-2)"><td style="padding-left:34px;font-size:12.5px">↳ ${nomeCt(c)}</td><td ${tdN} class="mut">${n2(c.media)} <span style="font-size:10.5px">média</span></td><td ${tdN}>${n2(c.pago)}</td><td></td><td></td><td>${sc}</td></tr>`;}).join('')
        +(cts.length>10?`<tr class="${rid}" style="display:none;background:var(--panel-2)"><td colspan="6" class="mut" style="padding-left:34px;font-size:12px">… e mais ${cts.length-10} contato(s)</td></tr>`:''):'';
      const abre=temCt?` onclick="if(event.target.closest('.arqbtn'))return;document.querySelectorAll('.${rid}').forEach(t=>t.style.display=t.style.display==='none'?'':'none');this.querySelector('.seta').textContent=this.querySelector('.seta').textContent==='▸'?'▾':'▸'" style="cursor:pointer" title="Clique para ver por contato"`:'';
      return `<tr class="rlinha"${abre}><td title="${det}">${temCt?'<span class="seta mut" style="display:inline-block;width:12px">▸</span>':'<span style="display:inline-block;width:12px"></span>'}<b>${nome}</b>${fixar}</td><td ${tdN}>${n2(x.prev)}</td><td ${tdN}>${n2(x.pago)}</td><td>${barra(x.prev>0?x.pago/x.prev:(x.pago>0?1:0),x.cls==='wa'&&x.pago>x.prev?'var(--amber)':'var(--green)')}</td><td ${tdN}>${x.falta>0.5?n2(x.falta):'—'}${x.aberto>0.5?`<div class="mut" style="font-size:10.5px">${n2(x.aberto)} na Agenda</div>`:''}</td><td>${pill(x.sit,x.cls)}</td></tr>${subs}`;}).join('');

  async function radarComparar(){

    if(alvo!==RADAR_CMP||!document.getElementById('radarCmp'))return;
    const porLoja={},mesesLoja={};rows.filter(r=>r.pago!==false).forEach(r=>{porLoja[r.loja_id]=(porLoja[r.loja_id]||0)-Number(r.valor);(mesesLoja[r.loja_id]=mesesLoja[r.loja_id]||new Set()).add(String(r.data).slice(0,7));});
    const lista=lojasDoModulo().map(l=>({nome:lojaNomeCurto(l.id),id:l.id,v:porLoja[l.id]?porLoja[l.id]/3:0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    if(!lista.length){box.textContent='Nenhuma loja teve essa despesa nos últimos 3 meses.';return;}
    const max=lista[0].v;
    box.innerHTML=lista.map(x=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--txt)"><span style="width:72px;${x.id===lojaAtual?'font-weight:800':''}">${x.nome}</span><span style="flex:1;height:12px;background:var(--panel-2);border-radius:4px;position:relative;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;width:${Math.round(x.v/max*100)}%;background:${x.id===lojaAtual?'var(--blue)':'rgba(31,157,107,.55)'}"></i></span><span style="width:86px;text-align:right;font-variant-numeric:tabular-nums">${BRL(x.v).replace(/,\d\d$/,'')}</span></div>`).join('')
      +`<div class="mut" style="font-size:11px;margin-top:6px">média dos 3 meses anteriores (soma ÷ 3) · a loja escolhida aparece em azul</div>`;
  }

  // =================== v2.9.82: PREVISÃO DO DIA 1º (a "foto" do Radar) ===================
  // Todo dia 1º a Íris guarda a previsão de cada conta (entradas, saídas e por categoria). No fim do mês compara com o que aconteceu:
  // mostra quanto errou, para cima ou para baixo, e o erro tem que ir diminuindo. Se uma categoria erra sempre para o mesmo lado, ela corrige.
  const _prevNeutra=id=>{const c=CATS.find(x=>Number(x.id)===Number(id));return !!(c&&c.grupo==='neutra');};
  function prevReal(lancs){let e=0,s=0;const cat={};
    (lancs||[]).forEach(l=>{if(l.pago===false||_prevNeutra(l.categoria_id))return;const v=Number(l.valor)||0;
      if(v>0)e+=v;else if(v<0){s-=v;const k=l.categoria_id==null?'sem':String(l.categoria_id);cat[k]=(cat[k]||0)-v;}});
    return {entradas:e,saidas:s,cat};}
  async function prevCalcular(M,lojaId){
    const [dados,ct]=await Promise.all([radarCarregar(M,[lojaId]),radarCartoes(M,lojaId)]);
    const R=radarCalcular(M,dados);const usa=ct&&ct.known>0&&ct.antMedia>0;
    const cat={};R.linhas.forEach(x=>{if(x.prev>0.5)cat[String(x.id)]=Math.round(x.prev*100)/100;});
    return {entradas:Math.max(0,usa?(R.recMedia-ct.antMedia+ct.known):R.recMedia),cat,nMeses:R.mesesComDado.length};}
  // a Íris aprende: categoria que errou para o mesmo lado nos 3 últimos meses fechados → corrige pela média do erro (no máximo 30%)
  async function prevAjustar(lojaId,M,cat){const aj={};
    try{const {data}=await sb.from('radar_previsoes').select('mes,por_cat,real_cat').eq('loja_id',lojaId).lt('mes',M).not('fechado_em','is',null).order('mes',{ascending:false}).limit(3);
      if(!data||data.length<3)return aj;
      Object.keys(cat).forEach(k=>{const rs=data.map(p=>{const pv=Number((p.por_cat||{})[k])||0,rv=Number((p.real_cat||{})[k])||0;return pv>200?rv/pv:null;});
        if(rs.some(r=>r==null))return;if(!(rs.every(r=>r>1.05)||rs.every(r=>r<0.95)))return;
        const f=Math.min(1.3,Math.max(0.7,rs.reduce((a,b)=>a+b,0)/rs.length));cat[k]=Math.round(cat[k]*f*100)/100;aj[k]=Math.round((f-1)*100);});}catch(e){}
    return aj;}
  async function prevFotografar(M,lojaId,origem){
    const {data:ja}=await sb.from('radar_previsoes').select('id').eq('loja_id',lojaId).eq('mes',M).limit(1);if(ja&&ja.length)return false;
    const p=await prevCalcular(M,lojaId);const ajustes=await prevAjustar(lojaId,M,p.cat);
    const saidas=Object.values(p.cat).reduce((t,v)=>t+Number(v),0);
    const {error}=await sb.from('radar_previsoes').insert({loja_id:lojaId,mes:M,entradas:Math.round(p.entradas*100)/100,saidas:Math.round(saidas*100)/100,por_cat:p.cat,ajustes,origem,meses_base:p.nMeses,criado_por:USER?USER.id:null});
    return !error;}
  async function prevFechar(M,lojaId){
    const {data:pv}=await sb.from('radar_previsoes').select('id,fechado_em').eq('loja_id',lojaId).eq('mes',M).limit(1);if(!pv||!pv.length||pv[0].fechado_em)return false;
    const {data:ls}=await sbTudo(()=>sb.from('lancamentos').select('valor,categoria_id,pago').eq('loja_id',lojaId).gte('data',M+'-01').lte('data',_fimMes(M)).order('id'));
    const r=prevReal(ls);const rc={};Object.entries(r.cat).forEach(([k,v])=>rc[k]=Math.round(v*100)/100);
    const {error}=await sb.from('radar_previsoes').update({entradas_real:Math.round(r.entradas*100)/100,saidas_real:Math.round(r.saidas*100)/100,real_cat:rc,fechado_em:new Date().toISOString()}).eq('id',pv[0].id);
    return !error;}
  function _prevLojas(){const ordemMod={oticas:0,laboratorio:1,compras:2,diversas:3};
    return LOJAS.filter(l=>!l.arquivada&&_modDe(l)!=='casa').sort((a,b)=>(ordemMod[_modDe(a)]??9)-(ordemMod[_modDe(b)]??9)||(a.ordem||0)-(b.ordem||0)||a.id-b.id);}
  // robô das 6h (e botão do gestor): garante a foto do mês atual e dos 3 anteriores, e fecha os meses que já acabaram
  async function prevRotina(log){const hoje=_hojeLocal(),MA=hoje.slice(0,7);let nf=0,nc=0;
    for(const L of _prevLojas()){for(const k of [3,2,1,0]){const M=_mesAdd(MA,-k);
      try{if(await prevFotografar(M,L.id,k===0&&hoje.slice(8,10)==='01'?'robo':'retro'))nf++;if(k>0&&await prevFechar(M,L.id))nc++;}catch(e){if(log)log.push('previsão '+lojaNomeCurto(L.id)+' '+M+': '+(e.message||e));}}}
    if(log)log.push(`previsão do mês: ${nf} foto(s) nova(s), ${nc} mês(es) fechado(s)`);return {nf,nc};}
  // erro com direção: + = aconteceu mais que o previsto
  const _prevErro=(real,prev)=>prev>0.5?(real-prev)/prev:null;
  function _prevErroTxt(e,tipo){if(e==null)return '—';const p=Math.round(Math.abs(e)*100);if(p===0)return '<b style="color:var(--green)">acertou</b>';
    const ruim=tipo==='s'?e>0:e<0;const cor=p<=3?'var(--green)':(ruim?'var(--red)':'var(--amber)');
    const txt=tipo==='s'?(e>0?'saiu mais':'saiu menos'):(e>0?'entrou mais':'entrou menos');
    return `<b style="color:${cor}">${e>0?'+':'−'}${p}%</b> <span class="mut">${txt}</span>`;}
  const _n0=v=>BRL(v).replace('R$ ','').replace(/,\d\d$/,'');
  // linha pequena (Lançamentos e Dashboard)
  async function prevPreencherLinha(alvoId){const box=document.getElementById(alvoId);if(!box)return;const loja=lojaAtual,M=`${ANO_FIXO}-${_mm(mesSel)}`;
    if(_modDe(LOJAS.find(l=>l.id===loja))==='casa'){box.innerHTML='';return;}
    let pv=null;try{const {data,error}=await sb.from('radar_previsoes').select('*').eq('loja_id',loja).eq('mes',M).limit(1);if(error){box.innerHTML='';return;}pv=data&&data[0];}catch(e){box.innerHTML='';return;}

    const quando=pv.origem==='robo'?`de 01/${M.slice(5,7)}`:`de ${MESES_NOME[mesSel].slice(0,3).toLowerCase()}`;const fechado=!!pv.fechado_em;
    let ent,sai;if(fechado){ent=Number(pv.entradas_real);sai=Number(pv.saidas_real);}else{const lista=alvoId==='prevDash'?_lancMesDash:LANC;const r=prevReal(lista||[]);ent=r.entradas;sai=r.saidas;}
    const pe=Number(pv.entradas),ps=Number(pv.saidas),pct=(a,b)=>b>0?Math.round(a/b*100)+'%':'—';
    const estilo='display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px';
    if(fechado){box.innerHTML=`<div style="${estilo}"><b>Previsão ${quando} · mês fechado</b><span>Entradas: previu ${_n0(pe)}, entrou ${_n0(ent)} · ${_prevErroTxt(_prevErro(ent,pe),'e')}</span><span>Saídas: previu ${_n0(ps)}, saiu ${_n0(sai)} · ${_prevErroTxt(_prevErro(sai,ps),'s')}</span></div>`;return;}
    box.innerHTML=`<div style="${estilo}"><b>Previsão ${quando}</b><span>entrar <b>${_n0(pe)}</b> <span class="mut">(já ${pct(ent,pe)})</span></span><span>sair <b>${_n0(ps)}</b> <span class="mut">(já ${pct(sai,ps)})</span></span><span>sobra prevista <b style="color:${pe-ps>=0?'var(--green)':'var(--red)'}">${pe-ps>=0?'+':'−'}${_n0(Math.abs(pe-ps))}</b></span><a href="#" style="margin-left:auto" onclick="go('radar');return false">ver no Radar</a></div>`;}
  async function prevAgora(){if(!ehDono())return;toast('A Íris está montando a previsão de todas as contas…','ok');const r=await prevRotina([]);toast(`Previsão pronta: ${r.nf} foto(s), ${r.nc} mês(es) fechado(s).`,'ok');render();}
  // gestor: todas as contas, Rocha 1 a 11, GV Lentes, Grupo de compras, Diversas
  async function prevPreencherGrupo(){const box=document.getElementById('prevGrupo');if(!box||!ehDono())return;const M=`${ANO_FIXO}-${_mm(mesSel)}`;

  // lê a aba Lentes do Caixinha (precisa estar logado no Caixinha neste computador)
  async function lentesLerCaixinha(){

    if(error)return {erro:error.message||String(error)};
    const itens=[];const diag={fechamentos:(data||[]).length,boletos:0,semId:0,antes:0,semValor:0,semLoja:0,previstos:0,lojasDesconhecidas:{}};const hojeISO=new Date().toISOString().slice(0,10);
    // só boleto PAGO entra: previsto (status/pago/previsto no JSON) ou data futura fica de fora
    const boletoPago=(b,data)=>{if(typeof b.status==='string'&&b.status.toLowerCase()!=='pago')return false;if(b.pago===false)return false;if(b.previsto===true)return false;if(typeof b.situacao==='string'&&b.situacao.toLowerCase()!=='pago')return false;if(data>hojeISO)return false;return true;};
    (data||[]).forEach(f=>{(Array.isArray(f.boletos)?f.boletos:[]).forEach((b,ix)=>{if(!b)return;diag.boletos++;const bid=b.id||('i'+ix+'-'+String(b.data||'')+'-'+String(b.valor||''));if(!b.id)diag.semId++;const data=String(b.data||'').slice(0,10);if(!data||data<LENTES_DESDE){diag.antes++;return;}if(!boletoPago(b,data)){diag.previstos++;(diag.listaPrevistos=diag.listaPrevistos||[]).push({lojaId:lentesLojaId(f.loja_nome),data,valor:Math.abs(Number(b.valor)||0),nome:String(b.nome||'').toUpperCase()});return;}const valor=Math.abs(Number(b.valor)||0);if(!valor){diag.semValor++;return;}
      const lojaId=lentesLojaId(f.loja_nome);if(!lojaId){diag.semLoja++;diag.lojasDesconhecidas[f.loja_nome]=1;}

  // muda a descrição direto na linha
  async function mudarDescLanc(id,valor){
    const l=LANC.find(x=>x.id===id);if(!l)return;
    if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    const desc=(valor||'').toUpperCase();

    if(error){toast('Erro ao salvar: '+error.message,'erro');return;}
    if(!data||data.length===0){toast('⚠️ NÃO salvou! Sem permissão para editar este lançamento.','erro');return;}
    l.descricao=desc;toast('Descrição salva!','ok');
  }
  // muda um campo direto na linha e salva no banco

  async function editarObsLanc(id){const l=LANC.find(x=>x.id===id);if(!l)return;if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    const v=prompt(Number(l.valor)<0?'Contato sem cadastro: nome de quem recebeu (ex.: GABRIEL, MARIA — PANFLETAGEM). Não precisa cadastrar o contato. Deixe vazio para apagar.':'Observação deste lançamento. Deixe vazio para apagar.',l.documento||'');if(v==null)return;
    await mudarCampoLanc(id,'documento',v.trim()?v.trim().toUpperCase():null);lancSoAtualizar();}
  async function mudarCampoLanc(id,campo,valor){
    const l=LANC.find(x=>x.id===id);if(!l)return;
    if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    const val=valor||null;
    const {data,error}=await sb.from('lancamentos').update({[campo]:val}).eq('id',id).select();
    if(error){toast('Erro ao salvar: '+error.message,'erro');return;}
    if(!data||data.length===0){toast('⚠️ NÃO salvou! Sem permissão para editar este lançamento.','erro');return;}
    l[campo]=val;
    // atualiza os dados aninhados pra refletir

  async function salvarEditarLanc(id,proximo,anterior){
    const l=LANC.find(x=>x.id===id);
    const cat=document.getElementById('edCat').value;const contato=document.getElementById('edContato').value;
    if(!cat){document.getElementById('edErr').innerHTML='<div class="err">Escolha a categoria.</div>';return;}
    if(!contato && categoriaExigeContato(cat)){document.getElementById('edErr').innerHTML='<div class="err">Para Funcionários, escolha qual funcionário.</div>';return;}
    const cents=parseInt(document.getElementById('edVal').dataset.cents||'0',10);
    const pa=document.getElementById('edParcA').value,pb=document.getElementById('edParcB').value;
    const iso=dataParaISO(document.getElementById('edData').value)||l.data;
    const contaNova=document.getElementById('edConta').value||null;
    if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    if(bloqueadoPorFechamento(iso,contaNova))return;
    const {error}=await sb.from('lancamentos').update({
      data:iso,descricao:document.getElementById('edDesc').value.toUpperCase(),
      valor:(l.valor<0?-1:1)*(cents/100),categoria_id:cat,contato_id:contato,
      conta_id:document.getElementById('edConta').value||null,
      parcela:(pa&&pb)?`${pa}/${pb}`:null,documento:document.getElementById('edDoc').value||null
    }).eq('id',id);
    if(error){toast('Erro: '+error.message,'erro');return;}
    Object.assign(l,{data:iso,descricao:document.getElementById('edDesc').value.toUpperCase(),valor:(l.valor<0?-1:1)*(cents/100),categoria_id:cat,contato_id:contato});
    const catObj=CATS.find(c=>c.id==cat);if(catObj)l.categorias={nome:catObj.nome,grupo:catObj.grupo};
    const contObj=CONTATOS.find(c=>c.id==contato);if(contObj)l.contatos={nome:contObj.nome,tipo:contObj.tipo};
    const idx=LANC.findIndex(x=>x.id===id);
    if(anterior){
      const ant=LANC[idx-1];
      if(ant){toast('Salvo! ← Anterior','ok');filtrarLanc(q);abrirEditarLanc(ant.id);return;}
      else {toast('Salvo! Era o primeiro.','ok');fecharModal();filtrarLanc(q);return;}
    }
    if(proximo){
      const prox=LANC[idx+1];
      if(prox){toast('Salvo! Próximo →','ok');filtrarLanc(q);abrirEditarLanc(prox.id);return;}
      else {toast('Salvo! Era o último.','ok');fecharModal();await viewLanc();return;}
    }
    fecharModal();toast('Salvo!','ok');filtrarLanc(q);
  }

  // olha tudo que já foi classificado e propõe palavras (só quando a mesma descrição sempre caiu na mesma categoria)
  async function gerarRegrasHistorico(){
    document.getElementById('modalRoot').innerHTML='<div class="modal-bg"><div class="modal"><h3>✨ Lendo o histórico...</h3><p>Olhando todos os lançamentos já classificados.</p></div></div>';
    let rows=[];for(let de=0;;de+=1000){const {data,error}=await sb.from('lancamentos').select('descricao,categoria_id,contato_id,valor').not('categoria_id','is',null).order('id').range(de,de+999);if(error){toast('Erro: '+error.message,'erro');fecharModal();return;}rows=rows.concat(data||[]);if(!data||data.length<1000)break;}
    const STOP=new Set(['PGTO','PAGTO','PAGAMENTO','PIX','TED','DOC','DEB','DEBITO','CRED','CREDITO','TRANSF','TRANSFERENCIA','COMPRA','CARTAO','BOLETO','TITULO','TIT','COBRANCA','REF','DE','DA','DO','PARA','LTDA','ME','EIRELI','SA','EPP','E','A','O']);
    const g={};
    rows.forEach(l=>{const toks=normDesc(l.descricao).split(' ').filter(t=>t.length>=3&&!STOP.has(t)&&!/^\d+$/.test(t));if(!toks.length)return;const key=toks.slice(0,2).join(' ');
      const o=g[key]=g[key]||{n:0,cats:{},conts:{}};o.n++;o.cats[l.categoria_id]=(o.cats[l.categoria_id]||0)+1;if(l.contato_id)o.conts[l.contato_id]=(o.conts[l.contato_id]||0)+1;});
    const jaTem=new Set(REGRAS_P.map(r=>normDesc(r.palavra)));
    const props=[];
    Object.entries(g).forEach(([key,o])=>{if(o.n<2||jaTem.has(key))return;const [cat,nc]=Object.entries(o.cats).sort((a,b)=>b[1]-a[1])[0];if(nc/o.n<0.9)return;
      const ce=Object.entries(o.conts).sort((a,b)=>b[1]-a[1])[0];const cont=(ce&&ce[1]/o.n>=0.9)?Number(ce[0]):null;
      // não propor palavra que já casa com outra regra existente
      if(aplicarRegrasP(key,null))return;

  // v2.9.70: Íris acha nomes repetidos (categoria ou contato) e junta num só — o que fica é o escolhido; os outros vão para arquivados
  const _dupKey=n=>String(n||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]/g,'');
  let _dupUsos={};
  async function irisDuplicados(tipo){const box=document.getElementById('irisDup');if(!box||!ehDono())return;

    box.innerHTML=`<div class="card" style="margin-bottom:14px;border-color:rgba(59,99,217,.5)"><div style="display:flex;align-items:center;gap:10px">${irisAvatar(34)}<div><b>Íris achou ${grupos.length} nome(s) repetido(s) em ${tipo==='cat'?'categorias':'contatos'}</b><div class="mut" style="font-size:12px">escolha qual fica: os lançamentos, regras e Agenda dos outros passam para ele, e os outros vão para os arquivados (nada é apagado)</div></div></div>
      ${grupos.map((a,gi)=>{const f=fica(a);return `<div style="border-top:1px solid var(--line);padding:10px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap">${a.map(x=>`<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="radio" name="dup${tipo}${gi}" value="${x.id}" ${x.id===f.id?'checked':''}> <b>${_remEsc(x.nome)}</b> <span class="mut" style="font-size:11.5px">${_dupUsos[tipo+x.id]||0} lanç.</span></label>`).join('')}
        ${tipo==='cont'&&a[0].tipo==='funcionario'?'<span style="color:var(--amber);font-size:11.5px">funcionário: confira se não são duas pessoas com o mesmo nome</span>':''}
        <button class="btn" style="margin-left:auto;padding:5px 14px;font-size:12.5px;font-weight:800" onclick="irisJuntar('${tipo}',${gi},[${a.map(x=>x.id).join(',')}])">Juntar</button></div>`;}).join('')}</div>`;}
  async function irisJuntar(tipo,gi,ids){if(!ehDono())return;const sel=document.querySelector(`input[name="dup${tipo}${gi}"]:checked`);if(!sel)return;const fica=Number(sel.value),sai=ids.filter(i=>i!==fica);
    const L=(tipo==='cat'?CATS:CONTATOS),nf=(L.find(x=>x.id===fica)||{}).nome,col=tipo==='cat'?'categoria_id':'contato_id';
    if(!confirm(`Juntar em "${nf}"?\n\nOs lançamentos, regras, recorrentes e Agenda dos outros ${sai.length} passam para "${nf}" e eles vão para os arquivados.`))return;
    let erro='';_salvandoN++;
    try{for(const t of ['lancamentos','contas_pagar','regras_palavras','regras','recorrentes','remanejos','iris_sugestoes']){const {error}=await sb.from(t).update({[col]:fica}).in(col,sai);if(error&&!/relation|exist|permission|policy/i.test(error.message||''))erro=erro||(t+': '+error.message);}

  function _saldosDe(row,contaId){const s=(row&&row.saldos)||{};return s[String(contaId)]||{};}
  // movimento (sem neutras) de uma conta num mês, a partir de LANC_ANO
  function _movMes(contaId,mi){
    let e=0,s=0,en=0,sn=0;
    LANC_ANO.forEach(l=>{if(l.conta_id!==contaId)return;const m=parseInt(l.data.split('-')[1],10)-1;if(m!==mi)return;const v=Number(l.valor);const n=ehNeutra(l);if(v>0){e+=v;if(n)en+=v;}else{s+=Math.abs(v);if(n)sn+=Math.abs(v);}});

  // Saldo inicial da conta no mês: (1) copiado do último mês anterior fechado, (2) digitado neste mês, (3) calculado
  function _saldoInicialMes(conta,mi,antesDoAno){
    for(let k=mi-1;k>=0;k--){
      const r=FECH_ANO[k+1];if(!(r&&r.fechado))continue;
      const s=_saldosDe(r,conta.id);if(s.real==null)continue;
      let v=Number(s.real);for(let j=k+1;j<mi;j++){const mv=_movMes(conta.id,j);v+=mv.ent-mv.sai;}
      return {valor:v,origem:'anterior',mesBase:k};
    }
    const s=_saldosDe(FECH_ANO[mi+1],conta.id);
    if(s.inicial_manual!=null)return {valor:Number(s.inicial_manual),origem:'manual',por:s.inicial_por||'',motivo:s.inicial_motivo||''};
    let v=Number(conta.saldo_inicial_banco||0)+(antesDoAno[conta.id]||0);
    for(let j=0;j<mi;j++){const mv=_movMes(conta.id,j);v+=mv.ent-mv.sai;}
    return {valor:v,origem:'calculado'};
  }

  // v2.9.65: dia a dia do mês, banco × Fluxo: o que tem no banco e falta no Fluxo, e o que sobra no Fluxo (possível repetido)
  async function irisDiasDiferentes(lojaId,sicId,contaId){const ym=`${ANO_FIXO}-${_mm(mesSel)}`,fim=_fimMes(ym);
    document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><span class="spin"></span> Íris comparando dia a dia…</div></div>`;

    const cent=v=>Math.round(Number(v)*100);const dias={};
    B.forEach(x=>{(dias[x.data]=dias[x.data]||{b:[],f:[]}).b.push(x);});F.forEach(x=>{(dias[x.data]=dias[x.data]||{b:[],f:[]}).f.push(x);});
    // casa por valor dentro do dia; o que sobra no dia tenta casar com ±3 dias (data diferente)
    const sobraB=[],sobraF=[];Object.keys(dias).sort().forEach(d=>{const fl=dias[d].f.slice();dias[d].b.forEach(x=>{const i=fl.findIndex(y=>cent(y.valor)===cent(x.valor));if(i>=0)fl.splice(i,1);else sobraB.push(x);});sobraF.push(...fl);});

          <div style="margin-left:auto;display:flex;gap:6px;align-items:center">

            <input id="real${c.id}" class="qin calc" data-cents="${real==null?0:Math.round(Math.abs(real)*100)}" data-calc="${Math.round(calc*100)}" value="${real==null?'':Math.abs(real).toLocaleString('pt-BR',{minimumFractionDigits:2})}" placeholder="0,00" inputmode="numeric" style="max-width:150px" ${fechado?'disabled':''} onkeydown="calcInput(this,event);atualizaDifMes(${c.id});salvarSaldoRealMes(${c.id})">

  function _difHTML(contaId,calc,real){
    if(real==null)return `<span class="mut">digite o saldo do banco no dia ${_ultimoDiaBR(mesSel)}</span>`;
    const dif=real-calc;
    if(Math.abs(dif)<0.01)return '<span style="color:var(--green);font-weight:700">✅ Bateu certinho! O sistema está igual ao banco.</span>';
    if(dif>0)return `<span style="color:var(--amber);font-weight:700">⚠️ Sobrando ${BRL(dif)}</span> <span class="mut">— o banco tem mais que o sistema. Falta lançar alguma entrada, ou tem saída lançada a mais.</span>`;
    return `<span style="color:var(--red);font-weight:700">🚨 Faltando ${BRL(Math.abs(dif))}</span> <span class="mut">— o banco tem menos que o sistema. Falta lançar alguma saída.</span>`;
  }
  function _lerReal(contaId){
    const inp=document.getElementById('real'+contaId);if(!inp)return null;
    if(inp.value==='')return null;
    const neg=document.getElementById('sinalReal'+contaId).dataset.neg==='1';
    return (neg?-1:1)*parseInt(inp.dataset.cents||'0',10)/100;
  }
  function atualizaDifMes(contaId){
    const inp=document.getElementById('real'+contaId);const out=document.getElementById('dif'+contaId);if(!inp||!out)return;
    const calc=parseInt(inp.dataset.calc||'0',10)/100;const real=_lerReal(contaId);
    out.innerHTML=_difHTML(contaId,calc,real);
    const e=_escadas.find(x=>x.id===contaId);if(e)e.real=real;
  }
  function toggleSinalReal(contaId){
    const b=document.getElementById('sinalReal'+contaId);if(!b||b.disabled)return;
    const neg=b.dataset.neg==='1';b.dataset.neg=neg?'0':'1';b.textContent=neg?'+':'−';b.style.color=neg?'var(--green)':'var(--red)';
    atualizaDifMes(contaId);salvarSaldoRealMes(contaId);
  }
  // grava o saldo real digitado (salva sozinho, com atraso curto)
  let _realTimer={};
  function salvarSaldoRealMes(contaId){
    clearTimeout(_realTimer[contaId]);
    _realTimer[contaId]=setTimeout(async()=>{
      const real=_lerReal(contaId);
      await _gravarSaldos(mesSel+1,String(contaId),{real,real_por:PERFIL.nome||'',real_em:new Date().toISOString()});
    },600);
  }
  // mescla e grava o JSON de saldos do mês no banco
  async function _gravarSaldos(mes,contaKey,patch,extra){
    const atual=FECH_ANO[mes]||{};const saldos=Object.assign({},atual.saldos||{});
    if(contaKey)saldos[contaKey]=Object.assign({},saldos[contaKey]||{},patch||{});
    const payload=Object.assign({loja_id:lojaAtual,ano:ANO_FIXO,mes,saldos},extra||{});
    const {data,error}=await sb.from('fechamentos').upsert(payload,{onConflict:'loja_id,ano,mes'}).select().maybeSingle();
    if(error){toast('Erro ao salvar: '+error.message,'erro');return false;}
    FECH_ANO[mes]=data||Object.assign({},atual,payload);
    return true;
  }
  function abrirCorrigirSaldoInicialMes(contaId,centsAtual){
    const c=CONTAS.find(x=>x.id===contaId);if(!c)return;

      <h3>✎ Corrigir saldo inicial — ${c.nome} · 01/${_mm(mesSel)}</h3>
      <p>Use só se o valor calculado estiver errado (ex.: o mês anterior não foi fechado). Pode ser negativo (cheque especial). Fica registrado quem corrigiu e por quê.</p>
      <span class="qlabel">Saldo em 01/${_mm(mesSel)}/${ANO_FIXO}</span>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
        <button class="btn ghost" id="csSinal" data-neg="${neg?'1':'0'}" onclick="const b=this;const n=b.dataset.neg==='1';b.dataset.neg=n?'0':'1';b.textContent=n?'+':'−';b.style.color=n?'var(--green)':'var(--red)'" style="min-width:46px;font-size:18px;font-weight:800;color:${neg?'var(--red)':'var(--green)'}">${neg?'−':'+'}</button>
        <input id="csVal" class="calc" data-cents="${abs}" value="${(abs/100).toLocaleString('pt-BR',{minimumFractionDigits:2})}" inputmode="numeric" onkeydown="calcInput(this,event)" style="flex:1;margin-bottom:0">
      </div>
      <span class="qlabel">Motivo *</span><input id="csMotivo" class="maiusc" placeholder="Ex: SALDO DO EXTRATO DE 01/06">

      <div class="modal-btns" style="flex-wrap:wrap"><button class="btn ghost" onclick="fecharModal()">Cancelar</button><button class="btn ghost" onclick="limparCorrecaoSaldoInicial(${contaId})" title="Volta ao valor calculado pelo sistema">Voltar ao calculado</button><button class="btn" onclick="salvarCorrecaoSaldoInicial(${contaId})">Salvar</button></div></div></div>`;
  }
  async function salvarCorrecaoSaldoInicial(contaId){
    const cents=parseInt(document.getElementById('csVal').dataset.cents||'0',10);
    const neg=document.getElementById('csSinal').dataset.neg==='1';
    const motivo=(document.getElementById('csMotivo').value||'').trim().toUpperCase();
    if(!motivo){document.getElementById('csErr').innerHTML='<div class="err">Escreva o motivo.</div>';return;}
    const ok=await _gravarSaldos(mesSel+1,String(contaId),{inicial_manual:(neg?-1:1)*cents/100,inicial_motivo:motivo,inicial_por:PERFIL.nome||'',inicial_em:new Date().toISOString()});
    if(!ok)return;fecharModal();toast('Saldo inicial corrigido!','ok');viewFechamento();
  }

  const _NOME_STOP=new Set(['DE','DA','DO','DAS','DOS','E']);

  function funcionarioNoTexto(txt){
    const toks=normDesc(txt).split(' ').filter(t=>t.length>=2&&!/^\d+$/.test(t));if(!toks.length)return null;

  function descLimpaGrupo(nome){const m=String(nome||'').match(/^(FAV|REM)\.:\s?(.{34})\s+(\S.*)$/i);if(!m)return '';

  async function pdfExtratoParaOFX(file){const pags=await pdfExtratoLinhas(file);

    const conta=((tudo.match(/Conta:?\s*[\d.\-]+\s*\/\s*([^\n]+)/i)||[])[1]||'').trim(),contaNum=((tudo.match(/Conta:?\s*([\d.\-]+)\s*\//i)||[])[1]||'').trim();

          let docT='';if(histX!=null)docT=l.itens.filter(i=>i.x<histX-3&&!/^\d\d\/\d\d/.test(i.s)).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();

        if(!cur)continue;
        if(ehCabecalho(t)||/^\d\d\/\d\d\b/.test(t)){cur=null;continue;}
        const md=t.match(/^DOC\.?:\s*(.*)$/i);if(md){if(!cur.doc&&md[1]&&!/^pix$/i.test(md[1].trim())&&!/^\d+$/.test(md[1].trim()))cur.doc=md[1].trim();continue;} // "DOC.: Pix" / "DOC.: 17142454" (modelo do aplicativo)

    let ofx=`OFXHEADER:100\n<OFX><BANKMSGSRSV1><STMTTRNRS><STMTRS>${contaNum?`<BANKACCTFROM><ACCTID>${contaNum}</BANKACCTFROM>`:''}<BANKTRANLIST>\n<DTSTART>${de}\n<DTEND>${ate}\n`;

  function parseOFX(txt){
    // separa cada transação
    const trans=[];
    const blocos=txt.split('<STMTTRN>').slice(1);
    blocos.forEach(b=>{
      const corte=b.split('</STMTTRN>')[0];
      const get=(tag)=>{const m=corte.match(new RegExp('<'+tag+'>([^<\\n]*)'));return m?m[1].trim():'';};
      const tipo=get('TRNTYPE');
      const amt=parseFloat(get('TRNAMT'));
      const dt=get('DTPOSTED').slice(0,8); // AAAAMMDD
      const fitid=get('FITID');
      const memo=get('MEMO');
      const name=get('NAME');
      if(!dt||isNaN(amt))return;
      const iso=dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8);
      const desc=(name||memo||'').trim();
      trans.push({iso,amt,fitid,memo,name,desc});

  }

    const v=r.cxDepois?'__depois':(r.cxDevedor||'');const gs=cxDevedoresGrupos();if(v&&v!=='__depois'&&!gs.flatMap(x=>x.it).includes(v))gs.unshift({g:'Lido no texto',it:[v]});

  function impEstornoLoja(i,v){const r=IMPORT[i];if(!r)return;r.cxDepois=v==='__depois';r.cxDevedor=(v&&v!=='__depois')?v:'';if(!r.cxLoja){const k=cxCaixaDoExtrato();if(k)r.cxLoja=k.id;}r._mexido=true;_keepY=window.scrollY;render();}

  // cria (ou liga) o empréstimo a estornar no Banco Caixinha — mesma coisa do botão "Mandar pro Banco Caixinha"
  async function impMandarBanco(r,lancId){const c=cxClient();if(!c||!r.cxLoja||!lancId)return 'pulou';
    if(!cxPodeCriar()&&!r.cxMatch)return 'pulou'; // v2.9.49: equipe só liga ao que a Heloísa já lançou

  // lê linha digitável (47 boleto / 48 conta de consumo) ou código de barras (44): valor e vencimento
  function lerCodigoBoleto(txt){const d=String(txt||'').replace(/\D/g,'');if(d.length<44)return null;
    const fatorData=f=>{if(!f)return null;const hoje=new Date();const c1=new Date(1997,9,7);c1.setDate(c1.getDate()+f);const c2=new Date(2025,1,22);c2.setDate(c2.getDate()+(f-1000));
      return _isoLocal([c1,c2].sort((a,b)=>Math.abs(a-hoje)-Math.abs(b-hoje))[0]);};
    const consumo=bar=>({tipo:'conta',banco:'conta de consumo / tributo',valor:['6','8'].includes(bar[2])?parseInt(bar.slice(4,15),10)/100:null,venc:null});
    if(d.length===48&&d[0]==='8')return consumo(d.slice(0,11)+d.slice(12,23)+d.slice(24,35)+d.slice(36,47));
    if(d.length===44&&d[0]==='8')return consumo(d);
    if(d.length===47)return {tipo:'boleto',banco:AG_BANCOS[d.slice(0,3)]||('banco '+d.slice(0,3)),valor:parseInt(d.slice(37,47),10)/100||null,venc:fatorData(parseInt(d.slice(33,37),10))};
    if(d.length===44)return {tipo:'boleto',banco:AG_BANCOS[d.slice(0,3)]||('banco '+d.slice(0,3)),valor:parseInt(d.slice(9,19),10)/100||null,venc:fatorData(parseInt(d.slice(5,9),10))};
    return null;}

  async function boletoDoPDF(f){const pags=await pdfExtratoLinhas(f);const txt=pags.map(p=>p.map(l=>l.txt).join('\n')).join('\n');const r={};

    if(ld)r.linha_digitavel=ld[0].replace(/\D/g,'');

    const cnpjs=(txt.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/g)||[]).map(c=>c.replace(/\D/g,'')).filter(c=>!nossos.has(c));if(cnpjs.length)r.cnpj=cnpjs[0];
    const lb=pags.flat().findIndex(l=>/benefici[áa]rio|cedente/i.test(l.txt));if(lb>=0){const ls=pags.flat();let nome=ls[lb].txt.replace(/.*?(benefici[áa]rio|cedente)\s*:?/i,'').trim();if(!/[A-Z]{3}/i.test(nome)&&ls[lb+1])nome=ls[lb+1].txt;

  async function reduzirImagem(f){try{const img=await createImageBitmap(f);const k=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);

  // baixa automática: conta aberta + lançamento do extrato com o mesmo valor, de 7 dias antes a 10 dias depois do vencimento

    if(!podeEditar())return 0;const hoje=_hojeLocal();
    let q=sb.from('contas_pagar').select('id,loja_id,valor,vencimento,categoria_id,contato_id').eq('status','aberto').lte('vencimento',addDias(hoje,10)).gte('vencimento',addDias(hoje,-120));

        .sort((a,b)=>_dias(a.data,c.vencimento)-_dias(b.data,c.vencimento));

  async function agCarregar(lojaIds,de,ate){

      recs.forEach(r=>{if(!r.dia_vencimento||(r.rateio&&r.rateio.metodo))return;meses.forEach(m=>{const ult=Number(_fimMes(m).slice(8,10));const v=`${m}-${String(Math.min(r.dia_vencimento,ult)).padStart(2,'0')}`;if(v<de||v>ate)return;

  }

  function agLerCodigo(){const el=document.getElementById('agCod'),info=document.getElementById('agCodInfo');if(!el||!info)return;const r=lerCodigoBoleto(el.value);

  async function agSalvar(){
    const desc=(document.getElementById('agDesc').value||'').trim().toUpperCase();const valor=Number(String(document.getElementById('agValor').value||'').replace(/\./g,'').replace(',','.'));
    const venc=document.getElementById('agVenc').value;const cat=document.getElementById('agCat').value;const cont=document.getElementById('agCont').value;const n=parseInt(document.getElementById('agParc').value,10)||1;const ini=Math.min(parseInt((document.getElementById('agParcIni')||{}).value,10)||1,n);

    if(!desc){toast('Preencha a descrição.','erro');return;}if(!(valor>0)){toast('Preencha o valor.','erro');return;}if(!venc){toast('Preencha o vencimento.','erro');return;}

    const dividir=MODULO_ATUAL==='diversas'&&AG_DIV.on;let partes=null;
    if(dividir){partes=divPartes(valor);const sp=Object.values(partes).reduce((a,b)=>a+b,0);

    const {data:ins,error}=await sb.from('contas_pagar').insert(rows).select('id,vencimento,parcela');

    if(dividir&&ins&&ins.length){const pr=[];ins.forEach(bo=>Object.entries(partes).forEach(([lid,v])=>{if(!(v>0))return;
        pr.push(Object.assign({loja_id:Number(lid),descricao:'PARTE DIVERSAS · '+desc,valor:v,vencimento:bo.vencimento,categoria_id:cat?Number(cat):null,contato_id:cont?Number(cont):null,parcela:bo.parcela||null,status:'aberto',rateio_de:bo.id},crit?{critico:true}:{},docAg?{documento:docAg}:{}));}));
      const {error:e2}=await sb.from('contas_pagar').insert(pr);
      if(e2)toast('O boleto entrou, mas não consegui dividir: '+e2.message,'erro');else toast(`Dividido: ${Object.keys(partes).length} empresas receberam a parte na Agenda.`,'ok');
      AG_DIV.mao={};}
    await agAprenderBoleto(cat,cont);
    fecharModal();toast(rows.length>1?`${rows.length} parcelas lançadas na agenda.`:'Conta lançada na agenda.','ok');AG_SEMANA=agInicioSemana(agDiaUtil(venc)<=addDias(agInicioSemana(_hojeLocal()),6)?_hojeLocal():venc);render();
  }

  // ===================== DIVERSAS (v2.9): dividir boleto entre as empresas, como no FaturaFácil =====================
  // por % (porcentagem fixa de cada loja), por lente (lentes do mês = surfaçagem), por igual (entre as escolhidas) ou à mão.
  let AG_DIV={on:false,metodo:'pct',sel:null,mao:{},regra:'',lentes:{},lentesMes:''},RATEIO_REGRAS=[],LENTES_MES={};
  const _numBR=t=>{t=String(t==null?'':t).trim();if(!t)return 0;const n=Number(t.replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n;};
  function divEmpresas(){return LOJAS.filter(l=>['oticas','laboratorio'].includes(_modDe(l))&&!l.arquivada);}
  // divide em centavos e a soma bate exato (os centavos que sobram vão para os maiores restos)
  function divDistribuir(total,pesos){const ids=Object.keys(pesos).filter(k=>pesos[k]>0),soma=ids.reduce((t,k)=>t+pesos[k],0),cents=Math.round(total*100),out={};if(!soma||!cents)return out;
    let usado=0;const rest=[];ids.forEach(k=>{const ex=cents*pesos[k]/soma,f=Math.floor(ex);out[k]=f;usado+=f;rest.push([k,ex-f]);});

  // ---- COMPARATIVO mês a mês ----
  async function viewComparativo(){
    document.getElementById('content').innerHTML='<div class="loading"><span class="spin"></span> Calculando...</div>';
    await carregarLancAno();
    const meses=Array.from({length:12},()=>({entrada:0,saida:0}));
    LANC_ANO.forEach(l=>{
      const g=l.categorias&&l.categorias.grupo;if(g==='neutra')return;
      const m=parseInt(l.data.split('-')[1],10)-1;const v=Number(l.valor);
      if(v>0)meses[m].entrada+=v;else meses[m].saida+=Math.abs(v);
    });
    const comDados=[];meses.forEach((m,i)=>{if(m.entrada||m.saida)comDados.push(i);});

    const rows=comDados.map(i=>{
      const m=meses[i];const res=m.entrada-m.saida;

  async function bkBaixar(id){if(!id)return;const {data,error}=await sb.from('backups').select('criado_em,dados').eq('id',id).single();if(error||!data){toast('Não consegui baixar: '+((error&&error.message)||''),'erro');return;}

  function bkRestaurarAbrir(id){const b=BK_LISTA.find(x=>x.id===id);if(!b)return;

  async function bkRestaurar(id){const senha=(document.getElementById('bkSenha')||{}).value||'',err=document.getElementById('bkErr'),btn=document.getElementById('bkOk');

  async function restaurarLix(lixId){
    if(!podeExcluir()){toast('Seu acesso não restaura. Peça ao Lucas ou à Heloísa.','erro');return;}
    const {data:lix}=await sb.from('lixeira').select('*').eq('id',lixId).single();
    if(!lix){toast('Não encontrado','erro');return;}
    if(lix.restaurado_em){toast('Esse já foi restaurado.','erro');return;}
    const l=lix.dados;
    // remove campos que o banco gera sozinho
    delete l.id;delete l.criado_em;delete l.categorias;delete l.contatos;delete l.contas;Object.keys(l).forEach(k=>{if(k.startsWith('_'))delete l[k];});
    if(bloqueadoPorFechamento(l.data,l.conta_id))return;
    const {error}=await sb.from('lancamentos').insert(l);
    if(error){toast('Erro ao restaurar: '+error.message,'erro');return;}
    const {error:eUp}=await sb.from('lixeira').update({restaurado_em:new Date().toISOString(),restaurado_por:USER.id}).eq('id',lixId);
    if(eUp)await sb.from('lixeira').delete().eq('id',lixId); // banco antigo sem as colunas: some da lista como antes
    toast('Restaurado!','ok');viewLixeira();
  }

  // mesma conta do Caixinha (calcMes): abertura = tudo antes do dia 1º; fechamento = abertura + entradas + reposições + guardado − saídas − empréstimos − depósitos
  function cxCalcMes(k,ano,mes){
    const first=`${ano}-${String(mes).padStart(2,'0')}-01`,pref=`${ano}-${String(mes).padStart(2,'0')}`;
    // Regra oficial do Caixinha: dinheiro = (entrada + reposicao + guardado) − (saida + emprestimo + deposito);
    // emprestado a receber = max(Σ emprestimo − Σ reposicao, 0), QUALQUER contraparte (loja, pessoa ou em branco). Lançamentos excluídos já ficam de fora na carga.
    let abertura=0,ent=0,sai=0,emp=0,rep=0,dep=0,gua=0,empAntes=0,repAntes=0,empTudo=0,repTudo=0;
    k.mov.forEach(m=>{const v=(m.tipo==='entrada'||m.tipo==='reposicao'||m.tipo==='guardado')?m.valor:-m.valor;
      if(m.tipo==='emprestimo')empTudo+=m.valor;else if(m.tipo==='reposicao')repTudo+=m.valor;
      if((m.data||'')<first){abertura+=v;if(m.tipo==='emprestimo')empAntes+=m.valor;else if(m.tipo==='reposicao')repAntes+=m.valor;}
      else if((m.data||'').slice(0,7)===pref){if(m.tipo==='entrada')ent+=m.valor;else if(m.tipo==='saida')sai+=m.valor;else if(m.tipo==='emprestimo')emp+=m.valor;else if(m.tipo==='reposicao')rep+=m.valor;else if(m.tipo==='deposito')dep+=m.valor;else if(m.tipo==='guardado')gua+=m.valor;}});
    // IGUAL AO CAIXINHA v57 (aReceberAte): emprestado em 01/MM = empréstimos − reposições com data ANTES do dia 1º;
    // no fim do mês = com data ATÉ o último dia. Qualquer contraparte. Nunca negativo.
    const abEmp=Math.max(empAntes-repAntes,0), fimEmp=Math.max(empAntes+emp-(repAntes+rep),0);
    const fechamento=abertura+ent+rep+gua-sai-emp-dep;
    return {abertura,abEmp,empAntes,repAntes,ent,sai,emp,rep,dep,gua,fechamento,fimEmp,aReceber:fimEmp,totalAbertura:abertura+abEmp,totalFim:fechamento+fimEmp};
  }
  // saídas do mês lançadas pelo login da própria loja (Rocha N / GV Optical) — a Rhaiane confere; e saídas sem categoria
  function cxConferir(k,mi){const pref=`${ANO_FIXO}-${_mm(mi)}`;let loja=0,semCat=0,lojaSemCat=0;
    k.mov.forEach(m=>{if(m.tipo!=='saida'||(m.data||'').slice(0,7)!==pref)return;const porLoja=/^(rocha\s*\d+|gv)/i.test(m.por||'');if(porLoja)loja++;if(!m.cat){semCat++;if(porLoja)lojaSemCat++;}});

  function cxFaltaRecolher(k){
    const movs=(k.mov||[]).filter(m=>(m.data||'')>=CX_INICIO_RECOLHER&&(m.tipo==='guardado'||(m.tipo==='deposito'&&!m.para))).slice().sort((a,b)=>((a.data||'')<(b.data||'')?-1:(a.data||'')>(b.data||'')?1:((a.id||0)<(b.id||0)?-1:1)));
    const fila=[];movs.forEach(m=>{if(m.tipo==='guardado'){if(!m.recolhido)fila.push(m.valor);}else{let d=m.valor;while(d>0&&fila.length){if(fila[0]<=d){d-=fila.shift();}else{fila[0]-=d;d=0;}}}});

  function _cxEstornos(ct){const pgs=Array.isArray(ct.pagamentos)?ct.pagamentos:[];if(pgs.length)return pgs.map(p=>({v:Number(p.v)||0,d:p.d||ct.data||''}));const vp=Number(ct.valor_pago)||0;return vp>0?[{v:vp,d:ct.pago_data||ct.data||''}]:[];}

  function cxBancoResumo(kId,ano,mes){
    const pref=`${ano}-${String(mes).padStart(2,'0')}`,ultimo=new Date(ano,mes,0).getDate(),fimMes=`${pref}-${String(ultimo).padStart(2,'0')}`;
    const antes=new Date(ano,mes-1,0),diaAntes=`${antes.getFullYear()}-${String(antes.getMonth()+1).padStart(2,'0')}-${String(antes.getDate()).padStart(2,'0')}`;

    lista.forEach(ct=>{inicio+=_cxAbertoAte(ct,diaAntes);const d=ct.data||'';if(d.slice(0,7)===pref)emprestado+=Number(ct.valor)||0;_cxEstornos(ct).forEach(p=>{if((p.d||'').slice(0,7)===pref&&(p.d||'')<=corte)voltou+=p.v;});fim+=_cxAbertoAte(ct,corte);});

  function donut(itens,total,tipo){
